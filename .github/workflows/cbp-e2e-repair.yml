name: Repair CBP browser fixture isolation

on:
  push:
    branches: [codex/maps-county-business-patterns]

concurrency:
  group: cbp-e2e-repair
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/maps-county-business-patterns

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Isolate CBP map-layer capability to its browser spec
        run: |
          python - <<'PY'
          from pathlib import Path

          facade_path = Path('apps/discovery-ui-e2e/src/support/repository-api-mocks.ts')
          facade = facade_path.read_text()
          call = '  await mockMapLayersWithCountyBusinessPatterns(page);\n'
          if facade.count(call) != 2:
              raise SystemExit(f'Expected two global CBP map-layer calls, found {facade.count(call)}')
          facade = facade.replace(call, '')
          start = facade.index('async function mockMapLayersWithCountyBusinessPatterns(')
          end = facade.index('async function mockCountyBusinessPatterns(', start)
          facade = facade[:start] + facade[end:]
          facade_path.write_text(facade)

          spec_path = Path('apps/discovery-ui-e2e/src/county-business-patterns.spec.ts')
          spec = spec_path.read_text()
          spec = spec.replace(
              "import { expect, test } from '@playwright/test';",
              "import { expect, test, type Page } from '@playwright/test';",
              1,
          )
          marker = "const cbpLayers = [\n  'county-business-patterns-county-fill',\n  'county-business-patterns-county-outline',\n] as const;\n\n"
          if marker not in spec:
              raise SystemExit('CBP layer marker not found')
          fixture = '''async function installCountyBusinessPatternsCapability(page: Page): Promise<void> {
            await page.route('**/api/datasets/*/map-layers', async (route) => {
              const pathname = new URL(route.request().url()).pathname.toLowerCase();
              const geography = pathname.includes('california')
                ? 'California'
                : pathname.includes('texas')
                  ? 'Texas'
                  : 'North Dakota';
              const slug = geography.toLowerCase().replaceAll(' ', '-');

              await route.fulfill({
                contentType: 'application/json',
                json: [
                  {
                    id: 'tiger-line-boundary-preview',
                    label: `2025 TIGER/Line Census area preview - ${geography}`,
                    layerType: 'CENSUS_BOUNDARY',
                    sourceUrl:
                      'https://www.census.gov/geographies/mapping-files/time-series/geo/tiger-line-file.html',
                    attribution: 'U.S. Census Bureau TIGER/Line',
                    visibleByDefault: true,
                  },
                  {
                    id: 'lodes-workplace-flow-sample',
                    label: `2023 LODES commuting flows - ${geography}`,
                    layerType: 'CENSUS_DATA',
                    sourceUrl: 'https://lehd.ces.census.gov/data/',
                    attribution:
                      'U.S. Census Bureau LEHD Origin-Destination Employment Statistics',
                    visibleByDefault: true,
                  },
                  {
                    id: `saipe-county-poverty-${slug}`,
                    label: `2023 SAIPE county poverty - ${geography}`,
                    layerType: 'CENSUS_CHOROPLETH',
                    sourceUrl:
                      'https://www.census.gov/data/datasets/2023/demo-saipe/2023-state-and-county.html',
                    attribution:
                      'U.S. Census Bureau Small Area Income and Poverty Estimates',
                    visibleByDefault: false,
                  },
                  {
                    id: `population-estimates-county-${slug}`,
                    label: `Vintage 2025 county Population Estimates - ${geography}`,
                    layerType: 'CENSUS_CHOROPLETH',
                    sourceUrl:
                      'https://www2.census.gov/programs-surveys/popest/datasets/2020-2025/counties/totals/co-est2025-alldata.csv',
                    attribution: 'U.S. Census Bureau Population Estimates Program',
                    visibleByDefault: false,
                  },
                  {
                    id: `county-business-patterns-${slug}`,
                    label: `2023 County Business Patterns - ${geography}`,
                    layerType: 'CENSUS_CHOROPLETH',
                    sourceUrl:
                      'https://www2.census.gov/programs-surveys/cbp/datasets/2023/cbp23co.zip',
                    attribution: 'U.S. Census Bureau County Business Patterns',
                    visibleByDefault: false,
                  },
                  {
                    id: 'usgs-3hp-hydrography',
                    label: 'USGS 3D Hydrography Program reference',
                    layerType: 'USGS_REFERENCE',
                    sourceUrl:
                      'https://hydro.nationalmap.gov/arcgis/rest/services/3DHP_all/MapServer',
                    attribution: 'U.S. Geological Survey 3D Hydrography Program',
                    visibleByDefault: false,
                    rasterTileUrlTemplate:
                      '/overlays/usgs/hydrography/export?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=256,256&f=image&transparent=true',
                  },
                  {
                    id: 'usgs-earthquakes-preview',
                    label: 'USGS earthquake overlay',
                    layerType: 'USGS_EARTHQUAKE',
                    sourceUrl:
                      'https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson',
                    attribution: 'U.S. Geological Survey Earthquake Hazards Program',
                    visibleByDefault: true,
                  },
                ],
              });
            });
          }

          '''
          spec = spec.replace(marker, marker + fixture, 1)
          old = "  test.beforeEach(async ({ page }) => {\n    await mockRepositoryApi(page);\n  });"
          new = "  test.beforeEach(async ({ page }) => {\n    await mockRepositoryApi(page);\n    await installCountyBusinessPatternsCapability(page);\n  });"
          if old not in spec:
              raise SystemExit('CBP beforeEach anchor not found')
          spec = spec.replace(old, new, 1)
          spec_path.write_text(spec)
          PY

      - name: Format fixture changes
        run: |
          pnpm exec prettier --write \
            apps/discovery-ui-e2e/src/support/repository-api-mocks.ts \
            apps/discovery-ui-e2e/src/county-business-patterns.spec.ts
          pnpm exec prettier --check \
            apps/discovery-ui-e2e/src/support/repository-api-mocks.ts \
            apps/discovery-ui-e2e/src/county-business-patterns.spec.ts

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run focused Maps browser regression
        run: |
          pnpm exec playwright test \
            --config=apps/discovery-ui-e2e/playwright.config.mts \
            apps/discovery-ui-e2e/src/county-business-patterns.spec.ts \
            apps/discovery-ui-e2e/src/map-layers.spec.ts \
            apps/discovery-ui-e2e/src/accessibility-structure.spec.ts \
            --project=chromium

      - name: Commit repair and remove temporary workflow
        run: |
          git rm .github/workflows/cbp-e2e-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/discovery-ui-e2e/src/support/repository-api-mocks.ts \
            apps/discovery-ui-e2e/src/county-business-patterns.spec.ts
          git commit -m "test(maps): isolate County Business Patterns browser fixtures"
          git push origin HEAD:codex/maps-county-business-patterns
