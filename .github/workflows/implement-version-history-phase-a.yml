name: Implement artifact version history foundation

on:
  push:
    branches:
      - feat/artifact-version-provenance

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/artifact-version-provenance
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply version-history foundation
        shell: bash
        run: |
          set -euo pipefail
          git show 9197ab492b391b59b9788fa44965102d088591ec:.github/workflows/implement-version-history-phase-a.yml > /tmp/original-version-history-runner.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          lines = Path('/tmp/original-version-history-runner.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start:end])) + '\n'
          Path('/tmp/apply-version-history.py').write_text(script)
          PY
          python /tmp/apply-version-history.py

      - name: Normalize focused version-history effect fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/discovery-ui/src/app/state/datasets/datasets.effects.spec.ts')
          text = path.read_text()

          blocks = {
              'loads detail, versions, and map layers together for one dataset': '''  it('loads detail, versions, and map layers together for one dataset', async () => {
            const getDataset = vi.fn().mockReturnValue(of(detail));
            const getDatasetVersions = vi.fn().mockReturnValue(of(versions));
            const getDatasetMapLayers = vi.fn().mockReturnValue(of(mapLayers));
            const effects = setup(
              { getDataset, getDatasetVersions } as unknown as RepositoryDatasetsApi,
              { getDatasetMapLayers } as unknown as RepositoryMapsApi,
              of(
                DatasetsActions.datasetOpened({
                  datasetId: 'tiger-line-north-dakota-2025',
                }),
              ),
            );

            const emitted = await firstValueFrom(effects.openDataset$);

            expect(getDataset).toHaveBeenCalledWith('tiger-line-north-dakota-2025');
            expect(getDatasetVersions).toHaveBeenCalledWith(
              'tiger-line-north-dakota-2025',
            );
            expect(getDatasetMapLayers).toHaveBeenCalledWith(
              'tiger-line-north-dakota-2025',
            );
            expect(emitted).toEqual(
              DatasetsActions.datasetLoaded({
                detail,
                versions,
                versionHistoryStatus: 'OBSERVED_CURRENT_ONLY',
                mapLayers,
              }),
            );
          });''',
              'loads federated research detail without dataset-only enrichments': '''  it('loads federated research detail without dataset-only enrichments', async () => {
            const getResearchObject = vi.fn().mockReturnValue(of(federatedDetail));
            const getDataset = vi.fn();
            const getDatasetVersions = vi.fn();
            const getResearchObjectVersions = vi.fn().mockReturnValue(
              of({
                ...versionHistory,
                researchObjectId: federatedDetail.id,
                versions: [
                  {
                    id: federatedDetail.id,
                    label: federatedDetail.title,
                    current: true,
                    sourceUrl: federatedDetail.sourceUrl,
                  },
                ],
              }),
            );
            const getDatasetMapLayers = vi.fn();
            const researchId = 'REFUQV9HT1Y6aHR0cHM6Ly9leGFtcGxlLmdvdg';
            const effects = setup(
              {
                getResearchObject,
                getDataset,
                getDatasetVersions,
                getResearchObjectVersions,
              } as unknown as RepositoryDatasetsApi,
              { getDatasetMapLayers } as unknown as RepositoryMapsApi,
              of(DatasetsActions.researchOpened({ researchId })),
            );

            const emitted = await firstValueFrom(effects.openResearch$);

            expect(getResearchObject).toHaveBeenCalledWith(researchId);
            expect(getDataset).not.toHaveBeenCalled();
            expect(getDatasetVersions).not.toHaveBeenCalled();
            expect(getResearchObjectVersions).toHaveBeenCalledWith(researchId);
            expect(getDatasetMapLayers).not.toHaveBeenCalled();
            expect(emitted).toEqual(
              DatasetsActions.datasetLoaded({
                detail: federatedDetail,
                versions: [
                  {
                    id: federatedDetail.id,
                    label: federatedDetail.title,
                    current: true,
                    sourceUrl: federatedDetail.sourceUrl,
                  },
                ],
                versionHistoryStatus: 'OBSERVED_CURRENT_ONLY',
                mapLayers: [],
              }),
            );
          });''',
              'preserves repository versions and map layers through the canonical research route': '''  it('preserves repository versions and map layers through the canonical research route', async () => {
            const getResearchObject = vi.fn().mockReturnValue(of(detail));
            const getDatasetVersions = vi.fn();
            const getResearchObjectVersions = vi.fn().mockReturnValue(of(versionHistory));
            const getDatasetMapLayers = vi.fn().mockReturnValue(of(mapLayers));
            const researchId = 'dGlnZXItbGluZS1ub3J0aC1kYWtvdGEtMjAyNQ';
            const effects = setup(
              {
                getResearchObject,
                getDatasetVersions,
                getResearchObjectVersions,
              } as unknown as RepositoryDatasetsApi,
              { getDatasetMapLayers } as unknown as RepositoryMapsApi,
              of(DatasetsActions.researchOpened({ researchId })),
            );

            const emitted = await firstValueFrom(effects.openResearch$);

            expect(getResearchObject).toHaveBeenCalledWith(researchId);
            expect(getDatasetVersions).not.toHaveBeenCalled();
            expect(getResearchObjectVersions).toHaveBeenCalledWith(researchId);
            expect(getDatasetMapLayers).toHaveBeenCalledWith(detail.id);
            expect(emitted).toEqual(
              DatasetsActions.datasetLoaded({
                detail,
                versions,
                versionHistoryStatus: 'OBSERVED_CURRENT_ONLY',
                mapLayers,
              }),
            );
          });''',
          }

          for name, replacement in blocks.items():
              pattern = re.compile(
                  r"  it\('" + re.escape(name) + r"', async \(\) => \{.*?^  \}\);",
                  re.MULTILINE | re.DOTALL,
              )
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'could not normalize test block: {name}')

          path.write_text(text)
          PY

      - name: Regenerate OpenAPI TypeScript contract
        run: pnpm run openapi:generate

      - name: Format implementation
        run: pnpm exec nx format:write --all

      - name: Validate OpenAPI schema
        run: pnpm run openapi:lint

      - name: Validate API client and discovery UI
        run: |
          pnpm exec nx test repository-api-client --skip-nx-cache
          pnpm exec nx test discovery-ui --skip-nx-cache
          pnpm exec nx lint discovery-ui
          pnpm exec nx build discovery-ui --configuration=production --skip-nx-cache

      - name: Validate repository API
        run: pnpm exec nx test repository-api --skip-nx-cache

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/openapi/repository-api.yaml \
            libs/repository/api-client/src/generated/repository-api.types.ts \
            libs/repository/api-client/src/lib/repository-api-client.ts \
            libs/repository/api-client/src/lib/repository-api-client.spec.ts \
            apps/repository-api/src/main/java/org/civicsrepo/datasets/DatasetService.java \
            apps/repository-api/src/main/java/org/civicsrepo/research/ResearchObjectService.java \
            apps/repository-api/src/main/java/org/civicsrepo/research/ResearchObjectController.java \
            apps/repository-api/src/test/java/org/civicsrepo/datasets/DatasetServiceTest.java \
            apps/repository-api/src/test/java/org/civicsrepo/research/ResearchObjectControllerTest.java \
            apps/discovery-ui/src/app/state/datasets/datasets.actions.ts \
            apps/discovery-ui/src/app/state/datasets/datasets.reducer.ts \
            apps/discovery-ui/src/app/state/datasets/datasets.selectors.ts \
            apps/discovery-ui/src/app/state/datasets/datasets.effects.ts \
            apps/discovery-ui/src/app/state/datasets/datasets.effects.spec.ts \
            apps/discovery-ui/src/app/pages/dataset-detail-page.ts \
            apps/discovery-ui/src/app/pages/dataset-detail-page.html
          git commit -m "feat: add truthful artifact version history foundation"
          git push origin HEAD:feat/artifact-version-provenance
