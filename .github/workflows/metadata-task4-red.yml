name: Metadata Task 4 RED

on:
  push:
    branches:
      - feat/open-census-metadata-profile
    paths:
      - '.github/workflows/metadata-task4-red.yml'
      - 'apps/repository-api/src/test/java/org/civicsrepo/dspace/DspaceItemPayloadMapperTest.java'
      - 'apps/repository-api/src/test/java/org/civicsrepo/dspace/DspaceItemDiffPlannerTest.java'
      - 'apps/repository-api/src/test/java/org/civicsrepo/dspace/DspaceRestItemWriteGatewayTest.java'

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/open-census-metadata-profile
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify DSpace structured-access contract is RED
        shell: bash
        run: |
          set +e
          pnpm nx test repository-api > /tmp/task4-red.log 2>&1
          status=$?
          set -e
          cat /tmp/task4-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected Task 4 DSpace contract to fail before implementation.' >&2
            exit 1
          fi
          grep -Eq 'ACCESS_(MECHANISM|URL|INSTRUCTIONS|RESTRICTION_BASIS)_FIELD|cannot find symbol' /tmp/task4-red.log
