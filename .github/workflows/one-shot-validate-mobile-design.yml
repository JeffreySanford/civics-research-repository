name: One-shot validate mobile design lifecycle evidence

on:
  push:
    branches:
      - docs/mobile-design-lifecycle-evidence

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format repository files
        run: pnpm exec nx format:write --all

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint mobile frontend
        run: pnpm nx lint census-mobile-frontend

      - name: Test mobile frontend
        run: pnpm nx test census-mobile-frontend --skip-nx-cache

      - name: Build mobile frontend
        run: pnpm nx build census-mobile-frontend --configuration=production --skip-nx-cache

      - name: Commit formatted evidence and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-validate-mobile-design.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format mobile design lifecycle evidence"
          git push
