name: Metadata Task 7 Catalog

on:
  push:
    branches:
      - feat/open-census-metadata-profile
    paths:
      - '.github/workflows/metadata-task7-catalog.yml'

permissions:
  contents: write

jobs:
  author-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/open-census-metadata-profile

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Author evidence-backed CODE and ORCID metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const path = 'tools/dspace/catalog.json';
          const catalog = JSON.parse(readFileSync(path, 'utf8'));

          const publication = catalog.researchObjects.find(
            (item) => item.id === 'ces-wp-25-23-spatial-mismatch',
          );
          if (!publication) {
            throw new Error('CES-25-23 catalog object is missing.');
          }
          const davidCard = publication.authors?.find(
            (author) => author.name === 'David Card',
          );
          if (!davidCard) {
            throw new Error('David Card author record is missing from CES-25-23.');
          }
          davidCard.orcid = '0000-0001-6914-6698';

          const codeId = 'census-data-api-mcp-v0-1-2-beta';
          if (!catalog.researchObjects.some((item) => item.id === codeId)) {
            catalog.researchObjects.push({
              id: codeId,
              enabled: true,
              resourceType: 'CODE',
              program: 'OTHER',
              title: 'U.S. Census Bureau Data API MCP v0.1.2-beta',
              abstract:
                'Official U.S. Census Bureau Model Context Protocol server that connects AI assistants with the Census Data API and other official Census Bureau sources.',
              publisher: 'census',
              issued: '2026-03-06',
              vintage: 2026,
              geography: 'United States',
              geographyLevel: 'National',
              sourceUrl:
                'https://github.com/uscensusbureau/us-census-bureau-data-api-mcp/releases/tag/v0.1.2-beta',
              documentationUrl:
                'https://github.com/uscensusbureau/us-census-bureau-data-api-mcp',
              citation:
                'U.S. Census Bureau. U.S. Census Bureau Data API MCP, v0.1.2-beta. March 6, 2026.',
              subjects: [
                'Census Data API',
                'Model Context Protocol',
                'Software',
                'AI assistants',
              ],
              access: 'PUBLIC',
              license: 'CC0-1.0 (Creative Commons Zero v1.0 Universal).',
              authors: [],
              relations: [],
              files: [
                {
                  id: 'source-archive',
                  label: 'v0.1.2-beta source archive',
                  format: 'ZIP',
                  url: 'https://github.com/uscensusbureau/us-census-bureau-data-api-mcp/archive/refs/tags/v0.1.2-beta.zip',
                },
                {
                  id: 'source-repository',
                  label: 'Official Census Bureau source repository',
                  format: 'OTHER',
                  url: 'https://github.com/uscensusbureau/us-census-bureau-data-api-mcp',
                },
              ],
            });
          }

          writeFileSync(path, `${JSON.stringify(catalog, null, 2)}\n`);
          NODE

          pnpm exec prettier --write tools/dspace/catalog.json
          pnpm dspace:saf:generate
          node --test tools/scripts/metadata-profile-contract.test.mjs
          pnpm fixture:check
          git diff --check

      - name: Commit authoritative catalog and generated fixture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/dspace/catalog.json \
            apps/repository-api/src/main/resources/discovery-fixture-catalog.json
          git diff --cached --quiet && exit 0
          git commit -m 'feat(metadata): add code and ORCID representatives'
          git push origin HEAD:feat/open-census-metadata-profile
