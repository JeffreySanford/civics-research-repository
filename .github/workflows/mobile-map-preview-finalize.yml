name: Mobile map preview finalize

on:
  push:
    branches:
      - feat/mobile-research-map-preview

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/mobile-research-map-preview
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reuse bootstrap implementation generator
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/mobile-map-preview-bootstrap.yml')
          lines = workflow.read_text().splitlines()
          marker = '      - name: Implement mobile research map preview'
          start = lines.index(marker)
          run_index = next(
              index for index in range(start + 1, len(lines))
              if lines[index] == '        run: |'
          )
          end = next(
              index for index in range(run_index + 1, len(lines))
              if lines[index].startswith('      - name: ')
          )
          body = []
          for line in lines[run_index + 1:end]:
              if line.startswith('          '):
                  body.append(line[10:])
              else:
                  body.append(line)
          Path('/tmp/mobile-map-implement.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/mobile-map-implement.sh
      - name: Apply accessibility fixes and remove temporary alias
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          template = Path('apps/census-mobile-frontend/src/app/mobile-research-map/mobile-research-map-preview.component.html')
          text = template.read_text()
          replacements = [
              (
                  """      <h3 id=\"mobile-coverage-heading\">\n        {{ expanded ? 'Research map' : 'Map matching research' }}\n      </h3>""",
                  """      <h2 id=\"mobile-coverage-heading\">\n        {{ expanded ? 'Publisher spatial coverage' : 'Map matching research' }}\n      </h2>""",
              ),
              (
                  """    <div\n      #mapCanvas\n      class=\"coverage-map__canvas\"\n      data-testid=\"mobile-research-map-canvas\"\n      aria-hidden=\"true\"\n    ></div>""",
                  """    <div\n      #mapCanvas\n      class=\"coverage-map__canvas\"\n      data-testid=\"mobile-research-map-canvas\"\n      [attr.aria-hidden]=\"interactive ? null : 'true'\"\n    ></div>""",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'generated accessibility anchor not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
          template.write_text(text)

          styles = Path('apps/census-mobile-frontend/src/app/mobile-research-map/mobile-research-map-preview.component.scss')
          style_text = styles.read_text()
          if '.coverage-card h3' not in style_text:
              raise SystemExit('generated coverage-card h3 style anchor not found')
          styles.write_text(style_text.replace('.coverage-card h3', '.coverage-card h2'))

          config = Path('apps/census-mobile-frontend-e2e/playwright.config.mts')
          config_text = config.read_text()
          alias = """    {\n      // Temporary alias for the #106 one-shot validator. Removed after the\n      // validated feature commit lands; it is behaviorally identical to chromium-320.\n      name: 'chromium',\n      use: {\n        ...devices['Desktop Chrome'],\n        viewport: { width: 320, height: 800 },\n      },\n    },\n"""
          if alias not in config_text:
              raise SystemExit('temporary chromium alias not found')
          config.write_text(config_text.replace(alias, '', 1))
          PY
      - name: Format implementation
        run: pnpm exec nx format:write
      - name: Check formatting
        run: pnpm exec nx format:check
      - name: Lint mobile applications
        run: pnpm exec nx run-many -t lint -p census-mobile-frontend,census-mobile-frontend-e2e --skip-nx-cache
      - name: Test mobile frontend
        run: pnpm exec nx test census-mobile-frontend --skip-nx-cache
      - name: Build mobile frontend
        run: pnpm exec nx build census-mobile-frontend --skip-nx-cache
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run focused mobile map evidence
        run: pnpm exec playwright test --config=apps/census-mobile-frontend-e2e/playwright.config.mts apps/census-mobile-frontend-e2e/src/research-map-preview.spec.ts --project=chromium-320
      - name: Commit validated feature files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/census-mobile-frontend \
            apps/census-mobile-frontend-e2e \
            mobile-first/planning/backlog.md
          git diff --cached --check
          git commit -m "feat(mobile): add research coverage map preview"
          git push origin HEAD:feat/mobile-research-map-preview
