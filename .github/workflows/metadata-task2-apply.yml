name: Metadata Task 2 Apply

on:
  push:
    branches:
      - feat/open-census-metadata-profile
    paths:
      - '.github/workflows/metadata-task2-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/open-census-metadata-profile
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Reconcile latest branch and install dependencies
        run: |
          git pull --rebase origin feat/open-census-metadata-profile
          pnpm install --frozen-lockfile

      - name: Apply structured restricted-access metadata
        run: python tools/scripts/apply-metadata-task2.py

      - name: Format authored sources
        run: |
          pnpm exec prettier --write \
            tools/dspace/catalog.json \
            tools/scripts/generate-saf.mjs \
            tools/scripts/metadata-profile-contract.test.mjs

      - name: Regenerate SAF and fixture
        run: pnpm dspace:saf:generate

      - name: Verify generated Task 2 content before commit
        run: |
          node --test tools/scripts/metadata-profile-contract.test.mjs

          metadata='tools/dspace/saf/datasets/lehd-microdata-restricted/metadata_crr.xml'
          grep -F '<dcvalue element="access" qualifier="mechanism">FSRDC</dcvalue>' "$metadata"
          grep -F '<dcvalue element="access" qualifier="url">https://www.census.gov/about/adrm/fsrdc.html</dcvalue>' "$metadata"
          grep -F '<dcvalue element="access" qualifier="instructions">Access requires an approved research proposal and Special Sworn Status through a Federal Statistical Research Data Center.</dcvalue>' "$metadata"
          grep -F '<dcvalue element="access" qualifier="restrictionbasis">Title 13, U.S. Code</dcvalue>' "$metadata"
          git diff --check

      - name: Create local Task 2 commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/dspace/catalog.json \
            tools/dspace/crr-types.xml \
            tools/scripts/generate-saf.mjs \
            tools/scripts/metadata-profile-contract.test.mjs \
            apps/repository-api/src/main/resources/discovery-fixture-catalog.json
          git commit -m 'feat(metadata): model structured restricted access'

      - name: Rebase and verify committed drift gate
        run: |
          git pull --rebase origin feat/open-census-metadata-profile
          pnpm dspace:saf:generate
          pnpm fixture:check
          node --test tools/scripts/metadata-profile-contract.test.mjs

          metadata='tools/dspace/saf/datasets/lehd-microdata-restricted/metadata_crr.xml'
          grep -F '<dcvalue element="access" qualifier="mechanism">FSRDC</dcvalue>' "$metadata"
          grep -F '<dcvalue element="access" qualifier="url">https://www.census.gov/about/adrm/fsrdc.html</dcvalue>' "$metadata"
          grep -F '<dcvalue element="access" qualifier="instructions">Access requires an approved research proposal and Special Sworn Status through a Federal Statistical Research Data Center.</dcvalue>' "$metadata"
          grep -F '<dcvalue element="access" qualifier="restrictionbasis">Title 13, U.S. Code</dcvalue>' "$metadata"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Push verified Task 2 commit
        run: git push origin HEAD:feat/open-census-metadata-profile
