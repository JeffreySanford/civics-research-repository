name: PR91 traceability formatting

on:
  push:
    branches:
      - codex/mobile-first-census-pr91-shareable-filters
    paths:
      - .github/workflows/pr91-format-traceability.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/mobile-first-census-pr91-shareable-filters

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format traceability evidence
        run: pnpm exec prettier --write mobile-first/documentation/requirements/mobile-search-traceability.md

      - name: Remove one-shot formatter
        run: rm .github/workflows/pr91-format-traceability.yml

      - name: Commit exact repository formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: format pr91 traceability evidence"

      - name: Push formatted branch
        run: git push origin HEAD:codex/mobile-first-census-pr91-shareable-filters
