name: Format planning docs diagnostic

on:
  push:
    paths:
      - '.github/workflows/format-planning-docs.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format targeted planning docs
        run: >-
          pnpm exec prettier --write
          documentation/cloud/local-kubernetes-search-cluster.md
          documentation/federation/million-record-corpus.md
          documentation/federation/source-ingestion-plan.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatted-planning-docs
          path: |
            documentation/cloud/local-kubernetes-search-cluster.md
            documentation/federation/million-record-corpus.md
            documentation/federation/source-ingestion-plan.md
