name: PR 24 env-loader hardening

on:
  push:
    branches:
      - codex/c2-datagov-spatial-source-probe
    paths:
      - .github/workflows/pr24-env-loader.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/c2-datagov-spatial-source-probe
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply env-loader contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(file, before, after) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(before)) {
              throw new Error(`Missing expected text in ${file}: ${before}`);
            }
            fs.writeFileSync(file, source.replace(before, after));
          }

          replaceExact(
            'package.json',
            '"research:spatial:probe": "node tools/scripts/data-gov-spatial-availability.mjs --expect 500000"',
            '"research:spatial:probe": "node --env-file-if-exists=.env tools/scripts/data-gov-spatial-availability.mjs --expect 500000"'
          );

          replaceExact(
            '.env.sample',
            '# Data.gov Catalog API v4 — REQUIRED for meaningful harvesting beyond tiny exploratory requests.\n# DEMO_KEY remains the Docker Compose fallback only so a fresh local stack can make a trivial request.\nCIVICS_FEDERATION_DATA_GOV_API_KEY=YOUR_API_DATA_GOV_KEY_HERE',
            '# Data.gov Catalog API v4 — REQUIRED for meaningful harvesting beyond tiny exploratory requests.\n# Host-side research commands load repo-local .env automatically when it exists; an already-exported\n# environment value takes precedence. Copy this sample to .env and replace the placeholder with your\n# own api.data.gov key to reproduce sustained/certified evidence runs. DEMO_KEY remains the Docker\n# Compose fallback only so a fresh container stack can make a trivial bounded request.\nCIVICS_FEDERATION_DATA_GOV_API_KEY=YOUR_API_DATA_GOV_KEY_HERE'
          );

          replaceExact(
            'tools/scripts/data-gov-spatial-availability.test.mjs',
            "import { mkdtemp, rm, writeFile } from 'node:fs/promises';",
            "import { mkdtemp, readFile, rm, writeFile } from 'node:fs/promises';"
          );

          replaceExact(
            'tools/scripts/data-gov-spatial-availability.test.mjs',
            "test('requires a personal Data.gov API key for full traversal', () => {",
            "test('research spatial probe auto-loads repo-local .env', async () => {\n  const packageJson = JSON.parse(\n    await readFile(new URL('../../package.json', import.meta.url), 'utf8'),\n  );\n  assert.equal(\n    packageJson.scripts['research:spatial:probe'],\n    'node --env-file-if-exists=.env tools/scripts/data-gov-spatial-availability.mjs --expect 500000',\n  );\n});\n\ntest('requires a personal Data.gov API key for full traversal', () => {"
          );
          NODE
          pnpm exec prettier --write package.json tools/scripts/data-gov-spatial-availability.test.mjs
      - name: Verify focused suite
        run: node --test tools/scripts/data-gov-spatial-availability.test.mjs
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .env.sample tools/scripts/data-gov-spatial-availability.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: auto-load local env for spatial evidence"
          git push origin HEAD:codex/c2-datagov-spatial-source-probe
