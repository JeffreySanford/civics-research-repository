name: Mobile-first PR2 format

on:
  push:
    branches:
      - codex/mobile-first-census-pr2-scaffold
    paths:
      - .github/workflows/mobile-first-pr2-format.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/mobile-first-census-pr2-scaffold
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format mobile scaffold
        run: pnpm exec prettier --write apps/census-mobile-frontend/eslint.config.mjs apps/census-mobile-frontend/src/app/app.html
      - name: Commit formatted files and remove one-shot workflow
        run: |
          rm .github/workflows/mobile-first-pr2-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format mobile-first Census scaffold"
          git push origin HEAD:codex/mobile-first-census-pr2-scaffold
