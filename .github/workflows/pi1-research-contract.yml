name: PI-1 Research Contract

on:
  push:
    branches:
      - codex/federated-metadata-catalog

permissions:
  contents: write

jobs:
  contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply contract patch
        run: node tools/scripts/pi1-research-contract-patch.mjs
      - name: Inspect patched parameters
        run: nl -ba schemas/openapi/repository-api.yaml | sed -n '625,675p'
      - name: Regenerate client types
        run: pnpm openapi:generate
      - name: Validate contract
        run: |
          pnpm openapi:lint
          pnpm openapi:check
      - name: Commit contract and generated types
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/openapi/repository-api.yaml libs/repository/api-client/src/generated/repository-api.types.ts
          git commit -m "Generate authority-neutral research contract"
          git push
