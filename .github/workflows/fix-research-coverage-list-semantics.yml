name: Fix Research Coverage list semantics

on:
  push:
    branches:
      - codex/searchable-research-map-coverage
    paths:
      - .github/workflows/fix-research-coverage-list-semantics.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/searchable-research-map-coverage
          persist-credentials: true
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wrap Research Coverage semantic content in a list item
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/discovery-ui/src/app/pages/maps-page.html')
          source = path.read_text()

          start = '''      <section
                  class="research-coverage-summary"
                  aria-labelledby="research-coverage-summary-heading"
                >'''
          replacement_start = '''      <li>
                <section
                  class="research-coverage-summary"
                  aria-labelledby="research-coverage-summary-heading"
                >'''

          end = '''      </section>
              } } @if (saipeVisible$ | async)'''
          replacement_end = '''        </section>
              </li>
              } } @if (saipeVisible$ | async)'''

          if source.count(start) != 1:
              raise SystemExit(f'Expected one Research Coverage section start; found {source.count(start)}')
          if source.count(end) != 1:
              raise SystemExit(f'Expected one Research Coverage section end; found {source.count(end)}')

          path.write_text(source.replace(start, replacement_start).replace(end, replacement_end))
          PY

      - name: Format template
        run: pnpm exec prettier --write apps/discovery-ui/src/app/pages/maps-page.html

      - name: Check formatting
        run: pnpm exec nx format:check --all

      - name: Test discovery UI
        run: pnpm nx run discovery-ui:test

      - name: Build discovery UI
        run: pnpm nx run discovery-ui:build

      - name: Commit semantic fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-research-coverage-list-semantics.yml
          git add apps/discovery-ui/src/app/pages/maps-page.html
          git commit -m 'fix: keep Research Coverage inside semantic list structure'
          git push origin HEAD:codex/searchable-research-map-coverage
