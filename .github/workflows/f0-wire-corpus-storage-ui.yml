name: F0 corpus storage UI wiring

on:
  push:
    branches:
      - codex/federated-metadata-catalog
    paths:
      - tools/scripts/f0-wire-corpus-storage-ui.py

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/federated-metadata-catalog
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python tools/scripts/f0-wire-corpus-storage-ui.py
      - run: pnpm exec prettier --write apps/discovery-ui/src/app/pages/admin-corpus-storage.component.ts apps/discovery-ui/src/app/pages/admin-viz/sync-pipeline.component.ts
      - run: git diff --check
      - name: Commit wired UI and remove helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/f0-wire-corpus-storage-ui.yml tools/scripts/f0-wire-corpus-storage-ui.py
          git add apps/discovery-ui/src/app/pages/admin-corpus-storage.component.ts apps/discovery-ui/src/app/pages/admin-viz/sync-pipeline.component.ts
          git commit -m "Wire corpus storage into Repository Sync"
          git push origin HEAD:codex/federated-metadata-catalog
