name: Mobile-first PR2 scaffold

on:
  push:
    branches: [codex/mobile-first-census-pr2-scaffold]

permissions:
  contents: write

env:
  NX_INTERACTIVE: 'false'

jobs:
  scaffold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/mobile-first-census-pr2-scaffold
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate module-based Angular app
        run: >-
          pnpm nx g @nx/angular:application apps/census-mobile-frontend
          --name=census-mobile-frontend
          --standalone=false
          --port=4300
          --e2eTestRunner=none
          --zoneless=false

      - name: Verify module-based bootstrap
        shell: bash
        run: |
          grep -R "@NgModule" apps/census-mobile-frontend/src/app
          grep -R "bootstrapModule" apps/census-mobile-frontend/src/main.ts
          if grep -R "standalone: true" apps/census-mobile-frontend/src/app; then
            echo "Unexpected standalone root/component generated" >&2
            exit 1
          fi

      - name: Validate generated app
        run: |
          pnpm nx run census-mobile-frontend:lint
          pnpm nx run census-mobile-frontend:test
          pnpm nx run census-mobile-frontend:build

      - name: Remove one-shot workflow and commit scaffold
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mobile-first-pr2-scaffold.yml
          git add -A
          git commit -m "feat: scaffold mobile-first Census frontend"
          git push origin HEAD:codex/mobile-first-census-pr2-scaffold
