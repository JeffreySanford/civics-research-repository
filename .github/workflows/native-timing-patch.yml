name: Native Timing Patch

on:
  push:
    branches: [codex/opensearch-comparison-demo]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add native timing patch workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/opensearch-comparison-demo
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply same-response timing implementation and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one literal match, found {count}')
              p.write_text(text.replace(old, new))

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex match, found {count}')
              p.write_text(updated)

          Path('apps/repository-api/src/main/java/org/civicsrepo/search/SearchExecution.java').write_text('''package org.civicsrepo.search;\n\nimport org.civicsrepo.generated.dto.SearchResponse;\n\n/** Results and engine-reported timing captured from one search-engine response. */\npublic record SearchExecution(SearchResponse response, Long engineReportedMs) {\n    public SearchExecution {\n        if (response == null) {\n            throw new IllegalArgumentException("response is required");\n        }\n        if (engineReportedMs != null && engineReportedMs < 0) {\n            throw new IllegalArgumentException("engineReportedMs must be non-negative");\n        }\n    }\n}\n''')

          replace_once(
              'apps/repository-api/src/main/java/org/civicsrepo/search/DiscoveryIndex.java',
              '''    SearchResponse search(\n            String query,\n            List<ResearchProgram> programs,\n            String geography,\n            ResearchObjectType contentType,\n            Integer vintageYear,\n            int page,\n            int pageSize);\n''',
              '''    SearchResponse search(\n            String query,\n            List<ResearchProgram> programs,\n            String geography,\n            ResearchObjectType contentType,\n            Integer vintageYear,\n            int page,\n            int pageSize);\n\n    /**\n     * Runs the same search while retaining engine-native timing when an implementation exposes it.\n     * The default preserves compatibility for alternate discovery-index implementations.\n     */\n    default SearchExecution searchWithDiagnostics(\n            String query,\n            List<ResearchProgram> programs,\n            String geography,\n            ResearchObjectType contentType,\n            Integer vintageYear,\n            int page,\n            int pageSize) {\n        return new SearchExecution(search(query, programs, geography, contentType, vintageYear, page, pageSize), null);\n    }\n''')

          solr_replacement = '''    @Override\n    public SearchResponse search(\n            String query,\n            List<ResearchProgram> programs,\n            String geography,\n            ResearchObjectType contentType,\n            Integer vintageYear,\n            int page,\n            int pageSize) {\n        return searchWithDiagnostics(query, programs, geography, contentType, vintageYear, page, pageSize).response();\n    }\n\n    @Override\n    public SearchExecution searchWithDiagnostics(\n            String query,\n            List<ResearchProgram> programs,\n            String geography,\n            ResearchObjectType contentType,\n            Integer vintageYear,\n            int page,\n            int pageSize) {\n        try {\n            HttpRequest request = HttpRequest.newBuilder(selectUri(query, programs, geography, contentType, vintageYear, page, pageSize))\n                    .timeout(REQUEST_TIMEOUT)\n                    .GET()\n                    .build();\n            HttpResponse<String> response = httpClient.send(request, HttpResponse.BodyHandlers.ofString());\n\n            if (response.statusCode() >= 300) {\n                throw new IllegalStateException("Solr search failed with HTTP " + response.statusCode());\n            }\n\n            String responseBody = response.body();\n            return new SearchExecution(\n                    toSearchResponse(query, page, pageSize, programs, geography, contentType, vintageYear, responseBody),\n                    engineReportedMillis(responseBody));\n        } catch (IOException exception) {\n            throw new IllegalStateException("Solr search request failed.", exception);\n        } catch (InterruptedException exception) {\n            Thread.currentThread().interrupt();\n            throw new IllegalStateException("Solr search request was interrupted.", exception);\n        }\n    }\n\n    private Map<String, Object> toSolrDocument'''
          regex_once(
              'apps/repository-api/src/main/java/org/civicsrepo/search/SolrSearchClient.java',
              r'    @Override\n    public SearchResponse search\(.*?\n    \}\n\n    private Map<String, Object> toSolrDocument',
              solr_replacement)

          replace_once(
              'apps/repository-api/src/main/java/org/civicsrepo/search/SolrSearchClient.java',
              '''    /** Unreadable access metadata reads as restricted, never as public. */\n''',
              '''    private Long engineReportedMillis(String responseBody) {\n        try {\n            JsonNode qTime = objectMapper.readTree(responseBody).path("responseHeader").path("QTime");\n            return qTime.isNumber() ? Math.max(0L, qTime.asLong()) : null;\n        } catch (JsonProcessingException exception) {\n            return null;\n        }\n    }\n\n    /** Unreadable access metadata reads as restricted, never as public. */\n''')

          open_search_replacement = '''    public SearchResponse search(\n            String query,\n            List<ResearchProgram> programs,\n            String geography,\n            ResearchObjectType contentType,\n            Integer vintageYear,\n            int page,\n            int pageSize) {\n        return searchWithDiagnostics(query, programs, geography, contentType, vintageYear, page, pageSize).response();\n    }\n\n    public SearchExecution searchWithDiagnostics(\n            String query,\n            List<ResearchProgram> programs,\n            String geography,\n            ResearchObjectType contentType,\n            Integer vintageYear,\n            int page,\n            int pageSize) {\n        if (!isEnabled()) {\n            throw new IllegalStateException("OpenSearch comparison is disabled.");\n        }\n\n        int safePage = Math.max(0, page);\n        int safePageSize = Math.max(1, Math.min(pageSize, 100));\n        Map<String, Object> requestBody = searchRequest(\n                query, programs, geography, contentType, vintageYear, safePage, safePageSize);\n\n        try {\n            HttpRequest request = HttpRequest.newBuilder(indexUri("/_search"))\n                    .timeout(REQUEST_TIMEOUT)\n                    .header("Content-Type", "application/json")\n                    .POST(HttpRequest.BodyPublishers.ofString(objectMapper.writeValueAsString(requestBody)))\n                    .build();\n            HttpResponse<String> response = send(request);\n            if (response.statusCode() >= 300) {\n                throw new IllegalStateException("OpenSearch search failed with HTTP " + response.statusCode());\n            }\n            String responseBody = response.body();\n            return new SearchExecution(\n                    toSearchResponse(\n                            query,\n                            programs,\n                            geography,\n                            contentType,\n                            vintageYear,\n                            safePage,\n                            safePageSize,\n                            responseBody),\n                    engineReportedMillis(responseBody));\n        } catch (IOException exception) {\n            throw new IllegalStateException("OpenSearch search request failed.", exception);\n        } catch (InterruptedException exception) {\n            Thread.currentThread().interrupt();\n            throw new IllegalStateException("OpenSearch search request was interrupted.", exception);\n        }\n    }\n\n    private Map<String, Object> searchRequest'''
          regex_once(
              'apps/repository-api/src/main/java/org/civicsrepo/search/OpenSearchProjectionClient.java',
              r'    public SearchResponse search\(.*?\n    \}\n\n    private Map<String, Object> searchRequest',
              open_search_replacement)

          replace_once(
              'apps/repository-api/src/main/java/org/civicsrepo/search/OpenSearchProjectionClient.java',
              '''    private FacetGroup facetGroup(String field, String label, JsonNode buckets, Set<String> selected) {\n''',
              '''    private Long engineReportedMillis(String responseBody) throws IOException {\n        JsonNode took = objectMapper.readTree(responseBody).path("took");\n        return took.isNumber() ? Math.max(0L, took.asLong()) : null;\n    }\n\n    private FacetGroup facetGroup(String field, String label, JsonNode buckets, Set<String> selected) {\n''')

          service_path = 'apps/repository-api/src/main/java/org/civicsrepo/search/SearchComparisonService.java'
          replace_once(
              service_path,
              '''            SearchResponse response =\n                    solr.search(query, programs, geography, contentType, vintageYear, page, pageSize);\n            return completed(\n                    SearchComparisonEngine.SOLR,\n                    solr.indexName(),\n                    solr.documentCount(),\n                    elapsedMillis(started),\n                    response,\n                    targetWarning(solr.indexName()));\n''',
              '''            SearchExecution execution =\n                    solr.searchWithDiagnostics(query, programs, geography, contentType, vintageYear, page, pageSize);\n            return completed(\n                    SearchComparisonEngine.SOLR,\n                    solr.indexName(),\n                    solr.documentCount(),\n                    elapsedMillis(started),\n                    execution.response(),\n                    execution.engineReportedMs(),\n                    targetWarning(solr.indexName()));\n''')
          replace_once(
              service_path,
              '''            SearchResponse response = openSearch.search(\n                    query, programs, geography, contentType, vintageYear, page, pageSize);\n            return completed(\n                    SearchComparisonEngine.OPENSEARCH,\n                    openSearch.indexName(),\n                    openSearch.documentCount(),\n                    elapsedMillis(started),\n                    response,\n                    targetWarning(openSearch.indexName()));\n''',
              '''            SearchExecution execution = openSearch.searchWithDiagnostics(\n                    query, programs, geography, contentType, vintageYear, page, pageSize);\n            return completed(\n                    SearchComparisonEngine.OPENSEARCH,\n                    openSearch.indexName(),\n                    openSearch.documentCount(),\n                    elapsedMillis(started),\n                    execution.response(),\n                    execution.engineReportedMs(),\n                    targetWarning(openSearch.indexName()));\n''')
          replace_once(
              service_path,
              '''            long elapsedMs,\n            SearchResponse response,\n            String warning) {\n''',
              '''            long elapsedMs,\n            SearchResponse response,\n            Long engineReportedMs,\n            String warning) {\n''')
          replace_once(
              service_path,
              '''        indexedCount.ifPresent(comparison::indexedDocumentCount);\n        if (warning != null && !warning.isBlank()) {\n''',
              '''        indexedCount.ifPresent(comparison::indexedDocumentCount);\n        if (engineReportedMs != null) {\n            comparison.engineReportedMs(engineReportedMs);\n        }\n        if (warning != null && !warning.isBlank()) {\n''')

          replace_once(
              'schemas/openapi/repository-api.yaml',
              '''        elapsedMs:\n          type: integer\n          format: int64\n          minimum: 0\n          description: Local API elapsed time around the engine request, not a production benchmark.\n        totalHits:\n''',
              '''        elapsedMs:\n          type: integer\n          format: int64\n          minimum: 0\n          description: Local API elapsed time around the engine request, not a production benchmark.\n        engineReportedMs:\n          type: integer\n          format: int64\n          minimum: 0\n          description: >-\n            Timing reported by the engine in the same response that produced these results: Solr\n            responseHeader.QTime or OpenSearch took. Vendor definitions differ, so these values are\n            diagnostic and are not directly equivalent performance measures.\n        totalHits:\n''')

          test_path = 'apps/repository-api/src/test/java/org/civicsrepo/search/SearchComparisonServiceTest.java'
          p = Path(test_path)
          text = p.read_text().replace('solr.search(', 'solr.searchWithDiagnostics(').replace('openSearch.search(', 'openSearch.searchWithDiagnostics(')
          text = text.replace('verify(openSearch).search(', 'verify(openSearch).searchWithDiagnostics(')
          text = text.replace('verify(solr).search(', 'verify(solr).searchWithDiagnostics(')
          text = text.replace('.thenReturn(response(3));', '.thenReturn(execution(3, 6));', 1)
          text = text.replace('.thenReturn(response(3));', '.thenReturn(execution(3, 11));', 1)
          text = re.sub(r'\.thenReturn\(response\((\d+)\)\);', r'.thenReturn(execution(\1, 5));', text)
          marker = '''        assertThat(result.getOpenSearch().getTotalHits()).isEqualTo(3);\n'''
          if marker not in text:
              raise SystemExit('SearchComparisonServiceTest: assertion marker missing')
          text = text.replace(marker, marker + '''        assertThat(result.getSolr().getEngineReportedMs()).isEqualTo(6L);\n        assertThat(result.getOpenSearch().getEngineReportedMs()).isEqualTo(11L);\n''')
          helper_marker = '''    private void currentProjectionFor(String indexName, String projectionId, int documentCount, String warning) {\n'''
          if helper_marker not in text:
              raise SystemExit('SearchComparisonServiceTest: helper marker missing')
          text = text.replace(helper_marker, '''    private SearchExecution execution(int total, long engineReportedMs) {\n        return new SearchExecution(response(total), engineReportedMs);\n    }\n\n''' + helper_marker)
          p.write_text(text)

          os_test = 'apps/repository-api/src/test/java/org/civicsrepo/search/OpenSearchProjectionClientSearchTest.java'
          replace_once(os_test, '''        client.search(\n''', '''        SearchExecution execution = client.searchWithDiagnostics(\n''')
          replace_once(os_test, '''        JsonNode request = objectMapper.readTree(requestBody.get());\n''', '''        assertThat(execution.engineReportedMs()).isEqualTo(11L);\n\n        JsonNode request = objectMapper.readTree(requestBody.get());\n''')
          replace_once(os_test, '''                {\n                  "hits": {"total": {"value": 0}, "hits": []},\n''', '''                {\n                  "took": 11,\n                  "hits": {"total": {"value": 0}, "hits": []},\n''')

          Path('apps/repository-api/src/test/java/org/civicsrepo/search/SolrSearchClientTimingTest.java').write_text('''package org.civicsrepo.search;\n\nimport static org.assertj.core.api.Assertions.assertThat;\n\nimport com.sun.net.httpserver.HttpExchange;\nimport com.sun.net.httpserver.HttpServer;\nimport java.io.IOException;\nimport java.net.InetSocketAddress;\nimport java.nio.charset.StandardCharsets;\nimport java.util.List;\nimport org.junit.jupiter.api.AfterEach;\nimport org.junit.jupiter.api.BeforeEach;\nimport org.junit.jupiter.api.Test;\n\nclass SolrSearchClientTimingTest {\n    private HttpServer server;\n    private SolrSearchClient client;\n\n    @BeforeEach\n    void startServer() throws IOException {\n        server = HttpServer.create(new InetSocketAddress("127.0.0.1", 0), 0);\n        server.createContext("/solr/discovery/select", this::handleSearch);\n        server.start();\n        client = new SolrSearchClient("http://127.0.0.1:" + server.getAddress().getPort() + "/solr", "discovery");\n    }\n\n    @AfterEach\n    void stopServer() {\n        server.stop(0);\n    }\n\n    @Test\n    void capturesQTimeFromTheSameResponseAsTheSearchResults() {\n        SearchExecution execution = client.searchWithDiagnostics("", List.of(), null, null, null, 0, 10);\n\n        assertThat(execution.engineReportedMs()).isEqualTo(7L);\n        assertThat(execution.response().getTotalResults()).isZero();\n    }\n\n    private void handleSearch(HttpExchange exchange) throws IOException {\n        byte[] response = """\n                {\n                  "responseHeader": {"status": 0, "QTime": 7},\n                  "response": {"numFound": 0, "docs": []},\n                  "facet_counts": {\n                    "facet_fields": {\n                      "program_s": [],\n                      "geography_s": [],\n                      "contentType_s": [],\n                      "vintageYear_i": []\n                    }\n                  }\n                }\n                """.getBytes(StandardCharsets.UTF_8);\n        exchange.getResponseHeaders().set("Content-Type", "application/json");\n        exchange.sendResponseHeaders(200, response.length);\n        exchange.getResponseBody().write(response);\n        exchange.close();\n    }\n}\n''')

          html = 'apps/discovery-ui/src/app/pages/search-lab-page.html'
          replace_once(html,
              '''      <p>\n        Elapsed time wraps the engine request from this local API process. It is\n        useful for this run only and is not a production performance claim.\n      </p>\n''',
              '''      <p>\n        API elapsed time wraps the engine request from this local API process.\n        Engine-reported time comes from the same result response: Solr QTime or\n        OpenSearch took. Their vendor definitions differ, so neither value is a\n        production performance claim or a direct cross-engine verdict.\n      </p>\n''')
          replace_once(html,
              '''          <div>\n            <dt>Elapsed</dt>\n            <dd>{{ comparison.solr.elapsedMs }} ms</dd>\n          </div>\n''',
              '''          <div>\n            <dt>API elapsed</dt>\n            <dd>{{ comparison.solr.elapsedMs }} ms</dd>\n          </div>\n          @if (comparison.solr.engineReportedMs !== undefined) {\n          <div>\n            <dt>Engine reported (QTime)</dt>\n            <dd>{{ comparison.solr.engineReportedMs }} ms</dd>\n          </div>\n          }\n''')
          replace_once(html,
              '''          <div>\n            <dt>Elapsed</dt>\n            <dd>{{ comparison.openSearch.elapsedMs }} ms</dd>\n          </div>\n''',
              '''          <div>\n            <dt>API elapsed</dt>\n            <dd>{{ comparison.openSearch.elapsedMs }} ms</dd>\n          </div>\n          @if (comparison.openSearch.engineReportedMs !== undefined) {\n          <div>\n            <dt>Engine reported (took)</dt>\n            <dd>{{ comparison.openSearch.engineReportedMs }} ms</dd>\n          </div>\n          }\n''')

          ui_spec = 'apps/discovery-ui/src/app/pages/search-lab-page.spec.ts'
          replace_once(ui_spec, '''    elapsedMs: 20,\n    totalHits: 3,\n''', '''    elapsedMs: 20,\n    engineReportedMs: 6,\n    totalHits: 3,\n''')
          replace_once(ui_spec, '''    elapsedMs: 46,\n    totalHits: 3,\n''', '''    elapsedMs: 46,\n    engineReportedMs: 11,\n    totalHits: 3,\n''')
          replace_once(ui_spec, '''    expect(fixture.nativeElement.textContent).toContain('46 ms');\n''', '''    expect(fixture.nativeElement.textContent).toContain('46 ms');\n    expect(fixture.nativeElement.textContent).toContain('Engine reported (QTime)');\n    expect(fixture.nativeElement.textContent).toContain('Engine reported (took)');\n    expect(fixture.nativeElement.textContent).toContain('6 ms');\n    expect(fixture.nativeElement.textContent).toContain('11 ms');\n''')

          real_stack = 'apps/discovery-ui-e2e/src/search-comparison-real-stack.spec.ts'
          replace_once(real_stack,
              '''    await expect(\n      openSearchCard.getByText('discovery-comparison', { exact: true }),\n    ).toBeVisible();\n\n    // The smoke test verifies the live infrastructure path, not relative performance.\n''',
              '''    await expect(\n      openSearchCard.getByText('discovery-comparison', { exact: true }),\n    ).toBeVisible();\n    await expect(solrCard.getByText('Engine reported (QTime)')).toBeVisible();\n    await expect(openSearchCard.getByText('Engine reported (took)')).toBeVisible();\n\n    // The smoke test verifies the live infrastructure path, not relative performance.\n''')

          bench = 'tools/scripts/search-comparison-benchmark.mjs'
          replace_once(bench,
              '''  requireTiming(engine.elapsedMs, `${label} elapsedMs`);\n''',
              '''  requireTiming(engine.elapsedMs, `${label} elapsedMs`);\n  requireTiming(engine.engineReportedMs, `${label} engineReportedMs`);\n''')
          replace_once(bench,
              '''  const solrSamples = [];\n  const openSearchSamples = [];\n''',
              '''  const solrSamples = [];\n  const openSearchSamples = [];\n  const solrEngineSamples = [];\n  const openSearchEngineSamples = [];\n''')
          replace_once(bench,
              '''      solrSamples.push(response.solr.elapsedMs);\n      openSearchSamples.push(response.openSearch.elapsedMs);\n''',
              '''      solrSamples.push(response.solr.elapsedMs);\n      openSearchSamples.push(response.openSearch.elapsedMs);\n      solrEngineSamples.push(response.solr.engineReportedMs);\n      openSearchEngineSamples.push(response.openSearch.engineReportedMs);\n''')
          replace_once(bench,
              '''    measurementBoundary:\n      'Spring API elapsed time around each engine HTTP request. It includes local HTTP serialization/transport plus engine work, and excludes browser-to-repository-API latency.',\n''',
              '''    measurementBoundary:\n      'API elapsed measures Spring around each engine HTTP request. Engine-reported timing is captured from that same response (Solr QTime / OpenSearch took); vendor definitions differ and are not directly equivalent.',\n''')
          replace_once(bench,
              '''      'Warm-up runs are excluded, but engine order is fixed and this is a single local/container topology. Use these distributions as diagnostics, not as proof that either engine is inherently faster in production.',\n''',
              '''      'Warm-up runs are excluded, but engine order is fixed and this is a single local/container topology. Solr QTime and OpenSearch took also have different vendor semantics. Use these distributions as diagnostics, not as proof that either engine is inherently faster in production.',\n''')
          replace_once(bench,
              '''    solr: {\n      engine: 'SOLR',\n      elapsed: summarizeTimingSamples(solrSamples),\n    },\n    openSearch: {\n      engine: 'OPENSEARCH',\n      elapsed: summarizeTimingSamples(openSearchSamples),\n    },\n''',
              '''    solr: {\n      engine: 'SOLR',\n      elapsed: summarizeTimingSamples(solrSamples),\n      engineReported: summarizeTimingSamples(solrEngineSamples),\n    },\n    openSearch: {\n      engine: 'OPENSEARCH',\n      elapsed: summarizeTimingSamples(openSearchSamples),\n      engineReported: summarizeTimingSamples(openSearchEngineSamples),\n    },\n''')
          replace_once(bench,
              '''  console.log(\n    `OpenSearch API elapsed p50/p95/p99: ${result.openSearch.elapsed.p50Ms}/${result.openSearch.elapsed.p95Ms}/${result.openSearch.elapsed.p99Ms} ms`,\n  );\n''',
              '''  console.log(\n    `OpenSearch API elapsed p50/p95/p99: ${result.openSearch.elapsed.p50Ms}/${result.openSearch.elapsed.p95Ms}/${result.openSearch.elapsed.p99Ms} ms`,\n  );\n  console.log(\n    `Solr QTime p50/p95/p99: ${result.solr.engineReported.p50Ms}/${result.solr.engineReported.p95Ms}/${result.solr.engineReported.p99Ms} ms`,\n  );\n  console.log(\n    `OpenSearch took p50/p95/p99: ${result.openSearch.engineReported.p50Ms}/${result.openSearch.engineReported.p95Ms}/${result.openSearch.engineReported.p99Ms} ms`,\n  );\n''')

          bench_test = 'tools/scripts/search-comparison-benchmark.test.mjs'
          replace_once(bench_test, '''      elapsedMs: solrElapsedMs,\n''', '''      elapsedMs: solrElapsedMs,\n      engineReportedMs: solrElapsedMs,\n''')
          replace_once(bench_test, '''      elapsedMs: openSearchElapsedMs,\n''', '''      elapsedMs: openSearchElapsedMs,\n      engineReportedMs: openSearchElapsedMs,\n''')
          replace_once(bench_test,
              '''  assert.equal(result.openSearch.elapsed.maxMs, 52);\n''',
              '''  assert.equal(result.openSearch.elapsed.maxMs, 52);\n  assert.equal(result.solr.engineReported.sampleCount, 5);\n  assert.equal(result.solr.engineReported.p50Ms, 30);\n  assert.equal(result.openSearch.engineReported.p95Ms, 52);\n''')

          PY

      - name: Regenerate typed OpenAPI client
        run: pnpm run openapi:generate

      - name: Format touched workspace files
        run: >-
          pnpm exec prettier --write
          schemas/openapi/repository-api.yaml
          libs/repository/api-client/src/generated/repository-api.types.ts
          apps/discovery-ui/src/app/pages/search-lab-page.html
          apps/discovery-ui/src/app/pages/search-lab-page.spec.ts
          apps/discovery-ui-e2e/src/search-comparison-real-stack.spec.ts
          tools/scripts/search-comparison-benchmark.mjs
          tools/scripts/search-comparison-benchmark.test.mjs

      - name: Validate benchmark and API contract
        run: |
          node --test tools/scripts/search-comparison-benchmark.test.mjs
          pnpm run openapi:lint
          pnpm run openapi:check

      - name: Run Search Lab unit tests
        run: pnpm exec nx test discovery-ui

      - name: Run Repository API tests
        run: docker build -f apps/repository-api/Dockerfile --target test .

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated native timing slice
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/native-timing-patch.yml
          git config user.name 'Jeffrey Sanford'
          git config user.email 'jeffrey_sanford@hotmail.com'
          git add \
            apps/repository-api/src/main/java/org/civicsrepo/search \
            apps/repository-api/src/test/java/org/civicsrepo/search \
            schemas/openapi/repository-api.yaml \
            libs/repository/api-client/src/generated/repository-api.types.ts \
            apps/discovery-ui/src/app/pages/search-lab-page.html \
            apps/discovery-ui/src/app/pages/search-lab-page.spec.ts \
            apps/discovery-ui-e2e/src/search-comparison-real-stack.spec.ts \
            tools/scripts/search-comparison-benchmark.mjs \
            tools/scripts/search-comparison-benchmark.test.mjs
          git commit -m 'Add same-response engine timing evidence'
          git push origin HEAD:codex/opensearch-comparison-demo
