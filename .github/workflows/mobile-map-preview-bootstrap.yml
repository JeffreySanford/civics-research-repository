name: Mobile map preview bootstrap

on:
  push:
    branches:
      - feat/mobile-research-map-preview

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/mobile-research-map-preview
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Implement mobile research map preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/census-mobile-frontend/src/app/mobile-research-map

          cat > apps/census-mobile-frontend/src/app/mobile-research-map/mobile-research-map-preview.component.ts <<'EOF'
          import { isPlatformBrowser } from '@angular/common';
          import {
            AfterViewInit,
            ChangeDetectionStrategy,
            Component,
            DestroyRef,
            ElementRef,
            inject,
            Input,
            OnChanges,
            OnDestroy,
            PLATFORM_ID,
            signal,
            SimpleChanges,
            ViewChild,
          } from '@angular/core';
          import { Params } from '@angular/router';
          import { takeUntilDestroyed } from '@angular/core/rxjs-interop';
          import type { GeoJSONSource, Map as MapLibreMap, StyleSpecification } from 'maplibre-gl';
          import {
            parseRepositoryError,
            RepositoryMapsApi,
            type ResearchSpatialCoverageFeature,
            type ResearchSpatialCoverageResponse,
            type ResearchSpatialViewport,
            type SearchQuery,
          } from 'repository-api-client';
          import {
            catchError,
            map,
            of,
            ReplaySubject,
            shareReplay,
            startWith,
            switchMap,
          } from 'rxjs';
          import { SearchRouteQueryAdapter } from '../state/search/search-route-query.adapter';

          const INITIAL_VIEWPORT: ResearchSpatialViewport = {
            west: -180,
            south: -85,
            east: 180,
            north: 85,
          };

          type CoverageRequest = {
            readonly query: SearchQuery;
            readonly viewport: ResearchSpatialViewport;
          };

          type CoverageState =
            | { readonly status: 'loading' }
            | {
                readonly status: 'loaded';
                readonly response: ResearchSpatialCoverageResponse;
              }
            | { readonly status: 'error'; readonly message: string };

          type CoverageFeatureCollection = {
            readonly type: 'FeatureCollection';
            readonly features: readonly {
              readonly type: 'Feature';
              readonly id: string;
              readonly properties: Readonly<Record<string, string | null>>;
              readonly geometry: Readonly<Record<string, unknown>>;
            }[];
          };

          @Component({
            selector: 'app-mobile-research-map-preview',
            standalone: false,
            changeDetection: ChangeDetectionStrategy.OnPush,
            templateUrl: './mobile-research-map-preview.component.html',
            styleUrl: './mobile-research-map-preview.component.scss',
          })
          export class MobileResearchMapPreviewComponent
            implements OnChanges, AfterViewInit, OnDestroy
          {
            private readonly mapsApi = inject(RepositoryMapsApi);
            private readonly routeQueryAdapter = inject(SearchRouteQueryAdapter);
            private readonly platformId = inject(PLATFORM_ID);
            private readonly destroyRef = inject(DestroyRef);
            private readonly requests = new ReplaySubject<CoverageRequest>(1);

            @Input() query: SearchQuery = {};
            @Input() interactive = false;
            @Input() expanded = false;

            @ViewChild('mapCanvas')
            private readonly mapCanvas?: ElementRef<HTMLDivElement>;

            protected queryParams: Params = {};
            protected readonly mapUnavailable = signal(false);
            protected readonly mapInitialized = signal(false);
            protected readonly state$ = this.requests.pipe(
              switchMap(({ query, viewport }) =>
                this.mapsApi
                  .getResearchSpatialCoverage(
                    query,
                    viewport,
                    this.interactive ? 200 : 80,
                  )
                  .pipe(
                    map(
                      (response): CoverageState => ({
                        status: 'loaded',
                        response,
                      }),
                    ),
                    startWith<CoverageState>({ status: 'loading' }),
                    catchError((error: unknown) =>
                      of<CoverageState>({
                        status: 'error',
                        message: parseRepositoryError(
                          error,
                          'Research coverage could not be loaded.',
                        ).message,
                      }),
                    ),
                  ),
              ),
              shareReplay({ bufferSize: 1, refCount: true }),
            );

            private map: MapLibreMap | null = null;
            private mapModule: typeof import('maplibre-gl') | null = null;
            private styleReady = false;
            private pendingResponse: ResearchSpatialCoverageResponse | null = null;
            private currentViewport = INITIAL_VIEWPORT;
            private initialFitPending = true;

            ngOnChanges(changes: SimpleChanges): void {
              if (changes['query'] || changes['interactive']) {
                this.queryParams = this.routeQueryAdapter.toQueryParams(this.query);
                this.currentViewport = INITIAL_VIEWPORT;
                this.initialFitPending = true;
                this.requests.next({
                  query: this.query,
                  viewport: this.currentViewport,
                });
              }
            }

            ngAfterViewInit(): void {
              this.state$
                .pipe(takeUntilDestroyed(this.destroyRef))
                .subscribe((state) => {
                  if (state.status === 'loaded') {
                    void this.renderCoverage(state.response);
                  }
                });
            }

            ngOnDestroy(): void {
              this.map?.remove();
              this.map = null;
            }

            protected sourceLabel(response: ResearchSpatialCoverageResponse): string {
              return response.sourceSystem === 'DATA_GOV'
                ? 'Data.gov'
                : response.sourceSystem;
            }

            protected hasCompatibilityBoundary(): boolean {
              return Boolean(this.query.geography || this.query.vintageYear);
            }

            private async renderCoverage(
              response: ResearchSpatialCoverageResponse,
            ): Promise<void> {
              this.pendingResponse = response;
              const map = await this.ensureMap();
              if (!map || !this.styleReady) {
                return;
              }

              this.updateCoverageSource(response);
              if (!this.interactive || this.initialFitPending) {
                this.fitCoverage(response);
                this.initialFitPending = false;
              }
            }

            private async ensureMap(): Promise<MapLibreMap | null> {
              if (this.map) {
                return this.map;
              }
              if (
                !isPlatformBrowser(this.platformId) ||
                !this.mapCanvas ||
                typeof WebGLRenderingContext === 'undefined'
              ) {
                this.mapUnavailable.set(true);
                return null;
              }

              try {
                const maplibregl = await import('maplibre-gl');
                maplibregl.setWorkerUrl('/maplibre-gl-worker.mjs');
                this.mapModule = maplibregl;
                const map = new maplibregl.Map({
                  container: this.mapCanvas.nativeElement,
                  style: this.baseStyle(),
                  center: [-98.5, 39.5],
                  zoom: 2.15,
                  minZoom: 1,
                  maxZoom: 12,
                  interactive: this.interactive,
                  attributionControl: false,
                  dragRotate: false,
                  pitchWithRotate: false,
                });

                if (this.interactive) {
                  map.addControl(
                    new maplibregl.NavigationControl({ showCompass: false }),
                    'top-right',
                  );
                  map.on('moveend', () => this.requestCurrentViewport());
                }

                map.once('style.load', () => {
                  this.styleReady = true;
                  if (this.pendingResponse) {
                    this.updateCoverageSource(this.pendingResponse);
                    if (!this.interactive || this.initialFitPending) {
                      this.fitCoverage(this.pendingResponse);
                      this.initialFitPending = false;
                    }
                  }
                });

                this.map = map;
                this.mapInitialized.set(true);
                return map;
              } catch {
                this.mapUnavailable.set(true);
                return null;
              }
            }

            private baseStyle(): StyleSpecification {
              return {
                version: 8,
                sources: {
                  osm: {
                    type: 'raster',
                    tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                    tileSize: 256,
                    attribution: '© OpenStreetMap contributors',
                  },
                },
                layers: [
                  {
                    id: 'osm-reference',
                    type: 'raster',
                    source: 'osm',
                    paint: { 'raster-opacity': 0.7 },
                  },
                ],
              };
            }

            private updateCoverageSource(
              response: ResearchSpatialCoverageResponse,
            ): void {
              const map = this.map;
              if (!map || !this.styleReady) {
                return;
              }

              const data = this.featureCollection(response);
              const existing = map.getSource('mobile-research-coverage') as
                | GeoJSONSource
                | undefined;
              if (existing) {
                existing.setData(
                  data as unknown as Parameters<GeoJSONSource['setData']>[0],
                );
                return;
              }

              map.addSource('mobile-research-coverage', {
                type: 'geojson',
                data: data as never,
              });
              map.addLayer({
                id: 'mobile-research-coverage-fill',
                type: 'fill',
                source: 'mobile-research-coverage',
                filter: ['==', ['geometry-type'], 'Polygon'],
                paint: {
                  'fill-color': '#0f766e',
                  'fill-opacity': 0.26,
                },
              });
              map.addLayer({
                id: 'mobile-research-coverage-line',
                type: 'line',
                source: 'mobile-research-coverage',
                filter: ['==', ['geometry-type'], 'Polygon'],
                paint: {
                  'line-color': '#115e59',
                  'line-width': 2,
                },
              });
              map.addLayer({
                id: 'mobile-research-coverage-point',
                type: 'circle',
                source: 'mobile-research-coverage',
                filter: ['==', ['geometry-type'], 'Point'],
                paint: {
                  'circle-color': '#0f766e',
                  'circle-radius': this.expanded ? 6 : 4,
                  'circle-stroke-color': '#ffffff',
                  'circle-stroke-width': 1.5,
                },
              });
            }

            private featureCollection(
              response: ResearchSpatialCoverageResponse,
            ): CoverageFeatureCollection {
              return {
                type: 'FeatureCollection',
                features: response.features.flatMap((feature) => {
                  const geometry = this.renderGeometry(feature);
                  if (!geometry) {
                    return [];
                  }
                  return [
                    {
                      type: 'Feature' as const,
                      id: feature.sourceIdentifier,
                      properties: {
                        sourceIdentifier: feature.sourceIdentifier,
                        title: feature.title,
                        publisher: feature.publisher ?? null,
                        program: feature.program ?? null,
                        contentType: feature.contentType ?? null,
                      },
                      geometry,
                    },
                  ];
                }),
              };
            }

            private renderGeometry(
              feature: ResearchSpatialCoverageFeature,
            ): Readonly<Record<string, unknown>> | null {
              if (
                feature.geometryStatus === 'ANTIMERIDIAN_CANDIDATE' &&
                typeof feature.renderLon === 'number' &&
                typeof feature.renderLat === 'number'
              ) {
                return {
                  type: 'Point',
                  coordinates: [feature.renderLon, feature.renderLat],
                };
              }

              if (feature.geometryStatus !== 'VALID' || !feature.geometry) {
                return null;
              }
              return feature.geometry as Readonly<Record<string, unknown>>;
            }

            private fitCoverage(response: ResearchSpatialCoverageResponse): void {
              if (!this.map || !this.mapModule) {
                return;
              }

              const bounds = new this.mapModule.LngLatBounds();
              for (const feature of response.features) {
                const geometry = this.renderGeometry(feature);
                if (geometry) {
                  this.collectCoordinates(geometry['coordinates'], bounds);
                }
              }

              if (!bounds.isEmpty()) {
                this.map.fitBounds(bounds, {
                  padding: this.expanded ? 48 : 22,
                  maxZoom: this.expanded ? 7 : 5,
                  duration: 0,
                });
              }
            }

            private collectCoordinates(
              value: unknown,
              bounds: import('maplibre-gl').LngLatBounds,
            ): void {
              if (!Array.isArray(value)) {
                return;
              }
              if (
                value.length >= 2 &&
                typeof value[0] === 'number' &&
                typeof value[1] === 'number'
              ) {
                bounds.extend([value[0], value[1]]);
                return;
              }
              for (const child of value) {
                this.collectCoordinates(child, bounds);
              }
            }

            private requestCurrentViewport(): void {
              if (!this.interactive || !this.map) {
                return;
              }
              const bounds = this.map.getBounds();
              this.currentViewport = {
                west: this.normalizeLongitude(bounds.getWest()),
                south: Math.max(-85, bounds.getSouth()),
                east: this.normalizeLongitude(bounds.getEast()),
                north: Math.min(85, bounds.getNorth()),
              };
              this.requests.next({
                query: this.query,
                viewport: this.currentViewport,
              });
            }

            private normalizeLongitude(longitude: number): number {
              const normalized = ((((longitude + 180) % 360) + 360) % 360) - 180;
              return normalized === -180 && longitude > 0 ? 180 : normalized;
            }
          }
          EOF

          cat > apps/census-mobile-frontend/src/app/mobile-research-map/mobile-research-map-preview.component.html <<'EOF'
          <section
            class="coverage-card"
            [class.coverage-card--expanded]="expanded"
            aria-labelledby="mobile-coverage-heading"
            data-testid="mobile-research-map-preview"
          >
            <div class="coverage-card__heading">
              <div>
                <p class="coverage-card__eyebrow">Publisher spatial coverage</p>
                <h3 id="mobile-coverage-heading">
                  {{ expanded ? 'Research map' : 'Map matching research' }}
                </h3>
              </div>
              <span class="coverage-card__layer">Research coverage</span>
            </div>

            @if (state$ | async; as state) {
              @if (state.status === 'loading') {
                <p class="coverage-card__status" role="status">
                  Loading bounded spatial coverage…
                </p>
              } @else if (state.status === 'error') {
                <div class="coverage-card__message" role="status">
                  <strong>Spatial preview unavailable.</strong>
                  <span>{{ state.message }}</span>
                  <span>Search results remain available without the map.</span>
                </div>
              } @else {
                <p class="coverage-card__summary">
                  <strong>{{ state.response.summary.mappedRecords }}</strong>
                  of
                  <strong>{{ state.response.summary.matchingRecords }}</strong>
                  matching {{ sourceLabel(state.response) }} spatial records have
                  publisher-supplied map coverage.
                  <strong>{{ state.response.summary.viewportMappedRecords }}</strong>
                  are mapped in the current view.
                </p>

                @if (state.response.summary.unmappedRecords > 0) {
                  <p class="coverage-card__note">
                    {{ state.response.summary.unmappedRecords }} matching records do
                    not declare publisher geometry and are not forced onto the map.
                  </p>
                }

                @if (state.response.summary.truncated) {
                  <p class="coverage-card__note" role="status">
                    Showing {{ state.response.summary.returnedFeatures }} of
                    {{ state.response.summary.viewportMappedRecords }} mapped records
                    in this bounded view.
                  </p>
                }

                @if (
                  state.response.summary.matchingRecords === 0 &&
                  hasCompatibilityBoundary()
                ) {
                  <p class="coverage-card__note">
                    The current spatial source does not project every Discovery
                    geography/vintage field. Those filters are preserved rather than
                    silently weakened.
                  </p>
                }
              }
            }

            <div
              class="coverage-map"
              [class.coverage-map--expanded]="expanded"
              [attr.data-map-initialized]="mapInitialized()"
            >
              <div
                #mapCanvas
                class="coverage-map__canvas"
                data-testid="mobile-research-map-canvas"
                aria-hidden="true"
              ></div>

              @if (!expanded) {
                <a
                  class="coverage-map__open"
                  [routerLink]="['/research-map']"
                  [queryParams]="queryParams"
                  aria-label="Open research coverage map for the current search"
                >
                  <span>Open research map</span>
                  <span aria-hidden="true">↗</span>
                </a>
              }

              @if (mapUnavailable()) {
                <div class="coverage-map__fallback" role="note">
                  Map rendering is unavailable. Spatial counts and the accessible
                  record list remain available.
                </div>
              }
            </div>

            <p class="coverage-card__attribution">
              Reference map ©
              <a
                href="https://www.openstreetmap.org/copyright"
                target="_blank"
                rel="noreferrer"
                >OpenStreetMap contributors</a
              >. Research geometry comes from publisher-supplied spatial metadata.
            </p>

            @if (expanded) {
              @if (state$ | async; as expandedState) {
                @if (expandedState.status === 'loaded') {
                  <section
                    class="coverage-list"
                    aria-labelledby="mobile-coverage-list-heading"
                  >
                    <h2 id="mobile-coverage-list-heading">
                      Research mapped in this view
                    </h2>
                    @if (expandedState.response.features.length === 0) {
                      <p>No publisher-supplied research geometry is visible here.</p>
                    } @else {
                      <ul>
                        @for (
                          feature of expandedState.response.features;
                          track feature.sourceIdentifier
                        ) {
                          <li>
                            <strong>{{ feature.title }}</strong>
                            <span>
                              {{ feature.publisher || 'Publisher not stated' }}
                            </span>
                            @if (feature.sourceUrl) {
                              <a
                                [href]="feature.sourceUrl"
                                target="_blank"
                                rel="noreferrer"
                                >Open authoritative source</a
                              >
                            }
                          </li>
                        }
                      </ul>
                    }
                  </section>
                }
              }
            }
          </section>
          EOF

