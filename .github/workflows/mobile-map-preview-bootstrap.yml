          from pathlib import Path
          import json

          root = Path('.')

          # Route: keep the research detail path and add the lazy map route.
          routes = root / 'apps/census-mobile-frontend/src/app/app.routes.ts'
          routes.write_text("""import type { Routes } from '@angular/router';
          import { MobileResearchDetailComponent } from './components/mobile-research-detail/mobile-research-detail.component';

          export const appRoutes: Routes = [
            { path: 'research/:researchId', component: MobileResearchDetailComponent },
            {
              path: 'research-map',
              loadChildren: () =>
                import('./mobile-research-map/mobile-research-map.module').then(
                  (module) => module.MobileResearchMapModule,
                ),
            },
          ];
          """)

          # App module: import the eagerly visible preview module only. Full map page remains lazy.
          module = root / 'apps/census-mobile-frontend/src/app/app-module.ts'
          text = module.read_text()
          text = text.replace(
              "import { SearchSummaryComponent } from './components/search-summary/search-summary.component';\n",
              "import { SearchSummaryComponent } from './components/search-summary/search-summary.component';\nimport { MobileResearchMapPreviewModule } from './mobile-research-map/mobile-research-map-preview.module';\n",
          )
          text = text.replace(
              "    SearchBadgesModule,\n    RouterModule.forRoot(appRoutes),",
              "    SearchBadgesModule,\n    MobileResearchMapPreviewModule,\n    RouterModule.forRoot(appRoutes),",
          )
          module.write_text(text)

          # Search shell: place the compact preview after the query-wide result summary.
          template = root / 'apps/census-mobile-frontend/src/app/app.html'
          text = template.read_text()
          needle = """    <app-search-summary
              [facet]=\"resultTypeFacet()\"
              [totalResults]=\"searchResponse.totalResults\"
            ></app-search-summary>
            } @if (paginationNotice()) {"""
          replacement = """    <app-search-summary
              [facet]=\"resultTypeFacet()\"
              [totalResults]=\"searchResponse.totalResults\"
            ></app-search-summary>
            } @if (searchResponse.query.trim()) {
            <app-mobile-research-map-preview
              [query]=\"searchState().query\"
            ></app-mobile-research-map-preview>
            } @if (paginationNotice()) {"""
          if needle not in text:
              raise SystemExit('app.html insertion point not found')
          template.write_text(text.replace(needle, replacement))

          # Hide the root search shell for both detail and map routes.
          app_ts = root / 'apps/census-mobile-frontend/src/app/app.ts'
          text = app_ts.read_text()
          old = """    const wasDetail = this.detailRoute();
              const isDetail =
                this.router.parseUrl(url).root.children['primary']?.segments[0]?.path ===
                'research';
              this.detailRoute.set(isDetail);
              if (isDetail) {
                return;
              }

              this.hydrateFromRouterUrl(url);
              if (wasDetail) {
                this.restoreResultFocus();
              }"""
          new = """    const wasRoutedPage = this.detailRoute();
              const primaryPath =
                this.router.parseUrl(url).root.children['primary']?.segments[0]?.path;
              const isRoutedPage =
                primaryPath === 'research' || primaryPath === 'research-map';
              this.detailRoute.set(isRoutedPage);
              if (isRoutedPage) {
                return;
              }

              this.hydrateFromRouterUrl(url);
              if (wasRoutedPage) {
                this.restoreResultFocus();
              }"""
          if old not in text:
              raise SystemExit('app.ts route block not found')
          app_ts.write_text(text.replace(old, new))

          # MapLibre stylesheet is global; the JS itself is dynamically imported by the preview.
          styles = root / 'apps/census-mobile-frontend/src/styles.scss'
          text = styles.read_text()
          if "maplibre-gl/dist/maplibre-gl.css" not in text:
              styles.write_text("@use 'maplibre-gl/dist/maplibre-gl.css';\n" + text)

          # Ship the same worker assets the desktop MapLibre route relies on and exclude prebundle.
          project = root / 'apps/census-mobile-frontend/project.json'
          data = json.loads(project.read_text())
          assets = data['targets']['build']['options']['assets']
          assets.extend([
              {
                  'glob': 'maplibre-gl-worker.mjs',
                  'input': 'node_modules/maplibre-gl/dist',
                  'output': '.',
              },
              {
                  'glob': 'maplibre-gl-shared.mjs',
                  'input': 'node_modules/maplibre-gl/dist',
                  'output': '.',
              },
          ])
          serve_options = data['targets']['serve']['options']
          serve_options['prebundle'] = {'exclude': ['maplibre-gl']}
          project.write_text(json.dumps(data, indent=2) + '\n')

          # Existing app unit tests now render the preview when a ranked response is present.
          spec = root / 'apps/census-mobile-frontend/src/app/app.spec.ts'
          text = spec.read_text()
          text = text.replace(
              "import type { SearchResponse } from 'repository-api-client';",
