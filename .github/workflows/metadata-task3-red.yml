name: Metadata Task 3 Verify

on:
  push:
    branches:
      - feat/open-census-metadata-profile
    paths:
      - '.github/workflows/metadata-task3-red.yml'
      - 'apps/repository-api/src/main/java/org/civicsrepo/metadata/ResearchAccessMetadata.java'
      - 'apps/repository-api/src/main/java/org/civicsrepo/sources/ResearchObjectMetadata.java'
      - 'apps/repository-api/src/main/java/org/civicsrepo/sources/CatalogMetadataReader.java'
      - 'apps/repository-api/src/test/java/org/civicsrepo/sources/CatalogMetadataReaderTest.java'
      - 'apps/repository-api/src/test/resources/catalog-metadata-reader-invalid-date.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/open-census-metadata-profile
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test full-fidelity catalog parsing
        run: pnpm nx test repository-api

      - name: Reject current-clock fabrication in catalog reader
        run: |
          if grep -F 'LocalDate.now()' apps/repository-api/src/main/java/org/civicsrepo/sources/CatalogMetadataReader.java; then
            echo 'CatalogMetadataReader must not fabricate release dates from the current clock.' >&2
            exit 1
          fi
