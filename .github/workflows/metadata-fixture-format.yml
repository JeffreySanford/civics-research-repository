name: Metadata Fixture Format

on:
  push:
    branches:
      - feat/open-census-metadata-profile
    paths:
      - '.github/workflows/metadata-fixture-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/open-census-metadata-profile

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make fixture generation formatting-stable
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'tools/scripts/generate-saf.mjs';
          let source = readFileSync(path, 'utf8');
          source = source.replace(
            "import { fileURLToPath } from 'node:url';",
            "import { fileURLToPath } from 'node:url';\nimport prettier from 'prettier';",
          );
          source = source.replace(
            'writeFixtureCatalog(items);',
            'await writeFixtureCatalog(items);',
          );
          source = source.replace(
            'function writeFixtureCatalog(catalogItems) {',
            'async function writeFixtureCatalog(catalogItems) {',
          );
          source = source.replace(
            "  writeFileSync(fixturePath, `${JSON.stringify(fixture, null, 2)}\\n`);",
            "  const formatted = await prettier.format(JSON.stringify(fixture, null, 2) + '\\n', { parser: 'json' });\n  writeFileSync(fixturePath, formatted);",
          );
          writeFileSync(path, source);
          NODE

          pnpm exec prettier --write tools/scripts/generate-saf.mjs
          node tools/scripts/generate-saf.mjs
          pnpm exec prettier --check \
            tools/scripts/generate-saf.mjs \
            apps/repository-api/src/main/resources/discovery-fixture-catalog.json

      - name: Commit formatting-stable generator output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/scripts/generate-saf.mjs \
            apps/repository-api/src/main/resources/discovery-fixture-catalog.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix(metadata): make fixture generation formatting-stable'
          git push origin HEAD:feat/open-census-metadata-profile
