name: F0 corpus storage contract generator

on:
  push:
    branches:
      - codex/federated-metadata-catalog
    paths:
      - .github/workflows/f0-corpus-storage-contract.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/federated-metadata-catalog
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python tools/scripts/f0-corpus-storage-contract.py
      - run: pnpm exec prettier --write schemas/openapi/repository-api.yaml
      - run: pnpm run openapi:lint
      - run: pnpm run openapi:generate
      - name: Commit generated contract and remove helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/f0-corpus-storage-contract.yml tools/scripts/f0-corpus-storage-contract.py
          git add schemas/openapi/repository-api.yaml libs/repository/api-client/src/generated/repository-api.types.ts
          git commit -m "Add corpus storage admin contract"
          git push origin HEAD:codex/federated-metadata-catalog
