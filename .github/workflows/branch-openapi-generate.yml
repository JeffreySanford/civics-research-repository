name: Branch OpenAPI Generate

on:
  push:
    branches: [codex/opensearch-comparison-demo]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply comparison contract
        run: node tools/scripts/apply-search-comparison-contract.mjs

      - name: Generate TypeScript API contract
        run: pnpm run openapi:generate

      - name: Validate generated contract
        run: |
          pnpm run openapi:lint
          git diff --check

      - name: Commit generated contract
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Contract already generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/openapi/repository-api.yaml libs/repository/api-client/src/generated/repository-api.types.ts
          git commit -m "Generate search comparison contract"
          git push
