name: Bootstrap CBP source

on:
  push:
    branches: [codex/maps-county-business-patterns]

concurrency:
  group: cbp-source-bootstrap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/maps-county-business-patterns

      - name: Check whether the retained source already exists
        id: retained
        run: |
          if test -f apps/repository-api/src/main/resources/maps/county-business-patterns/source.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.retained.outputs.exists != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - if: steps.retained.outputs.exists != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.retained.outputs.exists != 'true'
        run: pnpm install --frozen-lockfile

      - name: Download and extract Census 2023 County Business Patterns
        if: steps.retained.outputs.exists != 'true'
        run: |
          mkdir -p /tmp/cbp23
          curl --fail --location --retry 4 --retry-delay 2 \
            https://www2.census.gov/programs-surveys/cbp/datasets/2023/cbp23co.zip \
            --output /tmp/cbp23co.zip
          unzip -j /tmp/cbp23co.zip -d /tmp/cbp23
          find /tmp/cbp23 -maxdepth 1 -type f -print

      - name: Prepare bounded repository source
        if: steps.retained.outputs.exists != 'true'
        run: |
          SOURCE_FILE="$(find /tmp/cbp23 -maxdepth 1 -type f | head -n 1)"
          test -n "$SOURCE_FILE"
          node tools/scripts/prepare-cbp-source.mjs \
            --source "$SOURCE_FILE" \
            --captured-at 2026-09-06
          pnpm exec prettier --write \
            tools/scripts/prepare-cbp-source.mjs \
            tools/scripts/prepare-cbp-source.test.mjs \
            documentation/maps/layers/COUNTY_BUSINESS_PATTERNS.md \
            .github/workflows/ci.yml \
            apps/repository-api/src/main/resources/maps/county-business-patterns/source.json
          node --test tools/scripts/prepare-cbp-source.test.mjs

      - name: Commit retained CBP source
        if: steps.retained.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/scripts/prepare-cbp-source.mjs \
            tools/scripts/prepare-cbp-source.test.mjs \
            documentation/maps/layers/COUNTY_BUSINESS_PATTERNS.md \
            .github/workflows/ci.yml \
            apps/repository-api/src/main/resources/maps/county-business-patterns/cbp-2023-county.csv \
            apps/repository-api/src/main/resources/maps/county-business-patterns/source.json
          git commit -m "data(maps): pin 2023 County Business Patterns source"
          git push origin HEAD:codex/maps-county-business-patterns
