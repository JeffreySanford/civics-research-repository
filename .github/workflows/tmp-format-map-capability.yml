name: Temporary Map Capability Format Capture

on:
  push:
    branches:
      - codex/map-capability-controls
    paths:
      - .github/workflows/tmp-format-map-capability.yml

permissions:
  contents: read

jobs:
  format-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: |
          pnpm exec prettier --write \
            apps/discovery-ui-e2e/src/map-layers.spec.ts \
            apps/discovery-ui/src/app/pages/maps-page.html \
            apps/discovery-ui/src/app/state/maps/maps.reducer.ts
      - name: Print formatted files
        run: |
          for file in \
            apps/discovery-ui-e2e/src/map-layers.spec.ts \
            apps/discovery-ui/src/app/pages/maps-page.html \
            apps/discovery-ui/src/app/state/maps/maps.reducer.ts
          do
            echo "FORMAT_FILE_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMAT_FILE_END:$file"
          done
