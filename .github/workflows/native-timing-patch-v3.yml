name: Repair Native Timing Patch

on:
  push:
    branches: [codex/opensearch-comparison-demo]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair native timing patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/opensearch-comparison-demo
          fetch-depth: 0

      - name: Narrow ambiguous replacement and clean helpers on success
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/native-timing-patch.yml')
          text = path.read_text()

          old = """          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one literal match, found {count}')
              p.write_text(text.replace(old, new))
"""
          new = """          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  targeted_completed_result = (
                      path.endswith('SearchComparisonService.java')
                      and old.startswith('        indexedCount.ifPresent(comparison::indexedDocumentCount);')
                      and count == 2
                  )
                  if targeted_completed_result:
                      p.write_text(text.replace(old, new, 1))
                      return
                  raise SystemExit(f'{path}: expected one literal match, found {count}')
              p.write_text(text.replace(old, new))
"""
          if text.count(old) != 1:
              raise SystemExit('Original replace_once block did not match exactly once.')
          text = text.replace(old, new)

          old_rm = '          git rm .github/workflows/native-timing-patch.yml\n'
          new_rm = '          git rm .github/workflows/native-timing-patch.yml .github/workflows/native-timing-patch-v2.yml .github/workflows/native-timing-patch-v3.yml\n'
          if text.count(old_rm) != 1:
              raise SystemExit('Original helper cleanup line did not match exactly once.')
          path.write_text(text.replace(old_rm, new_rm))
          PY

      - name: Commit repaired patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jeffrey Sanford'
          git config user.email 'jeffrey_sanford@hotmail.com'
          git add .github/workflows/native-timing-patch.yml
          git commit -m 'Add native timing patch workflow'
          git push origin HEAD:codex/opensearch-comparison-demo
