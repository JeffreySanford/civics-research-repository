name: PR5 sync latest pagination base

on:
  push:
    branches:
      - codex/mobile-first-census-pr5-relevance-evidence
    paths:
      - .github/workflows/pr5-sync-base.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/mobile-first-census-pr5-relevance-evidence
          fetch-depth: 0

      - name: Merge latest PR86 base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/mobile-first-census-pr4-pagination-ranking
          git merge --no-edit origin/codex/mobile-first-census-pr4-pagination-ranking

      - name: Preserve latest pnpm build allowlist
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('package.json')
          data = json.loads(path.read_text())
          allowed = data.setdefault('pnpm', {}).setdefault('onlyBuiltDependencies', [])
          for dependency in ('@swc/core', 'unrs-resolver'):
              if dependency not in allowed:
                  allowed.append(dependency)
          order = ['@parcel/watcher', '@swc/core', 'esbuild', 'less', 'lmdb', 'msgpackr-extract', 'nx', 'unrs-resolver']
          data['pnpm']['onlyBuiltDependencies'] = [item for item in order if item in allowed] + [item for item in allowed if item not in order]
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          if ! git diff --quiet -- package.json; then
            git add package.json
            git commit -m "chore: preserve latest pnpm build allowlist"
          fi

      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/pr5-sync-base.yml
          git commit -m "chore: remove PR5 base sync helper"

      - name: Push synchronized branch
        run: git push origin HEAD:codex/mobile-first-census-pr5-relevance-evidence
