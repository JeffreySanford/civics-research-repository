name: PR93 final mobile detail validation

on:
  push:
    branches:
      - codex/mobile-research-detail-pr93

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/mobile-research-detail-pr93
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.14.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm exec prettier --check apps/census-mobile-frontend/src/app apps/census-mobile-frontend-e2e/src/research-detail.spec.ts apps/discovery-ui/src/app/research-id.ts libs/repository/models/src
      - name: Lint
        run: pnpm nx run-many -t lint -p census-mobile-frontend,repository-models
      - name: Unit tests
        run: pnpm nx run-many -t test -p census-mobile-frontend,repository-models
      - name: Build mobile frontend
        run: pnpm nx build census-mobile-frontend --configuration=production
      - name: Build mobile Storybook
        run: pnpm nx build-storybook census-mobile-frontend --configuration=ci
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Mobile 320px Playwright and axe
        run: pnpm exec playwright test --config=apps/census-mobile-frontend-e2e/playwright.config.mts --project=chromium-320
      - name: Remove one-shot workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr93-final-validation.yml
          git commit -m "chore: remove PR93 final validation workflow"
          git push origin HEAD:codex/mobile-research-detail-pr93
