name: One-shot validate shared search explainability

on:
  push:
    branches:
      - feat/shared-result-explainability

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/shared-result-explainability
          persist-credentials: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx format:write --all
      - run: pnpm exec nx run-many -t lint --projects=shared-ui,census-mobile-frontend,census-mobile-frontend-e2e,discovery-ui,discovery-ui-e2e --skip-nx-cache
      - run: pnpm exec nx run-many -t test --projects=shared-ui,census-mobile-frontend,discovery-ui --skip-nx-cache
      - run: pnpm exec nx run-many -t build --projects=census-mobile-frontend,discovery-ui --configuration=production --skip-nx-cache

      - name: Commit formatted implementation and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-validate-explainability.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format shared search explainability"
          git push origin HEAD:feat/shared-result-explainability
