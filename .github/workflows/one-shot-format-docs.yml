name: One-shot format docs reconciliation

on:
  push:
    branches:
      - docs/reconcile-planning-sep12

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: docs/reconcile-planning-sep12
          persist-credentials: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:status
      - run: pnpm exec nx format:write --all

      - name: Commit formatted reconciliation and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-format-docs.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format documentation reconciliation"
          git push origin HEAD:docs/reconcile-planning-sep12
