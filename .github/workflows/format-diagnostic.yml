name: Format Diagnostic

on:
  push:
    branches:
      - codex/search-benchmark-confidence

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        run: |
          pnpm exec prettier --write \
            tools/scripts/search-comparison-benchmark.mjs \
            tools/scripts/search-comparison-statistics.mjs \
            tools/scripts/search-comparison-statistics.test.mjs
          git diff -- \
            tools/scripts/search-comparison-benchmark.mjs \
            tools/scripts/search-comparison-statistics.mjs \
            tools/scripts/search-comparison-statistics.test.mjs
