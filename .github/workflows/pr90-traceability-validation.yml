name: PR90 traceability documentation validation

on:
  push:
    branches:
      - codex/mobile-first-census-pr90-traceability
    paths:
      - .github/workflows/pr90-traceability-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/mobile-first-census-pr90-traceability

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format evidence documentation
        run: |
          pnpm exec prettier --write \
            mobile-first/README.md \
            mobile-first/documentation/requirements/mobile-search-traceability.md \
            mobile-first/documentation/accessibility/manual-validation-protocol.md \
            mobile-first/documentation/usability/mobile-search-study-protocol.md \
            mobile-first/planning/post-pr88-role-alignment-roadmap.md

      - name: Verify README document links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          readme = Path('mobile-first/README.md')
          text = readme.read_text()
          missing = []
          for target in re.findall(r'\[[^\]]+\]\(([^)]+\.md)\)', text):
              candidate = (readme.parent / target).resolve()
              if not candidate.exists():
                  missing.append(target)
          if missing:
              raise SystemExit('Missing README Markdown targets: ' + ', '.join(missing))
          print('All README Markdown targets resolve.')
          PY

      - name: Verify protocols remain templates, not fabricated results
        run: |
          grep -Fq 'contains no participant results' mobile-first/documentation/usability/mobile-search-study-protocol.md
          grep -Fq 'no manual results are implied' mobile-first/documentation/accessibility/manual-validation-protocol.md
          grep -Fq 'Known gaps — do not claim yet' mobile-first/documentation/requirements/mobile-search-traceability.md

      - name: Remove one-shot workflow
        run: rm .github/workflows/pr90-traceability-validation.yml

      - name: Commit validated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add federal UI evidence traceability protocols"
          git push origin HEAD:codex/mobile-first-census-pr90-traceability
