name: PR89 search match evidence validation

on:
  push:
    branches:
      - codex/mobile-first-census-pr89-match-evidence
    paths:
      - .github/workflows/pr89-match-evidence-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/mobile-first-census-pr89-match-evidence

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm

      - name: Apply match-evidence slice
        run: python tools/scripts/apply-pr89-match-evidence.py

      - name: Correct backend evidence parameters and optional-list assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          solr = Path('apps/repository-api/src/main/java/org/civicsrepo/search/SolrSearchClient.java')
          text = solr.read_text()
          replacements = {
              'private static final String HIGHLIGHT_POST = "]]";':
                  'private static final String HIGHLIGHT_POST = "]]]";',
              'params.add("hl.simple.pre=" + encode(HIGHLIGHT_PRE));':
                  'params.add("hl.tag.pre=" + encode(HIGHLIGHT_PRE));',
              'params.add("hl.simple.post=" + encode(HIGHLIGHT_POST));':
                  'params.add("hl.tag.post=" + encode(HIGHLIGHT_POST));',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected generated Solr anchor not found: {old}')
              text = text.replace(old, new, 1)
          solr.write_text(text)

          test = Path('apps/repository-api/src/test/java/org/civicsrepo/search/SolrSearchClientCursorTest.java')
          text = test.read_text()
          old = 'assertThat(execution.response().getResults().get(0).getMatchEvidence()).isNull();'
          new = 'assertThat(execution.response().getResults().get(0).getMatchEvidence()).isNullOrEmpty();'
          if old not in text:
              raise SystemExit('Expected optional match-evidence assertion was not found')
          test.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate TypeScript API contract
        run: pnpm run openapi:generate

      - name: Format changed web sources
        run: |
          pnpm exec prettier --write \
            schemas/openapi/repository-api.yaml \
            libs/repository/api-client/src/lib/repository-api-client.ts \
            libs/repository/api-client/src/generated/repository-api.types.ts \
            apps/census-mobile-frontend/src/app/app-module.ts \
            apps/census-mobile-frontend/src/app/app.html \
            apps/census-mobile-frontend/src/app/app.spec.ts \
            apps/census-mobile-frontend/src/app/components/search-match-evidence/search-match-evidence.component.ts \
            apps/census-mobile-frontend/src/app/components/search-match-evidence/search-match-evidence.component.html \
            apps/census-mobile-frontend/src/app/components/search-match-evidence/search-match-evidence.component.scss \
            apps/census-mobile-frontend/src/app/components/search-match-evidence/search-match-evidence.component.spec.ts \
            apps/census-mobile-frontend/src/app/components/search-match-evidence/search-match-evidence.component.stories.ts \
            apps/census-mobile-frontend-e2e/src/search-relevance.spec.ts \
            mobile-first/planning/post-pr88-role-alignment-roadmap.md

      - name: Lint OpenAPI contract
        run: pnpm run openapi:lint

      - name: Test repository API
        run: pnpm nx run repository-api:test

      - name: Lint mobile frontend
        run: pnpm nx run census-mobile-frontend:lint

      - name: Test mobile frontend
        run: pnpm nx run census-mobile-frontend:test

      - name: Build mobile frontend
        run: pnpm nx run census-mobile-frontend:build

      - name: Build mobile Storybook
        run: pnpm nx run census-mobile-frontend:build-storybook --configuration=ci

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run 320px match-evidence and accessibility E2E
        run: pnpm nx run census-mobile-frontend-e2e:e2e

      - name: Remove one-shot helpers
        run: |
          rm .github/workflows/pr89-match-evidence-validation.yml
          rm tools/scripts/apply-pr89-match-evidence.py

      - name: Commit validated match evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: explain search matches with engine evidence"

      - name: Verify generated API contract is committed
        run: pnpm run openapi:check

      - name: Push validated branch
        run: git push origin HEAD:codex/mobile-first-census-pr89-match-evidence
