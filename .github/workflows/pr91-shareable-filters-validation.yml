name: PR91 shareable mobile filters validation

on:
  push:
    branches:
      - codex/mobile-first-census-pr91-shareable-filters
    paths:
      - .github/workflows/pr91-shareable-filters-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/mobile-first-census-pr91-shareable-filters

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm

      - name: Correct fixture DOM typing and filter labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          spec_path = Path('apps/census-mobile-frontend/src/app/app.spec.ts')
          text = spec_path.read_text()
          pattern = re.compile(
              r"\s*const datasetButton = Array\.from\(\s*"
              r"fixture\.nativeElement\.querySelectorAll<HTMLButtonElement>\('\.facet-option'\),\s*"
              r"\)\.find\(\(element\) => element\.textContent\?\.includes\('Dataset'\)\);"
          )
          replacement = """
              const compiled = fixture.nativeElement as HTMLElement;
              const datasetButton = Array.from(
                compiled.querySelectorAll<HTMLButtonElement>('.facet-option'),
              ).find((element) => element.textContent?.includes('Dataset'));
          """
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one fixture DOM typing match, found {count}')
          spec_path.write_text(text)

          app_path = Path('apps/census-mobile-frontend/src/app/app.ts')
          text = app_path.read_text()
          old = """  private readableValue(value: string): string {
              return value
                .replaceAll('_', ' ')
                .replace(/\\b\\w/g, (letter) => letter.toUpperCase());
            }
          """
          new = """  private readableValue(value: string): string {
              const knownLabels: Readonly<Record<string, string>> = {
                CENSUS: 'Census',
                USGS: 'USGS',
                DATA_GOV: 'Data.gov',
                DOE_OSTI: 'DOE OSTI',
                NASA_CMR: 'NASA CMR',
                PUBMED: 'PubMed',
                OPENALEX: 'OpenAlex',
                OTHER: 'Other',
                DATASET: 'Dataset',
                PUBLICATION: 'Publication',
                CODE: 'Code',
                METHODOLOGY: 'Methodology',
                SUPPORTING_MATERIAL: 'Supporting material',
                PROJECT: 'Project',
              };

              return (
                knownLabels[value] ??
                value
                  .replaceAll('_', ' ')
                  .replace(/\\b\\w/g, (letter) => letter.toUpperCase())
              );
            }
          """
          if old not in text:
              raise SystemExit('Expected readableValue implementation not found')
          app_path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed sources and planning docs
        run: |
          pnpm exec prettier --write \
            apps/census-mobile-frontend/src/app/app.ts \
            apps/census-mobile-frontend/src/app/app.html \
            apps/census-mobile-frontend/src/app/app.scss \
            apps/census-mobile-frontend/src/app/app-module.ts \
            apps/census-mobile-frontend/src/app/app.spec.ts \
            apps/census-mobile-frontend/src/app/state/search/search-route-query.adapter.ts \
            apps/census-mobile-frontend/src/app/state/search/search-route-query.adapter.spec.ts \
            apps/census-mobile-frontend-e2e/src/search-relevance.spec.ts \
            mobile-first/README.md \
            mobile-first/planning/post-pr88-role-alignment-roadmap.md \
            mobile-first/planning/result-explainability-dialog-plan.md

      - name: Lint mobile frontend
        run: pnpm nx run census-mobile-frontend:lint

      - name: Test mobile frontend
        run: pnpm nx run census-mobile-frontend:test

      - name: Build mobile frontend
        run: pnpm nx run census-mobile-frontend:build

      - name: Build mobile Storybook
        run: pnpm nx run census-mobile-frontend:build-storybook --configuration=ci

      - name: Verify generated API contract remains stable
        run: pnpm run openapi:check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run 320px search/filter accessibility journey
        run: pnpm nx run census-mobile-frontend-e2e:e2e

      - name: Remove one-shot workflow
        run: rm .github/workflows/pr91-shareable-filters-validation.yml

      - name: Commit validated mobile continuation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add shareable accessible mobile filters"

      - name: Push validated branch
        run: git push origin HEAD:codex/mobile-first-census-pr91-shareable-filters
