name: F0 corpus storage formatter

on:
  push:
    branches:
      - codex/federated-metadata-catalog
    paths:
      - .github/workflows/f0-format-corpus-storage.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/federated-metadata-catalog
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/discovery-ui-e2e/src/admin-corpus-storage.spec.ts libs/repository/api-client/src/lib/corpus-storage-api.ts
      - run: pnpm exec nx format:check --all
      - name: Commit formatting and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/f0-format-corpus-storage.yml
          git add apps/discovery-ui-e2e/src/admin-corpus-storage.spec.ts libs/repository/api-client/src/lib/corpus-storage-api.ts
          git commit -m "Format corpus storage UI files"
          git push origin HEAD:codex/federated-metadata-catalog
