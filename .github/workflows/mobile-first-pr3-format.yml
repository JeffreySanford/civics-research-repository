name: Mobile-first PR3 formatter

on:
  push:
    branches:
      - codex/mobile-first-census-pr3-search
    paths:
      - .github/workflows/mobile-first-pr3-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: pnpm exec prettier --write apps/census-mobile-frontend/src/app/app.html
      - name: Commit canonical formatting and remove formatter
        run: |
          rm .github/workflows/mobile-first-pr3-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply canonical mobile template formatting"
          git push
