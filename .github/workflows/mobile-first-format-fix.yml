name: Mobile-first formatting fix

on:
  push:
    branches: [codex/mobile-first-census-pr1]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/mobile-first-census-pr1
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format mobile-first planning files with repository Prettier
        run: >-
          pnpm exec prettier --write
          mobile-first/README.md
          mobile-first/documentation/architecture.md
          mobile-first/documentation/experience-engagement-strategy.md
          mobile-first/documentation/infographics-and-data-visualization.md
          mobile-first/planning/implementation-plan.md
          mobile-first/planning/pr1-baseline-checklist.md
          mobile-first/planning/pr1-description-draft.md
          mobile-first/planning/pr1-readiness-note.md
          mobile-first/planning/validation-plan.md

      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mobile-first/README.md \
            mobile-first/documentation/architecture.md \
            mobile-first/documentation/experience-engagement-strategy.md \
            mobile-first/documentation/infographics-and-data-visualization.md \
            mobile-first/planning/implementation-plan.md \
            mobile-first/planning/pr1-baseline-checklist.md \
            mobile-first/planning/pr1-description-draft.md \
            mobile-first/planning/pr1-readiness-note.md \
            mobile-first/planning/validation-plan.md
          git commit -m "style: format mobile-first planning docs"
          git push origin HEAD:codex/mobile-first-census-pr1
