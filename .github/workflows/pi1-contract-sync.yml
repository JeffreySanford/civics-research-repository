name: PI-1 Contract Sync

on:
  push:
    branches: [codex/federated-metadata-catalog]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/federated-metadata-catalog

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format contract and regenerate client types
        run: |
          pnpm exec prettier --write schemas/openapi/repository-api.yaml
          pnpm run openapi:generate

      - name: Commit generated contract artifacts
        run: |
          if git diff --quiet -- schemas/openapi/repository-api.yaml libs/repository/api-client/src/generated/repository-api.types.ts; then
            echo "Contract artifacts are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/openapi/repository-api.yaml libs/repository/api-client/src/generated/repository-api.types.ts
          git commit -m "Format PI-1 provenance contract and regenerate client types"
          git push origin HEAD:codex/federated-metadata-catalog
