name: Browser Evidence

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly full-browser evidence on the default branch after this workflow is merged.
    - cron: '23 9 * * 1'

concurrency:
  group: browser-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-browser-evidence:
    name: Playwright / axe / storyboard
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run deterministic browser evidence
        run: >-
          pnpm exec playwright test
          --config=apps/discovery-ui-e2e/playwright.config.mts
          --grep '@comparison|@wcag|@section508'
          --reporter=html,line

      - name: Upload Playwright report and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  real-stack-search-comparison:
    name: Live Solr + OpenSearch smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_HTML_OPEN: never
      CIVICS_SYNC_STARTUP_ENABLED: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start repository API and both application search engines
        run: docker compose up -d --build postgres solr opensearch repository-api

      - name: Wait for the repository API and startup projection
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            if progress="$(curl -fsS http://localhost:8080/api/admin/reindex/progress 2>/dev/null)"; then
              phase="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.phase ?? "")' "$progress")"
              if [[ "$phase" == "COMPLETED" ]]; then
                curl -fsS http://localhost:8080/api/admin/reindex >/dev/null
                exit 0
              fi
              if [[ "$phase" == "FAILED" ]]; then
                echo "Startup corpus projection failed: $progress" >&2
                docker compose logs --tail=200 repository-api solr opensearch
                exit 1
              fi
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail=200 repository-api solr opensearch
          exit 1

      - name: Rebuild the shared search projection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-evidence-artifacts
          curl -fsS -X POST http://localhost:8080/api/admin/reindex \
            | tee browser-evidence-artifacts/projection.json
          curl -fsS 'http://localhost:8983/solr/discovery/select?q=*:*&rows=0&wt=json' \
            | tee browser-evidence-artifacts/solr-count.json
          curl -fsS 'http://localhost:9200/discovery-comparison/_count' \
            | tee browser-evidence-artifacts/opensearch-count.json

      - name: Run live comparison through the browser
        run: >-
          pnpm exec playwright test
          --config=apps/discovery-ui-e2e/playwright.config.mts
          --grep @realstack
          --project=chromium
          --reporter=html,line

      - name: Record repeated local search timing diagnostics
        run: >-
          pnpm run performance:benchmark
          --base-url http://localhost:8080/api
          --warmups 5
          --samples 100
          --scenario FULL_TEXT_RELEVANCE
          --query 'North Dakota workforce'
          --output browser-evidence-artifacts/search-comparison-benchmark.json

      - name: Capture live-stack logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p browser-evidence-artifacts
          docker compose ps > browser-evidence-artifacts/docker-compose-ps.txt || true
          docker compose logs --no-color repository-api solr opensearch postgres \
            > browser-evidence-artifacts/docker-compose.log 2>&1 || true

      - name: Upload live-stack browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-stack-search-comparison-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            browser-evidence-artifacts
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop live stack
        if: always()
        run: docker compose down --volumes --remove-orphans
