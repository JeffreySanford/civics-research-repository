name: Apply geometry census hardening

on:
  push:
    branches:
      - codex/data-gov-spatial-geometry-census
    paths:
      - .github/workflows/apply-geometry-census-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/data-gov-spatial-geometry-census
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Harden structural validity and format census
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path('tools/scripts/data-gov-spatial-geometry-census.mjs')
          test_path = Path('tools/scripts/data-gov-spatial-geometry-census.test.mjs')
          script = script_path.read_text()
          tests = test_path.read_text()

          old = "if (coordinates.length === 0) state.insufficientElementCount += 1;"
          new = """if (coordinates.length === 0) {
            state.insufficientElementCount += 1;
            state.structurallyValid = false;
          }"""
          if script.count(old) != 1:
              raise SystemExit(f'empty multipolygon guard: expected 1 match, found {script.count(old)}')
          script = script.replace(old, new, 1)

          old = "if (value.length < minimumOuter) state.insufficientElementCount += 1;"
          new = """if (value.length < minimumOuter) {
            state.insufficientElementCount += 1;
            state.structurallyValid = false;
          }"""
          if script.count(old) != 1:
              raise SystemExit(f'empty nested geometry guard: expected 1 match, found {script.count(old)}')
          script = script.replace(old, new, 1)

          anchor = """test('validates centroids as GeoJSON points', () => {"""
          regression = """test('marks empty polygon families structurally invalid', () => {
            for (const geometry of [
              { type: 'Polygon', coordinates: [] },
              { type: 'MultiPolygon', coordinates: [] },
            ]) {
              const result = analyzeGeoJsonGeometry(geometry);
              assert.equal(result.structurallyValid, false);
              assert.equal(result.empty, true);
              assert.equal(result.insufficientElementCount, 1);
            }
          });

          """
          if tests.count(anchor) != 1:
              raise SystemExit(f'test insertion anchor: expected 1 match, found {tests.count(anchor)}')
          tests = tests.replace(anchor, regression + anchor, 1)

          script_path.write_text(script)
          test_path.write_text(tests)
          PY

          pnpm exec prettier --write \
            tools/scripts/data-gov-spatial-geometry-census.mjs \
            tools/scripts/data-gov-spatial-geometry-census.test.mjs \
            package.json

      - name: Verify research harness
        run: |
          node --test tools/scripts/data-gov-spatial-geometry-census.test.mjs
          pnpm performance:test
          pnpm exec prettier --check \
            tools/scripts/data-gov-spatial-geometry-census.mjs \
            tools/scripts/data-gov-spatial-geometry-census.test.mjs \
            package.json

      - name: Commit hardened census
        shell: bash
        run: |
          git config user.name "Jeffrey Sanford"
          git config user.email "jeffrey_sanford@hotmail.com"
          git add \
            tools/scripts/data-gov-spatial-geometry-census.mjs \
            tools/scripts/data-gov-spatial-geometry-census.test.mjs \
            package.json
          git commit -m "test: harden spatial geometry census" || true
          git push origin HEAD:codex/data-gov-spatial-geometry-census
