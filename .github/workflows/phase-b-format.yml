name: Phase B format cleanup

on:
  push:
    branches: [feat/artifact-provenance-persistence]

permissions:
  contents: write

jobs:
  format-and-remove-helper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/artifact-provenance-persistence
          persist-credentials: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format the files identified by the workspace gate
        run: >-
          pnpm exec nx format:write
          --files=apps/discovery-ui-e2e/src/version-provenance.spec.ts,documentation/open-science-research-objects.md,tools/scripts/dspace-provenance-idempotence.mjs

      - name: Commit normalized files and remove this one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase-b-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/discovery-ui-e2e/src/version-provenance.spec.ts \
            documentation/open-science-research-objects.md \
            tools/scripts/dspace-provenance-idempotence.mjs
          git commit -m 'style: format Phase B provenance evidence'
          git push origin HEAD:feat/artifact-provenance-persistence
