name: Metadata Format Apply

on:
  push:
    branches:
      - feat/open-census-metadata-profile
    paths:
      - '.github/workflows/metadata-format-apply.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/open-census-metadata-profile
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Reconcile latest branch and install dependencies
        run: |
          git pull --rebase origin feat/open-census-metadata-profile
          pnpm install --frozen-lockfile

      - name: Format approved metadata design documents
        run: |
          pnpm exec prettier --write \
            docs/superpowers/plans/2026-09-13-open-census-metadata-profile-foundation.md \
            documentation/metadata-export-verification-design.md \
            documentation/open-census-metadata-profile-design.md
          git diff --check

      - name: Commit formatting and remove this one-shot helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/superpowers/plans/2026-09-13-open-census-metadata-profile-foundation.md \
            documentation/metadata-export-verification-design.md \
            documentation/open-census-metadata-profile-design.md
          git rm .github/workflows/metadata-format-apply.yml
          git commit -m 'style(metadata): format design documentation'
          git pull --rebase origin feat/open-census-metadata-profile
          git push origin HEAD:feat/open-census-metadata-profile
