name: PR92 shared search convergence

on:
  push:
    branches:
      - codex/census-ui-relevance-pr92
    paths:
      - .github/workflows/pr92-shared-search-convergence.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/census-ui-relevance-pr92
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.14.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Complete shared badge convergence
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Mobile tests/stories now consume the shared module rather than the deleted local badge.
          path = 'apps/census-mobile-frontend/src/app/app.spec.ts'
          replace(path,
              "import { SearchRelevanceBadgeComponent } from './components/search-relevance-badge/search-relevance-badge.component';\n",
              "import { SearchBadgesModule } from 'shared-ui';\n")
          replace(path,
              "        StoreModule.forRoot({ mobileSearch: mobileSearchReducer }),\n      ],",
              "        StoreModule.forRoot({ mobileSearch: mobileSearchReducer }),\n        SearchBadgesModule,\n      ],")
          replace(path,
              "        SearchRelevanceBadgeComponent,\n",
              "")
          replace(path,
              "    expect(compiled.querySelector('.relevance-badge')).toBeNull();\n",
              "    expect(compiled.querySelector('.relevance-badge')).toBeNull();\n    expect(compiled.querySelector('.search-rank-badge')).toBeNull();\n")

          story = 'apps/census-mobile-frontend/src/app/components/search-relevance-badge/search-relevance-badge.component.stories.ts'
          replace(story,
              "import { SearchRelevanceBadgeComponent } from './search-relevance-badge.component';\n",
              "import { SearchRelevanceBadgeComponent } from 'shared-ui';\n")
          p = Path(story)
          p.write_text(p.read_text().replace('app-search-relevance-badge', 'civics-search-relevance-badge'))

          # Remove duplicated mobile implementation; the story remains as the mobile viewport evidence surface.
          for name in [
              'search-relevance-badge.component.ts',
              'search-relevance-badge.component.html',
              'search-relevance-badge.component.scss',
              'search-relevance-badge.component.spec.ts',
          ]:
              Path('apps/census-mobile-frontend/src/app/components/search-relevance-badge', name).unlink()

          # Remove obsolete app-owned rank-pill styling now owned by shared-ui.
          app_scss = Path('apps/census-mobile-frontend/src/app/app.scss')
          text = app_scss.read_text()
          text = re.sub(r"\n\.result-card__rank \{.*?\n\}\n\n\.result-card__rank--top \{.*?\n\}\n", "\n", text, flags=re.S)
          text = text.replace('  .result-card__rank--top,\n', '')
          app_scss.write_text(text)

          # Desktop becomes the second consumer; state/search math remain unchanged.
          path = 'apps/discovery-ui/src/app/pages/discovery-page.ts'
          replace(path,
              "import { Store } from '@ngrx/store';\n",
              "import { Store } from '@ngrx/store';\nimport { SearchBadgesModule } from 'shared-ui';\n")
          replace(path,
              "  selectSearchResultSource,\n  selectSearchResults,",
              "  selectSearchResultSource,\n  selectSearchResponse,\n  selectSearchResults,")
          replace(path,
              "    ActiveCorpusIdentityComponent,\n    AsyncPipe,",
              "    ActiveCorpusIdentityComponent,\n    SearchBadgesModule,\n    AsyncPipe,")
          replace(path,
              "  templateUrl: './discovery-page.html',\n})",
              "  templateUrl: './discovery-page.html',\n  styleUrl: './discovery-page.scss',\n})")
          replace(path,
              "  protected readonly results$ = this.store.select(selectSearchResults);\n",
              "  protected readonly results$ = this.store.select(selectSearchResults);\n  protected readonly searchResponse$ = this.store.select(selectSearchResponse);\n")

          path = 'apps/discovery-ui/src/app/pages/discovery-page.html'
          replace(path,
              "          } }\n        </div>\n\n        @if (loading$ | async) {",
              "          } }\n          @if (searchResponse$ | async; as searchResponse) {\n          @if (searchResponse.relevanceModel && searchResponse.query.trim()) {\n          <p class=\"results-relevance-note\">\n            Rank shows the server-returned result order. Match labels are query-relative search evidence, not percentages.\n            @if (!searchResponse.relevanceModel.calibrated) { Thresholds are still being calibrated against judged queries. }\n          </p>\n          } }\n        </div>\n\n        @if (loading$ | async) {")
          replace(path,
              "        @for (result of results; track result.id) {\n        <li>\n          <article>\n",
              "        @for (result of results; track result.id; let index = $index) {\n        <li>\n          <article>\n            @if (searchResponse$ | async; as searchResponse) {\n            @if (searchResponse.query.trim()) {\n            <div class=\"result-ranking\">\n              <civics-search-rank-badge\n                [rank]=\"searchResponse.page * searchResponse.pageSize + index + 1\"\n              ></civics-search-rank-badge>\n              <civics-search-relevance-badge\n                [relevance]=\"result.relevance\"\n              ></civics-search-relevance-badge>\n            </div>\n            } }\n")

          Path('apps/discovery-ui/src/app/pages/discovery-page.scss').write_text('''\
          .result-ranking {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 0.65rem;
          }

          .results-relevance-note {
            max-width: 70ch;
            margin: 0.5rem 0 0;
            color: var(--civics-text-secondary);
            line-height: 1.5;
          }
          ''')

          # Component-level desktop evidence plus axe in a state the generic browser fixture does not supply.
          path = 'apps/discovery-ui/src/app/pages/discovery-page.a11y.spec.ts'
          p = Path(path)
          text = p.read_text()
          anchor = "  it('is accessible with no results', async () => {"
          if anchor not in text:
              raise SystemExit('discovery a11y anchor missing')
          test = '''\
          it('presents server-owned rank and relevance accessibly for a real query', async () => {
            const fixture = await renderWith({
              loading: false,
              response: {
                resultSource: 'REPOSITORY',
                query: 'North Dakota migration',
                page: 0,
                pageSize: 25,
                totalResults: 1,
                results: [
                  {
                    id: 'north-dakota-migration',
                    title: 'Migration Flows for North Dakota',
                    contentType: 'DATASET',
                    program: 'ACS',
                    publisher: 'U.S. Census Bureau',
                    summary: 'Migration research metadata for North Dakota.',
                    sourceUrl: 'https://www.census.gov/',
                    sourceSystem: 'DSPACE',
                    origin: 'CURATED',
                    relevance: {
                      rawScore: 10,
                      normalizedScore: 1,
                      band: 'STRONG',
                    },
                  },
                ],
                facets: [],
                relevanceModel: {
                  engine: 'SOLR',
                  normalization: 'SOLR_MAX_SCORE_RATIO_V1',
                  calibrated: false,
                },
              },
            });

            const root = fixture.nativeElement as HTMLElement;
            expect(root.querySelector('.search-rank-badge')?.textContent).toContain('Rank 1');
            expect(root.querySelector('.relevance-badge')?.textContent).toContain('Strong match');
            expect(root.querySelector('.results-relevance-note')?.textContent).toContain('not percentages');
            expect(root.textContent).not.toContain('100%');
            await expectNoAxeViolations(root);
          });

          '''
          p.write_text(text.replace(anchor, test + anchor, 1))

          # Browser evidence: desktop parity and explicitly unscored empty browse.
          Path('apps/discovery-ui-e2e/src/discovery-search-ranking.spec.ts').write_text('''\
          import { expect, test, type Page } from '@playwright/test';
          import AxeBuilder from '@axe-core/playwright';
          import { axeEngineeringTags } from './support/axe-tags';
          import { mockRepositoryApi } from './support/repository-api-mocks';

          async function mockRankingEvidence(page: Page): Promise<void> {
            await page.route('**/api/search/cursor**', async (route) => {
              const url = new URL(route.request().url());
              const query = url.searchParams.get('q')?.trim() ?? '';
              const ranked = query.length > 0;
              const results = [
                {
                  id: 'north-dakota-migration',
                  title: ranked ? 'Migration Flows for North Dakota' : 'Repository browse record',
                  contentType: 'DATASET',
                  program: 'ACS',
                  publisher: 'U.S. Census Bureau',
                  summary: 'Migration research metadata for North Dakota.',
                  geography: 'North Dakota',
                  sourceUrl: 'https://www.census.gov/',
                  accessLevel: 'PUBLIC',
                  sourceSystem: 'DSPACE',
                  origin: 'CURATED',
                  ...(ranked
                    ? { relevance: { rawScore: 10, normalizedScore: 1, band: 'STRONG' } }
                    : {}),
                },
              ];

              await route.fulfill({
                contentType: 'application/json',
                json: {
                  search: {
                    resultSource: 'REPOSITORY',
                    query,
                    page: 0,
                    pageSize: 25,
                    totalResults: results.length,
                    results,
                    facets: [],
                    ...(ranked
                      ? {
                          relevanceModel: {
                            engine: 'SOLR',
                            normalization: 'SOLR_MAX_SCORE_RATIO_V1',
                            calibrated: false,
                          },
                        }
                      : {}),
                  },
                  nextCursor: null,
                },
              });
            });
          }

          test.describe('desktop search ranking presentation', () => {
            test.beforeEach(async ({ page }) => {
              await mockRepositoryApi(page);
              await mockRankingEvidence(page);
            });

            test('uses the shared rank and relevance semantics for a query @wcag @section508', async ({ page }) => {
              await page.goto('/discovery?q=North%20Dakota%20migration');

              await expect(page.getByText('Top ranked')).toBeVisible();
              await expect(page.getByText('Rank 1')).toBeVisible();
              await expect(page.getByText('Strong match')).toBeVisible();
              await expect(page.getByText('Match labels are query-relative search evidence')).toBeVisible();
              await expect(page.getByText('100%')).toHaveCount(0);

              const results = await new AxeBuilder({ page }).withTags(axeEngineeringTags).analyze();
              expect(results.violations).toEqual([]);
            });

            test('does not call an empty repository browse ranked or relevant @wcag @section508', async ({ page }) => {
              await page.goto('/discovery');

              await expect(page.locator('.search-rank-badge')).toHaveCount(0);
              await expect(page.locator('.relevance-badge')).toHaveCount(0);
              await expect(page.locator('.results-relevance-note')).toHaveCount(0);
            });
          });
          ''')

          # Next mobile slice: result -> detail -> exact search return.
          Path('mobile-first/planning/mobile-research-detail-navigation.md').write_text('''\
          # Mobile research-detail navigation

          Status: planned after shared search-presentation convergence (PR #92).

          ## User problem

          Search results are currently informative but not actionable. A reader can evaluate rank, match strength, summary, and match evidence, but cannot open the individual research object from the mobile-first application.

          ## Goal

          Make each mobile search result a gateway to the existing authority-neutral research detail contract, while preserving the exact search/filter context for a reliable return journey.

          ## Proposed interaction

          - Give each result a clear `View research object` link; the title may also link to the same destination, but the card itself will not become a giant ambiguous click target.
          - Route to `/research/:researchId` using the same canonical Base64URL identity encoding used by `discovery-ui`.
          - Render a mobile-first detail page from `RepositoryDatasetsApi.getResearchObject(researchId)`; do not create a mobile-only backend endpoint.
          - Put a visible `Back to results` control before the detail heading.
          - Prefer browser history when the detail was opened from results, so the original query, filters, scroll/history entry, and URL are restored naturally.
          - For a directly opened/deep-linked detail page with no usable search history, fall back to the last explicit search return URL carried in navigation state/query context, otherwise return to `/`.
          - Move focus to the detail heading after navigation. Returning should restore focus to the result link that launched the detail when practical; at minimum the results heading must receive deterministic focus.

          ## Detail states

          The mobile page must visibly handle loading, error/not-found, curated DSpace detail, and federated detail. Curated objects may expose repository-owned enrichments; federated objects must keep their external authority/provenance clear. Reuse the existing research-object contract and its authority rules rather than copying desktop presentation wholesale.

          ## Accessibility and navigation acceptance

          1. Keyboard and touch users can open every result without relying on card-click JavaScript.
          2. The link has an accessible name identifying the record or action.
          3. The detail route is deep-linkable and refresh-safe.
          4. `Back to results` restores the exact query and active filters, including URLs such as `?q=North%20Dakota%20migration&type=DATASET`.
          5. Browser Back behaves consistently with the visible Back control.
          6. Heading/focus behavior is deterministic and verified in Playwright.
          7. 320 px reflow, axe/WCAG checks, loading/error states, and both curated/federated fixtures are covered.
          8. The detail page does not invent ranking or search evidence; those belong to the originating result/search context.

          ## Suggested implementation slice

          Treat this as the next mobile functional PR after #92. Keep NgRx/RxJS for the asynchronous detail request and local Signals only for synchronous view state if needed. Reuse a shared research-ID codec if the second frontend now justifies extracting the desktop helper.
          ''')
          PY
      - name: Format changed sources
        run: pnpm exec prettier --write apps/census-mobile-frontend/src/app apps/discovery-ui/src/app/pages/discovery-page.ts apps/discovery-ui/src/app/pages/discovery-page.html apps/discovery-ui/src/app/pages/discovery-page.scss apps/discovery-ui-e2e/src/discovery-search-ranking.spec.ts libs/shared/ui/src mobile-first/planning/mobile-research-detail-navigation.md
      - name: Lint shared and both frontends
        run: pnpm nx run-many -t lint -p shared-ui,census-mobile-frontend,discovery-ui
      - name: Test shared UI
        run: pnpm nx test shared-ui
      - name: Test mobile frontend
        run: pnpm nx test census-mobile-frontend
      - name: Test discovery UI
        run: pnpm nx test discovery-ui
      - name: Build mobile frontend
        run: pnpm nx build census-mobile-frontend --configuration=production
      - name: Build mobile Storybook
        run: pnpm nx build-storybook census-mobile-frontend --configuration=ci
      - name: Build discovery UI
        run: pnpm nx build discovery-ui --configuration=production
      - name: Commit validated convergence
        shell: bash
        run: |
          rm .github/workflows/pr92-shared-search-convergence.yml
          git config user.name "JeffreySanford"
          git config user.email "JeffreySanford@users.noreply.github.com"
          git add -A
          git commit -m "feat: share search rank and relevance across frontends"
          git push origin HEAD:codex/census-ui-relevance-pr92
