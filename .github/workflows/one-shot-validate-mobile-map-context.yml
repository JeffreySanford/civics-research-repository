name: One-shot validate mobile map context

on:
  push:
    branches:
      - feat/mobile-map-context-presets

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.14.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Normalize formatting
        run: pnpm exec nx format:write --all
      - name: Check formatting
        run: pnpm exec nx format:check
      - name: Lint mobile app
        run: pnpm exec nx lint census-mobile-frontend
      - name: Lint mobile e2e
        run: pnpm exec nx lint census-mobile-frontend-e2e
      - name: Unit test mobile app
        run: pnpm exec nx test census-mobile-frontend --skip-nx-cache
      - name: Build mobile app
        run: pnpm exec nx build census-mobile-frontend --configuration=production --skip-nx-cache
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run focused mobile map context evidence
        run: pnpm exec playwright test apps/census-mobile-frontend-e2e/src/research-map-preview.spec.ts --config=apps/census-mobile-frontend-e2e/playwright.config.mts --project=chromium-320 --reporter=list
      - name: Commit formatter output
        if: success()
        run: |
          if git diff --quiet; then
            echo "No formatter changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/census-mobile-frontend apps/census-mobile-frontend-e2e
          if git diff --cached --quiet; then
            echo "No product/test formatter changes to commit."
            exit 0
          fi
          git commit -m "style: normalize mobile map context slice"
          git push origin HEAD:feat/mobile-map-context-presets
