name: Maps Research Coverage UI Patch

on:
  push:
    branches:
      - codex/maps-research-coverage-ui
    paths:
      - tools/scripts/patch-research-coverage-summary-component.mjs
      - apps/discovery-ui/src/app/pages/research-coverage-summary.component.ts
      - apps/discovery-ui/src/app/pages/research-coverage-summary.component.stories.ts
      - apps/discovery-ui/src/app/pages/research-coverage-summary.component.a11y.spec.ts
      - .github/workflows/maps-research-coverage-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/maps-research-coverage-ui
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Wire semantic Research Coverage component
        run: node tools/scripts/patch-research-coverage-summary-component.mjs
      - name: Format Storybook slice
        run: >-
          pnpm exec prettier --write
          apps/discovery-ui/src/app/pages/maps-page.ts
          apps/discovery-ui/src/app/pages/maps-page.html
          apps/discovery-ui/src/app/pages/research-coverage-summary.component.ts
          apps/discovery-ui/src/app/pages/research-coverage-summary.component.stories.ts
          apps/discovery-ui/src/app/pages/research-coverage-summary.component.a11y.spec.ts
      - name: Unit and axe tests
        run: pnpm exec nx test discovery-ui
      - name: Build discovery UI
        run: pnpm exec nx build discovery-ui
      - name: Build accessibility Storybook
        run: pnpm exec nx build-storybook discovery-ui --configuration=ci
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Storybook interactions and WCAG axe evidence
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec http-server dist/storybook/discovery-ui \
            -p 4400 -c-1 --cors > storybook-ci.log 2>&1 &
          storybook_pid=$!
          trap 'kill "$storybook_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4400/index.json >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            cat storybook-ci.log
            exit 1
          fi
          pnpm exec nx test-storybook discovery-ui
      - name: Re-run targeted Maps browser evidence
        run: >-
          pnpm exec playwright test
          apps/discovery-ui-e2e/src/research-coverage.spec.ts
          apps/discovery-ui-e2e/src/map-layer-visibility.spec.ts
          --config=apps/discovery-ui-e2e/playwright.config.mts
          --project=chromium
          --reporter=line
      - name: Commit Storybook slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/discovery-ui/src/app/pages/maps-page.ts \
                  apps/discovery-ui/src/app/pages/maps-page.html \
                  apps/discovery-ui/src/app/pages/research-coverage-summary.component.ts \
                  apps/discovery-ui/src/app/pages/research-coverage-summary.component.stories.ts \
                  apps/discovery-ui/src/app/pages/research-coverage-summary.component.a11y.spec.ts
          if git diff --cached --quiet; then
            echo "No Storybook slice changes to commit."
            exit 0
          fi
          git commit -m "test: add Storybook research coverage evidence"
          git push origin HEAD:codex/maps-research-coverage-ui
