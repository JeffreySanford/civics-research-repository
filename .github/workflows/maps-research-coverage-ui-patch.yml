name: Maps Research Coverage UI Patch

on:
  push:
    branches:
      - codex/maps-research-coverage-ui
    paths:
      - tools/scripts/patch-maps-research-coverage-ui.mjs
      - tools/scripts/fix-maps-research-coverage-ui-patcher.mjs
      - .github/workflows/maps-research-coverage-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/maps-research-coverage-ui
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Correct temporary patcher quoting
        run: node tools/scripts/fix-maps-research-coverage-ui-patcher.mjs
      - name: Apply UI patch
        run: node tools/scripts/patch-maps-research-coverage-ui.mjs
      - name: Format patched files
        run: >-
          pnpm exec prettier --write
          apps/discovery-ui/src/app/pages/maps-page.ts
          apps/discovery-ui/src/app/pages/maps-page.html
          apps/discovery-ui/src/app/pages/maps-page.utils.ts
      - name: Build discovery UI
        run: pnpm exec nx build discovery-ui
      - name: Commit patched UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/discovery-ui/src/app/pages/maps-page.ts \
                  apps/discovery-ui/src/app/pages/maps-page.html \
                  apps/discovery-ui/src/app/pages/maps-page.utils.ts
          if git diff --cached --quiet; then
            echo "No UI changes to commit."
            exit 0
          fi
          git commit -m "feat: render bounded publisher research geometry"
          git push origin HEAD:codex/maps-research-coverage-ui
