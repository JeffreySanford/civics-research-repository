name: Maps Research Coverage UI Patch

on:
  push:
    branches:
      - codex/maps-research-coverage-ui
    paths:
      - tools/scripts/patch-maps-research-coverage-evidence.mjs
      - tools/scripts/patch-maps-research-coverage-fallback.mjs
      - apps/discovery-ui-e2e/src/research-coverage.spec.ts
      - .github/workflows/maps-research-coverage-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/maps-research-coverage-ui
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply accessible viewport fallback
        run: node tools/scripts/patch-maps-research-coverage-fallback.mjs
      - name: Apply evidence migration
        run: node tools/scripts/patch-maps-research-coverage-evidence.mjs
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/discovery-ui/src/app/pages/maps-page.ts
          apps/discovery-ui/src/app/state/maps/maps.effects.spec.ts
          apps/discovery-ui-e2e/src/support/repository-api-mocks.ts
          apps/discovery-ui-e2e/src/support/map-layer-visibility.ts
          apps/discovery-ui-e2e/src/research-coverage.spec.ts
      # This run is intentionally the narrow pre-PR proof for the migrated Research Coverage
      # contract. Full workspace, Storybook, cross-browser, and live-stack gates run on the PR.
      - name: Unit tests
        run: pnpm exec nx test discovery-ui
      - name: Build discovery UI
        run: pnpm exec nx build discovery-ui
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Research Coverage browser evidence
        run: >-
          pnpm exec playwright test
          apps/discovery-ui-e2e/src/research-coverage.spec.ts
          apps/discovery-ui-e2e/src/map-layer-visibility.spec.ts
          --config=apps/discovery-ui-e2e/playwright.config.mts
          --project=chromium
          --reporter=line
      - name: Commit evidence migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/discovery-ui/src/app/pages/maps-page.ts \
                  apps/discovery-ui/src/app/state/maps/maps.effects.spec.ts \
                  apps/discovery-ui-e2e/src/support/repository-api-mocks.ts \
                  apps/discovery-ui-e2e/src/support/map-layer-visibility.ts \
                  apps/discovery-ui-e2e/src/research-coverage.spec.ts
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
            exit 0
          fi
          git commit -m "test: prove bounded publisher research coverage"
          git push origin HEAD:codex/maps-research-coverage-ui
