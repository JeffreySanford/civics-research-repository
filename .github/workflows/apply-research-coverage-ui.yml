name: Apply staged research coverage UI

on:
  push:
    branches:
      - codex/searchable-research-map-coverage
    paths:
      - .github/workflows/apply-research-coverage-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/searchable-research-map-coverage
          persist-credentials: true
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Harden staged HTML warning anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/scripts/apply-research-coverage-ui.mjs')
          source = path.read_text()
          before = r"""  source = replaceOnce(
              source,
              `    } @if (earthquakeStale$ | async) {`,
              `    } @if (researchCoverageError$ | async; as researchCoverageError) {\n    <p class="warning-message" role="status">\n      Repository research coverage unavailable: {{ researchCoverageError }}\n    </p>\n    } @if (earthquakeStale$ | async) {`,
              'research coverage warning',
            );"""
          after = r"""  source = replaceOnce(
              source,
              `      SAIPE county choropleth unavailable: {{ saipeError }}\n    </p>\n    } @if (earthquakeStale$ | async) {`,
              `      SAIPE county choropleth unavailable: {{ saipeError }}\n    </p>\n    } @if (researchCoverageError$ | async; as researchCoverageError) {\n    <p class="warning-message" role="status">\n      Repository research coverage unavailable: {{ researchCoverageError }}\n    </p>\n    } @if (earthquakeStale$ | async) {`,
              'research coverage warning',
            );"""
          if source.count(before) != 1:
              raise SystemExit(f'Expected one staged warning patch; found {source.count(before)}')
          path.write_text(source.replace(before, after))
          PY

      - name: Apply staged UI transformation
        run: node tools/scripts/apply-research-coverage-ui.mjs

      - name: Remove one-shot transformation helper
        run: git rm tools/scripts/apply-research-coverage-ui.mjs

      - name: Format changed implementation
        run: |
          pnpm exec prettier --write \
            apps/discovery-ui/src/app/pages/discovery-page.ts \
            apps/discovery-ui/src/app/pages/maps-page.ts \
            apps/discovery-ui/src/app/pages/maps-page.html \
            apps/discovery-ui/src/app/pages/maps-page.utils.ts \
            apps/discovery-ui/src/app/state/maps/maps.actions.ts \
            apps/discovery-ui/src/app/state/maps/maps.effects.ts \
            apps/discovery-ui/src/app/state/maps/maps.effects.spec.ts \
            apps/discovery-ui/src/app/state/maps/maps.reducer.ts \
            apps/discovery-ui/src/app/state/maps/maps.selectors.ts \
            apps/discovery-ui/src/app/state/maps/research-coverage.ts \
            apps/discovery-ui/src/app/state/maps/research-coverage.spec.ts \
            libs/shared/material/src/lib/theme/civics-layout.scss \
            tools/scripts/data-gov-spatial-availability.mjs \
            tools/scripts/data-gov-spatial-availability.test.mjs \
            documentation/workstreams/searchable-research-map-coverage/README.md \
            package.json

      - name: Check repository formatting
        run: pnpm exec nx format:check --all

      - name: Test spatial availability probe
        run: node --test tools/scripts/data-gov-spatial-availability.test.mjs

      - name: Test discovery UI
        run: pnpm nx run discovery-ui:test

      - name: Build discovery UI
        run: pnpm nx run discovery-ui:build

      - name: Commit generated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'feat: render repository research coverage on Maps'
          git push origin HEAD:codex/searchable-research-map-coverage
