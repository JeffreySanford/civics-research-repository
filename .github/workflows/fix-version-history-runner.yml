name: Fix version history validation runner

on:
  push:
    branches:
      - feat/artifact-version-provenance

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/artifact-version-provenance
          fetch-depth: 0

      - name: Fix pre-commit generated-contract validation
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/pnpm run openapi:check/d' .github/workflows/implement-version-history-phase-a.yml
          rm .github/workflows/fix-version-history-runner.yml

      - name: Commit runner correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: validate generated contract after commit"
          git push origin HEAD:feat/artifact-version-provenance
