name: Metadata Contract

on:
  pull_request:
    paths:
      - 'schemas/openapi/**'
      - 'libs/repository/api-client/**'
      - 'apps/repository-api/**'
      - 'tools/dspace/**'
      - 'tools/scripts/**metadata**'
      - 'documentation/**metadata**'
      - '.github/workflows/metadata-contract.yml'

concurrency:
  group: metadata-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client-contract:
    name: Typed metadata contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test typed metadata contract
        run: pnpm nx test repository-api-client
