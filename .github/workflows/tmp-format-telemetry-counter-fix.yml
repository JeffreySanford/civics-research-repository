name: Temporary telemetry counter formatter

on:
  push:
    branches:
      - codex/search-resource-telemetry

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/search-resource-telemetry
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          tools/scripts/search-comparison-resource-telemetry.mjs
          tools/scripts/search-comparison-resource-telemetry.test.mjs
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/scripts/search-comparison-resource-telemetry.mjs tools/scripts/search-comparison-resource-telemetry.test.mjs
          git commit -m "style: format telemetry counter semantics"
          git push origin HEAD:codex/search-resource-telemetry
