name: Apply proven Storybook test foundation v4

on:
  push:
    branches: [codex/layered-test-coverage-foundation]
    paths: [.github/workflows/apply-storybook-test-foundation-v4.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/layered-test-coverage-foundation
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install current workspace
        run: pnpm install --frozen-lockfile

      - name: Generate Storybook foundation
        env:
          NX_INTERACTIVE: 'false'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec nx g @nx/angular:storybook-configuration discovery-ui \
            --interactionTests=true \
            --generateStories=false \
            --configureStaticServe=true
          pnpm add -Dw \
            @storybook/addon-a11y@^10.5.0 \
            @storybook/test-runner@^0.24.0 \
            http-server@14.1.1

      - name: Configure Storybook and measured coverage
        shell: bash
        run: |
          set -euo pipefail
          cat > apps/discovery-ui/.storybook/main.ts <<'EOF'
          import type { StorybookConfig } from '@storybook/angular';

          const config: StorybookConfig = {
            stories: ['../src/app/**/*.@(mdx|stories.@(js|jsx|ts|tsx))'],
            addons: ['@storybook/addon-a11y'],
            framework: {
              name: '@storybook/angular',
              options: {},
            },
          };

          export default config;
          EOF

          cat > apps/discovery-ui/.storybook/preview.ts <<'EOF'
          import type { Preview } from '@storybook/angular';

          const preview: Preview = {
            parameters: {
              a11y: {
                test: 'error',
                options: {
                  runOnly: {
                    type: 'tag',
                    values: [
                      'wcag2a',
                      'wcag2aa',
                      'wcag21a',
                      'wcag21aa',
                      'wcag22aa',
                      'best-practice',
                    ],
                  },
                },
              },
            },
          };

          export default preview;
          EOF

          node <<'EOF'
          const fs = require('node:fs');
          const path = 'apps/discovery-ui/project.json';
          const project = JSON.parse(fs.readFileSync(path, 'utf8'));

          project.targets.build.configurations.storybook = {
            optimization: false,
            extractLicenses: false,
            sourceMap: false,
          };

          for (const targetName of ['storybook', 'build-storybook']) {
            project.targets[targetName].options.browserTarget =
              'discovery-ui:build:storybook';
            delete project.targets[targetName].options.styles;
          }

          project.targets['test-coverage'] = {
            executor: '@angular/build:unit-test',
            options: {
              watch: false,
              coverage: true,
              coverageReporters: ['text-summary', 'json-summary', 'lcov'],
              coverageThresholds: {
                statements: 69,
                branches: 67,
                functions: 65,
                lines: 70,
              },
            },
          };

          fs.writeFileSync(path, `${JSON.stringify(project, null, 2)}\n`);
          EOF

      - name: Add curated accessibility stories
        shell: bash
        run: |
          set -euo pipefail
          cat > apps/discovery-ui/src/app/pages/admin-viz/bar-chart.component.stories.ts <<'EOF'
          import type { Meta, StoryObj } from '@storybook/angular';
          import { expect, within } from 'storybook/test';
          import { AdminBarChartComponent } from './bar-chart.component';

          const meta: Meta<AdminBarChartComponent> = {
            title: 'Accessibility/Admin visualizations/Bar chart',
            component: AdminBarChartComponent,
            parameters: { layout: 'padded' },
          };

          export default meta;
          type Story = StoryObj<AdminBarChartComponent>;

          export const CertifiedC2Composition: Story = {
            args: {
              caption: 'Certified C2 corpus by source',
              items: [
                { label: 'Data.gov', value: 500_000 },
                { label: 'DOE OSTI', value: 500_000 },
                { label: 'Curated DSpace', value: 181 },
              ],
            },
            play: async ({ canvasElement }) => {
              const canvas = within(canvasElement);
              const table = canvas.getByRole('table', {
                name: 'Certified C2 corpus by source',
              });
              const semanticTable = within(table);
              await expect(
                semanticTable.getByRole('rowheader', { name: 'Data.gov' }),
              ).toBeInTheDocument();
              await expect(
                semanticTable.getByRole('cell', { name: '181' }),
              ).toBeInTheDocument();
            },
          };

          export const LongLabelsAndReflow: Story = {
            args: {
              caption: 'Long source labels for reflow and zoom review',
              items: [
                {
                  label:
                    'Data.gov retained federal research metadata with an intentionally long source label',
                  value: 500_000,
                },
                {
                  label:
                    'Department of Energy Office of Scientific and Technical Information retained metadata',
                  value: 500_000,
                },
              ],
            },
          };

          export const Empty: Story = {
            args: { caption: 'No indexed research objects', items: [] },
            play: async ({ canvasElement }) => {
              const canvas = within(canvasElement);
              await expect(
                canvas.getByRole('table', { name: 'No indexed research objects' }),
              ).toBeInTheDocument();
            },
          };
          EOF

          cat > apps/discovery-ui/src/app/pages/admin-viz/donut-chart.component.stories.ts <<'EOF'
          import type { Meta, StoryObj } from '@storybook/angular';
          import { expect, within } from 'storybook/test';
          import { AdminDonutChartComponent } from './donut-chart.component';

          const meta: Meta<AdminDonutChartComponent> = {
            title: 'Accessibility/Admin visualizations/Donut chart',
            component: AdminDonutChartComponent,
            parameters: { layout: 'padded' },
          };

          export default meta;
          type Story = StoryObj<AdminDonutChartComponent>;

          export const CertifiedC2Composition: Story = {
            args: {
              caption: 'Certified C2 corpus by source',
              segments: [
                { label: 'Data.gov', value: 500_000, color: '#315da8' },
                { label: 'DOE OSTI', value: 500_000, color: '#8a4f12' },
                { label: 'Curated DSpace', value: 181, color: '#5b5f63' },
              ],
            },
            play: async ({ canvasElement }) => {
              const canvas = within(canvasElement);
              await expect(
                canvas.getByRole('img', { name: 'Certified C2 corpus by source' }),
              ).toBeInTheDocument();
              const table = canvas.getByRole('table', {
                name: 'Certified C2 corpus by source',
              });
              await expect(
                within(table).getByRole('rowheader', { name: 'Curated DSpace' }),
              ).toBeInTheDocument();
            },
          };

          export const UnevenAndLongLabels: Story = {
            args: {
              caption: 'Uneven source distribution with long labels',
              segments: [
                {
                  label:
                    'Data.gov retained federal research metadata with an intentionally long source label',
                  value: 999_999,
                  color: '#315da8',
                },
                {
                  label: 'Curated repository authority records',
                  value: 1,
                  color: '#5b5f63',
                },
              ],
            },
          };

          export const Empty: Story = {
            args: { caption: 'No indexed research objects', segments: [] },
            play: async ({ canvasElement }) => {
              const canvas = within(canvasElement);
              await expect(
                canvas.getByRole('img', { name: 'No indexed research objects' }),
              ).toBeInTheDocument();
              await expect(
                canvas.getByRole('table', { name: 'No indexed research objects' }),
              ).toBeInTheDocument();
            },
          };
          EOF

      - name: Format and prove foundation
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/discovery-ui/project.json \
            apps/discovery-ui/tsconfig.app.json \
            apps/discovery-ui/tsconfig.json \
            apps/discovery-ui/.storybook/main.ts \
            apps/discovery-ui/.storybook/preview.ts \
            apps/discovery-ui/.storybook/tsconfig.json \
            apps/discovery-ui/src/app/pages/admin-viz/bar-chart.component.stories.ts \
            apps/discovery-ui/src/app/pages/admin-viz/donut-chart.component.stories.ts

          pnpm exec nx test discovery-ui
          pnpm exec nx run discovery-ui:test-coverage
          pnpm exec nx build-storybook discovery-ui --configuration=ci

          pnpm exec playwright install --with-deps chromium
          pnpm exec http-server dist/storybook/discovery-ui \
            -p 4400 -c-1 --cors > /tmp/storybook-foundation.log 2>&1 &
          storybook_pid=$!
          trap 'kill "$storybook_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4400/index.json >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            cat /tmp/storybook-foundation.log
            exit 1
          fi

          pnpm exec nx test-storybook discovery-ui
          kill "$storybook_pid" 2>/dev/null || true
          trap - EXIT

      - name: Commit proven generated foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jeffrey Sanford'
          git config user.email 'jeffrey_sanford@hotmail.com'
          git add \
            package.json \
            pnpm-lock.yaml \
            nx.json \
            apps/discovery-ui/project.json \
            apps/discovery-ui/tsconfig.app.json \
            apps/discovery-ui/tsconfig.json \
            apps/discovery-ui/.storybook \
            apps/discovery-ui/src/app/pages/admin-viz/bar-chart.component.stories.ts \
            apps/discovery-ui/src/app/pages/admin-viz/donut-chart.component.stories.ts
          git commit -m 'test: add Storybook WCAG and coverage foundation'
          git push origin HEAD:codex/layered-test-coverage-foundation
