# Continuous integration for the Civics Research Repository.
#
# `gates` runs deterministic workspace checks, including generated artifact drift. Browser evidence
# remains separate because it needs a dev server, multiple browsers and longer failure artifacts.
# `api` builds and tests the Spring Boot service inside its Gradle container image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Workspace gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply formatting for diagnostic run
        run: pnpm exec nx format:write --all

      - name: Regenerate platform status for diagnostic run
        run: pnpm run docs:status

      - name: Commit confirmed formatting fixes to diagnostic branch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/ci-security-gates-2026-08-20'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md \
            apps/discovery-ui-e2e/src/keyboard-operability.spec.ts \
            apps/discovery-ui/src/app/pages/evidence-page.html \
            documentation/accessibility-manual-evidence.md \
            documentation/architecture.md \
            documentation/demo/demo-script.md \
            documentation/platform-status.md \
            tools/scripts/accessibility-evidence.mjs \
            tools/scripts/platform-status.mjs
          if git diff --cached --quiet; then
            echo "Confirmed files already match formatter and generated status."
            exit 0
          fi
          git commit -m "Normalize formatting and refresh platform status"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"

      - name: Check formatting
        run: pnpm exec nx format:check --all

      - name: Lint the OpenAPI contract
        run: pnpm run openapi:lint

      - name: Check generated API types are current
        run: pnpm run openapi:check

      - name: Check the fixture catalog is current
        run: pnpm run fixture:check

      - name: Check the accessibility evidence manifest is current
        run: pnpm run evidence:check

      - name: Check the generated platform status is current
        run: pnpm run docs:check

      - name: Lint
        run: pnpm exec nx run-many -t lint --all

      - name: Unit tests
        run: pnpm exec nx run-many -t test --exclude repository-api

      - name: Build the discovery UI
        run: pnpm exec nx build discovery-ui

  api:
    name: Repository API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Test
        run: docker build -f apps/repository-api/Dockerfile --target test .

      - name: Build the runtime image
        run: docker build -f apps/repository-api/Dockerfile --target runtime -t civics-repository-api:ci .
