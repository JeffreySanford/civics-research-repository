# Temporary formatting capture for PR #16. This workflow is restored immediately after the runner
# uploads the exact Prettier 3.6.2 blobs for the four files still failing format:check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gates:
    name: Workspace gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture exact formatted blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            apps/discovery-ui-e2e/src/discovery-cursor-pagination.spec.ts
            apps/discovery-ui/src/app/state/search/search.cursor.effects.spec.ts
            package.json
            tools/scripts/cursor-traversal-evidence.mjs
          )
          pnpm exec prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            encoded="$(base64 -w0 "$file")"
            sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" -f content="$encoded" -f encoding=base64 --jq .sha)"
            echo "CURSOR_FORMAT_BLOB_SHA:${file}:$sha"
          done
          exit 1

  api:
    name: Repository API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Test
        run: docker build -f apps/repository-api/Dockerfile --target test .

      - name: Build the runtime image
        run: docker build -f apps/repository-api/Dockerfile --target runtime -t civics-repository-api:ci .
