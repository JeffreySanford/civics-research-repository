# Continuous integration for the Civics Research Repository.
#
# `gates` runs deterministic workspace checks, including generated artifact drift. Browser evidence
# remains separate because it needs a dev server, multiple browsers and longer failure artifacts.
# `api` builds and tests the Spring Boot service inside its Gradle container image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Workspace gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Temporary draft-only capture. Remove after the generated files are committed.
      - name: Generate Nx Angular Storybook scaffold and a11y dependencies
        env:
          NX_INTERACTIVE: 'false'
        run: |
          pnpm exec nx g @nx/angular:storybook-configuration discovery-ui \
            --interactionTests=true \
            --generateStories=false \
            --configureStaticServe=true
          pnpm add -Dw @storybook/addon-a11y@^10.5.0 @storybook/test-runner@^0.24.0

      - name: Prove generated Storybook build target
        run: pnpm exec nx build-storybook discovery-ui --configuration=ci

      - name: Upload generated Storybook scaffold
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-scaffold-${{ github.run_id }}
          path: |
            package.json
            pnpm-lock.yaml
            nx.json
            apps/discovery-ui/project.json
            apps/discovery-ui/tsconfig.app.json
            apps/discovery-ui/tsconfig.json
            apps/discovery-ui/.storybook
          if-no-files-found: error
          retention-days: 2
          include-hidden-files: true

      - name: Check formatting
        run: pnpm exec nx format:check --all

      - name: Lint the OpenAPI contract
        run: pnpm run openapi:lint

      - name: Check generated API types are current
        run: pnpm run openapi:check

      - name: Check the fixture catalog is current
        run: pnpm run fixture:check

      - name: Check the accessibility evidence manifest is current
        run: pnpm run evidence:check

      - name: Check the generated platform status is current
        run: pnpm run docs:check

      - name: Test the performance-statistics harness
        run: pnpm run performance:test

      - name: Lint
        run: pnpm exec nx run-many -t lint --all

      - name: Unit tests
        run: pnpm exec nx run-many -t test --exclude repository-api

      - name: Build the discovery UI
        run: pnpm exec nx build discovery-ui

  api:
    name: Repository API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Test
        run: docker build -f apps/repository-api/Dockerfile --target test .

      - name: Build the runtime image
        run: docker build -f apps/repository-api/Dockerfile --target runtime -t civics-repository-api:ci .
