# Continuous integration for the Civics Research Repository.
#
# Temporary branch-only OpenAPI handoff. The generated blobs are adopted into the branch and this
# workflow is restored immediately after their SHAs are captured.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gates:
    name: Workspace gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate cursor OpenAPI blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('schemas/openapi/repository-api.yaml')
          text = path.read_text()
          assert '  /search/cursor:' not in text

          cursor_path = """  /search/cursor:\n    get:\n      tags: [Search]\n      operationId: searchResearchObjectsWithCursor\n      summary: Continue public research discovery with an opaque cursor.\n      description: >-\n        Starts a deterministic traversal at logical page zero when cursor is omitted. Returned\n        cursors are opaque, signed navigation state bound to the active discovery projection,\n        effective query/filter set, page size, sort contract, and public search backend. A stale,\n        edited, or incompatible cursor is rejected instead of silently restarting with offsets.\n      parameters:\n        - $ref: '#/components/parameters/SearchQuery'\n        - $ref: '#/components/parameters/Program'\n        - $ref: '#/components/parameters/Publisher'\n        - $ref: '#/components/parameters/SourceSystemFilter'\n        - $ref: '#/components/parameters/Geography'\n        - $ref: '#/components/parameters/ContentType'\n        - $ref: '#/components/parameters/VintageYear'\n        - $ref: '#/components/parameters/Cursor'\n        - $ref: '#/components/parameters/PageSize'\n      responses:\n        '200':\n          description: One deterministic result page plus the opaque continuation for the next page.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/SearchCursorPage'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '500':\n          $ref: '#/components/responses/InternalServerError'\n        '503':\n          $ref: '#/components/responses/ServiceUnavailable'\n"""
          text = text.replace('  /research/{researchId}:\n', cursor_path + '  /research/{researchId}:\n', 1)

          cursor_parameter = """    Cursor:\n      name: cursor\n      in: query\n      required: false\n      description: >-\n        Opaque signed continuation returned by the previous cursor search page. The token must be\n        resent unchanged with the same effective discovery criteria and page size.\n      schema:\n        type: string\n        minLength: 1\n        maxLength: 8192\n        pattern: '^v1\\.[A-Za-z0-9_-]+\\.[0-9a-f]{64}$'\n"""
          text = text.replace('    ResearchId:\n', cursor_parameter + '    ResearchId:\n', 1)

          cursor_schema = """    SearchCursorPage:\n      type: object\n      required: [search, nextCursor]\n      properties:\n        search:\n          $ref: '#/components/schemas/SearchResponse'\n        nextCursor:\n          type: [string, 'null']\n          description: >-\n            Opaque signed continuation for the next logical page, or null when traversal is\n            exhausted. Clients must not decode, edit, or synthesize this value.\n"""
          text = text.replace('    SearchResult:\n', cursor_schema + '    SearchResult:\n', 1)
          path.write_text(text)
          PY

          pnpm exec prettier --write schemas/openapi/repository-api.yaml
          pnpm run openapi:lint
          pnpm run openapi:generate

          for file in schemas/openapi/repository-api.yaml libs/repository/api-client/src/generated/repository-api.types.ts; do
            encoded="$(base64 -w0 "$file")"
            sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" -f content="$encoded" -f encoding=base64 --jq .sha)"
            echo "GENERATED_BLOB_SHA:${file}:$sha"
          done
          exit 1

  api:
    name: Repository API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Test
        run: docker build -f apps/repository-api/Dockerfile --target test .

      - name: Build the runtime image
        run: docker build -f apps/repository-api/Dockerfile --target runtime -t civics-repository-api:ci .
