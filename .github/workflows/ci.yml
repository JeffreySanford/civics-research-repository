# Temporary formatting handoff for the cursor UI integration.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gates:
    name: Workspace gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture formatted cursor UI blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/discovery-ui-e2e/src/support/repository-api-mocks.ts')
          text = path.read_text()
          assert 'function searchCursorResponse(' not in text

          fixture_anchor = "  await page.route(`**/api/datasets/*`, async (route) => {"
          fixture_route = """  await page.route(`**/api/search/cursor**`, async (route) => {
            const url = new URL(route.request().url());
            await route.fulfill({
              contentType: 'application/json',
              json: searchCursorResponse(url, 'FIXTURE'),
            });
          });

"""
          text = text.replace(fixture_anchor, fixture_route + fixture_anchor, 1)

          detail_anchor = "  // The public detail route carries an opaque Base64URL token. Decode it back to the same\n"
          repository_route = """  await page.route(`**/api/search/cursor**`, async (route) => {
            const url = new URL(route.request().url());
            await route.fulfill({
              contentType: 'application/json',
              json: searchCursorResponse(url, 'REPOSITORY'),
            });
          });

"""
          text = text.replace(detail_anchor, repository_route + detail_anchor, 1)

          helper_anchor = "function searchResponse(\n"
          helper = """function searchCursorResponse(
            url: URL,
            resultSource: 'REPOSITORY' | 'FIXTURE',
          ): unknown {
            const query = url.searchParams.get('q') ?? '';
            const geography = url.searchParams.get('geography');
            const selectedGeography =
              geography || (query === 'Texas' ? 'Texas' : 'California');
            const pageSize = Number(url.searchParams.get('pageSize') ?? 25);
            const cursor = url.searchParams.get('cursor') ?? '';
            const parsedPage = cursor.startsWith('mock-cursor-')
              ? Number(cursor.slice('mock-cursor-'.length))
              : 0;
            const page = Number.isInteger(parsedPage) && parsedPage >= 0 ? parsedPage : 0;
            const search = searchResponse(
              selectedGeography,
              resultSource,
              url.searchParams.getAll('program'),
              url.searchParams.get('contentType') ?? '',
              page,
              pageSize,
              url.searchParams.get('vintageYear') ?? '',
            ) as { totalResults: number };
            const nextPage = page + 1;

            return {
              search,
              nextCursor:
                nextPage * pageSize < search.totalResults
                  ? `mock-cursor-${nextPage}`
                  : null,
            };
          }

"""
          text = text.replace(helper_anchor, helper + helper_anchor, 1)
          path.write_text(text)
          PY

          files=(
            apps/discovery-ui/src/app/pages/discovery-page.ts
            apps/discovery-ui/src/app/pages/discovery-page.html
            apps/discovery-ui/src/app/state/search/search.selectors.ts
            apps/discovery-ui/src/app/state/search/search.reducer.ts
            libs/repository/api-client/src/lib/repository-api-client.ts
            apps/discovery-ui-e2e/src/support/repository-api-mocks.ts
          )
          pnpm exec prettier --write "${files[@]}"

          for file in "${files[@]}"; do
            encoded="$(base64 -w0 "$file")"
            sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" -f content="$encoded" -f encoding=base64 --jq .sha)"
            echo "CURSOR_UI_BLOB_SHA:${file}:$sha"
          done
          exit 1

  api:
    name: Repository API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Test
        run: docker build -f apps/repository-api/Dockerfile --target test .

      - name: Build the runtime image
        run: docker build -f apps/repository-api/Dockerfile --target runtime -t civics-repository-api:ci .
