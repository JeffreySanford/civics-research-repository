name: Phase C formatting fix

on:
  push:
    branches: [feat/dspace-native-version-lineage]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/dspace-native-version-lineage
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Phase C files with repository Prettier
        run: >-
          pnpm exec prettier --write
          apps/discovery-ui/src/app/pages/dataset-detail-page.html
          apps/discovery-ui/src/app/pages/dataset-detail-page.stories.ts
          documentation/dspace-version-lineage.md
          tools/scripts/dspace-version-lineage.mjs

      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/discovery-ui/src/app/pages/dataset-detail-page.html \
            apps/discovery-ui/src/app/pages/dataset-detail-page.stories.ts \
            documentation/dspace-version-lineage.md \
            tools/scripts/dspace-version-lineage.mjs
          git commit -m "chore: format Phase C lineage files"
          git push origin HEAD:feat/dspace-native-version-lineage
