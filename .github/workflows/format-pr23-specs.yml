name: Format PR 23 chart specs

on:
  push:
    branches: [codex/layered-test-coverage-foundation]
    paths: [.github/workflows/format-pr23-specs.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/layered-test-coverage-foundation
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format chart specs
        run: |
          pnpm exec prettier --write \
            apps/discovery-ui/src/app/pages/admin-viz/bar-chart.component.spec.ts \
            apps/discovery-ui/src/app/pages/admin-viz/donut-chart.component.spec.ts
          pnpm exec prettier --check \
            apps/discovery-ui/src/app/pages/admin-viz/bar-chart.component.spec.ts \
            apps/discovery-ui/src/app/pages/admin-viz/donut-chart.component.spec.ts

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jeffrey Sanford'
          git config user.email 'jeffrey_sanford@hotmail.com'
          git add \
            apps/discovery-ui/src/app/pages/admin-viz/bar-chart.component.spec.ts \
            apps/discovery-ui/src/app/pages/admin-viz/donut-chart.component.spec.ts
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'style: format chart accessibility specs'
          git push origin HEAD:codex/layered-test-coverage-foundation
