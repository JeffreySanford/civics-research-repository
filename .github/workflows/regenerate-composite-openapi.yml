name: Regenerate composite OpenAPI

on:
  push:
    branches: [codex/composite-corpus-admin-evidence]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch canonical contract
        run: node tools/scripts/patch-openapi-composite-corpus.mjs

      - name: Regenerate TypeScript contract
        run: pnpm run openapi:generate

      - name: Commit canonical contract and generated types
        shell: bash
        run: |
          if git diff --quiet -- schemas/openapi/repository-api.yaml libs/repository/api-client/src/generated/repository-api.types.ts; then
            echo "Composite corpus OpenAPI artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/openapi/repository-api.yaml libs/repository/api-client/src/generated/repository-api.types.ts
          git commit -m "chore: regenerate composite corpus OpenAPI"
          git push origin HEAD:codex/composite-corpus-admin-evidence
