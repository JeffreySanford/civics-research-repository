name: Native Timing Patch v2

on:
  push:
    branches: [codex/opensearch-comparison-demo]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry native timing patch workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/opensearch-comparison-demo
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract and safely retry native timing patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python3 - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/native-timing-patch.yml > /tmp/native-timing-patch.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/native-timing-patch.py')
          text = path.read_text()
          old = """              if count != 1:\n                  raise SystemExit(f'{path}: expected one literal match, found {count}')\n              p.write_text(text.replace(old, new))\n"""
          new = """              if count != 1:\n                  targeted_completed_result = (\n                      path.endswith('SearchComparisonService.java')\n                      and old.startswith('        indexedCount.ifPresent(comparison::indexedDocumentCount);')\n                      and count == 2\n                  )\n                  if targeted_completed_result:\n                      p.write_text(text.replace(old, new, 1))\n                      return\n                  raise SystemExit(f'{path}: expected one literal match, found {count}')\n              p.write_text(text.replace(old, new))\n"""
          if text.count(old) != 1:
              raise SystemExit('Could not locate replace_once safety block in extracted patch script.')
          path.write_text(text.replace(old, new))
          PY

          python3 /tmp/native-timing-patch.py

      - name: Regenerate typed OpenAPI client
        run: pnpm run openapi:generate

      - name: Format touched workspace files
        run: >-
          pnpm exec prettier --write
          schemas/openapi/repository-api.yaml
          libs/repository/api-client/src/generated/repository-api.types.ts
          apps/discovery-ui/src/app/pages/search-lab-page.html
          apps/discovery-ui/src/app/pages/search-lab-page.spec.ts
          apps/discovery-ui-e2e/src/search-comparison-real-stack.spec.ts
          tools/scripts/search-comparison-benchmark.mjs
          tools/scripts/search-comparison-benchmark.test.mjs

      - name: Validate benchmark and API contract
        run: |
          node --test tools/scripts/search-comparison-benchmark.test.mjs
          pnpm run openapi:lint
          pnpm run openapi:check

      - name: Run Search Lab unit tests
        run: pnpm exec nx test discovery-ui

      - name: Run Repository API tests
        run: docker build -f apps/repository-api/Dockerfile --target test .

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated native timing slice
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/native-timing-patch.yml .github/workflows/native-timing-patch-v2.yml
          git config user.name 'Jeffrey Sanford'
          git config user.email 'jeffrey_sanford@hotmail.com'
          git add \
            apps/repository-api/src/main/java/org/civicsrepo/search \
            apps/repository-api/src/test/java/org/civicsrepo/search \
            schemas/openapi/repository-api.yaml \
            libs/repository/api-client/src/generated/repository-api.types.ts \
            apps/discovery-ui/src/app/pages/search-lab-page.html \
            apps/discovery-ui/src/app/pages/search-lab-page.spec.ts \
            apps/discovery-ui-e2e/src/search-comparison-real-stack.spec.ts \
            tools/scripts/search-comparison-benchmark.mjs \
            tools/scripts/search-comparison-benchmark.test.mjs
          git commit -m 'Add same-response engine timing evidence'
          git push origin HEAD:codex/opensearch-comparison-demo
