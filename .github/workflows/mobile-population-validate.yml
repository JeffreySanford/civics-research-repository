name: Mobile population context validation

on:
  push:
    branches:
      - feat/mobile-community-population

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize feature files
        run: |
          pnpm exec prettier --write \
            apps/census-mobile-frontend-e2e/src/research-map-preview.spec.ts \
            apps/census-mobile-frontend/src/app/mobile-research-map/mobile-research-map-preview.component.html \
            apps/census-mobile-frontend/src/app/mobile-research-map/mobile-research-map-preview.component.spec.ts \
            apps/census-mobile-frontend/src/app/mobile-research-map/mobile-research-map-preview.component.ts
          if ! git diff --quiet -- \
            apps/census-mobile-frontend-e2e/src/research-map-preview.spec.ts \
            apps/census-mobile-frontend/src/app/mobile-research-map/mobile-research-map-preview.component.html \
            apps/census-mobile-frontend/src/app/mobile-research-map/mobile-research-map-preview.component.spec.ts \
            apps/census-mobile-frontend/src/app/mobile-research-map/mobile-research-map-preview.component.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/census-mobile-frontend-e2e/src/research-map-preview.spec.ts \
              apps/census-mobile-frontend/src/app/mobile-research-map/mobile-research-map-preview.component.html \
              apps/census-mobile-frontend/src/app/mobile-research-map/mobile-research-map-preview.component.spec.ts \
              apps/census-mobile-frontend/src/app/mobile-research-map/mobile-research-map-preview.component.ts
            git commit -m "style: normalize mobile population context"
            git push origin HEAD:feat/mobile-community-population
          fi
      - run: pnpm exec nx format:check --all
      - run: pnpm exec nx run census-mobile-frontend:lint
      - run: pnpm exec nx run census-mobile-frontend-e2e:lint
      - run: pnpm exec nx run census-mobile-frontend:test
      - run: pnpm exec nx run census-mobile-frontend:build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run focused mobile population evidence
        run: pnpm exec playwright test --config=apps/census-mobile-frontend-e2e/playwright.config.mts apps/census-mobile-frontend-e2e/src/research-map-preview.spec.ts --project=chromium-320 --reporter=line
