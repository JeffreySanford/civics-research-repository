name: Stabilize CBP branch

on:
  push:
    branches: [codex/maps-county-business-patterns]

concurrency:
  group: cbp-ui-bootstrap
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/maps-county-business-patterns

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize repository formatting
        run: |
          pnpm exec nx format:write --all
          pnpm exec nx format:check --all

      - name: Validate discovery UI
        run: |
          pnpm run test
          pnpm run build

      - name: Commit formatter output when needed
        run: |
          if git diff --quiet; then
            echo "Repository formatting already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(maps): format County Business Patterns slice"
          git push origin HEAD:codex/maps-county-business-patterns
