name: One-shot format mobile selection docs

on:
  push:
    branches:
      - feat/mobile-map-selection-sync

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.14.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize mobile planning docs
        run: pnpm exec prettier --write mobile-first/README.md mobile-first/planning/backlog.md
      - name: Verify formatting
        run: pnpm exec prettier --check mobile-first/README.md mobile-first/planning/backlog.md
      - name: Commit normalized docs and remove formatter
        run: |
          rm .github/workflows/one-shot-format-mobile-selection-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-first/README.md mobile-first/planning/backlog.md .github/workflows/one-shot-format-mobile-selection-docs.yml
          git commit -m "style: normalize mobile selection planning docs"
          git push origin HEAD:feat/mobile-map-selection-sync
