name: Metadata Fixture Regenerate

on:
  push:
    branches:
      - feat/open-census-metadata-profile
    paths:
      - '.github/workflows/metadata-fixture-regenerate.yml'
      - 'tools/scripts/generate-saf.mjs'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/open-census-metadata-profile
          persist-credentials: false

      - name: Regenerate fixture catalog from authority catalog
        run: node tools/scripts/generate-saf.mjs

      - name: Upload regenerated fixture catalog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metadata-fixture-${{ github.run_id }}
          path: apps/repository-api/src/main/resources/discovery-fixture-catalog.json
          if-no-files-found: error
