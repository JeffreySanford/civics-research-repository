name: PI-1 Format

on:
  push:
    branches:
      - codex/federated-metadata-catalog

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format PI-1 files
        run: >-
          pnpm exec prettier --write
          apps/discovery-ui/src/app/pages/discovery-page.html
          apps/discovery-ui/src/app/pages/discovery-page.ts
          planning/PI1_F1_MERGE_GATE.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/discovery-ui/src/app/pages/discovery-page.html apps/discovery-ui/src/app/pages/discovery-page.ts planning/PI1_F1_MERGE_GATE.md
          git commit -m "Format PI-1 discovery slice"
          git push
