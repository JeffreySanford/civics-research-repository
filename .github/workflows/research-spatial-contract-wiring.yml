name: Research spatial contract wiring

on:
  push:
    branches: [codex/bounded-research-spatial-api]

permissions:
  contents: write

jobs:
  wire-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch bounded spatial contract
        run: node tools/scripts/patch-openapi-research-spatial-coverage.mjs

      - name: Format OpenAPI contract
        run: pnpm exec prettier --write schemas/openapi/repository-api.yaml

      - name: Lint OpenAPI contract
        run: pnpm run openapi:lint

      - name: Generate TypeScript API contract
        run: pnpm run openapi:generate

      - name: Commit generated contract artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/openapi/repository-api.yaml libs/repository/api-client/src/generated/repository-api.types.ts
          if git diff --cached --quiet; then
            echo "No contract changes to commit."
            exit 0
          fi
          git commit -m "chore: generate bounded spatial API contract [skip ci]"
          git push origin HEAD:codex/bounded-research-spatial-api
