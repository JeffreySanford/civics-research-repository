name: PI-1 Taxonomy Contract Sync

on:
  push:
    branches: [codex/federated-metadata-catalog]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/federated-metadata-catalog

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Evolve discovery program contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('schemas/openapi/repository-api.yaml')
          text = path.read_text()

          old_program_parameter = """    Program:\n      name: program\n      in: query\n      description: >-\n        Repeatable. Repeat the parameter to select several programs; results match any of them.\n        Omitting it searches every program.\n      explode: true\n      style: form\n      schema:\n        type: array\n        items:\n          $ref: '#/components/schemas/ResearchProgram'\n"""
          new_program_parameter = """    Program:\n      name: program\n      in: query\n      description: >-\n        Repeatable data-driven program name. Repeat the parameter to select several programs;\n        results match any of them. Omitting it searches every program. Values come from indexed\n        metadata and are not restricted to the curated ResearchProgram enum.\n      explode: true\n      style: form\n      schema:\n        type: array\n        items:\n          type: string\n          minLength: 1\n          maxLength: 200\n"""
          assert old_program_parameter in text, 'Program parameter block changed unexpectedly'
          text = text.replace(old_program_parameter, new_program_parameter, 1)

          search_marker = "    SearchResult:\n"
          facet_marker = "    FacetGroup:\n"
          before, rest = text.split(search_marker, 1)
          search_block, after = rest.split(facet_marker, 1)
          old = """        program:\n          $ref: '#/components/schemas/ResearchProgram'\n        publisher:\n"""
          new = """        program:\n          $ref: '#/components/schemas/ResearchProgram'\n          description: Legacy curated classification; federated records may use OTHER.\n        programName:\n          type: string\n          description: Data-driven source program name used for display, filtering, and facets.\n        publisher:\n"""
          assert old in search_block, 'SearchResult program block changed unexpectedly'
          search_block = search_block.replace(old, new, 1)
          text = before + search_marker + search_block + facet_marker + after

          comparison_marker = "    SearchComparisonRequest:\n"
          projection_marker = "    SearchComparisonProjection:\n"
          before, rest = text.split(comparison_marker, 1)
          comparison_block, after = rest.split(projection_marker, 1)
          old = """        programs:\n          type: array\n          items:\n            $ref: '#/components/schemas/ResearchProgram'\n"""
          new = """        programs:\n          type: array\n          items:\n            type: string\n            minLength: 1\n            maxLength: 200\n"""
          assert old in comparison_block, 'SearchComparisonRequest programs block changed unexpectedly'
          comparison_block = comparison_block.replace(old, new, 1)
          text = before + comparison_marker + comparison_block + projection_marker + after

          detail_marker = "    ResearchObjectDetail:\n"
          file_marker = "    DatasetFile:\n"
          before, rest = text.split(detail_marker, 1)
          detail_block, after = rest.split(file_marker, 1)
          old = """        program:\n          $ref: '#/components/schemas/ResearchProgram'\n        publisher:\n"""
          new = """        program:\n          $ref: '#/components/schemas/ResearchProgram'\n          description: Legacy curated classification; federated records may use OTHER.\n        programName:\n          type: string\n          description: Data-driven source program name used for display and provenance.\n        publisher:\n"""
          assert old in detail_block, 'ResearchObjectDetail program block changed unexpectedly'
          detail_block = detail_block.replace(old, new, 1)
          text = before + detail_marker + detail_block + file_marker + after

          path.write_text(text)
          PY
          pnpm exec prettier --write schemas/openapi/repository-api.yaml
          pnpm run openapi:generate

      - name: Commit generated taxonomy contract artifacts
        run: |
          if git diff --quiet -- schemas/openapi/repository-api.yaml libs/repository/api-client/src/generated/repository-api.types.ts; then
            echo "Taxonomy contract artifacts are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/openapi/repository-api.yaml libs/repository/api-client/src/generated/repository-api.types.ts
          git commit -m "Make discovery program taxonomy data-driven"
          git push origin HEAD:codex/federated-metadata-catalog
