name: Mobile-first PR4 Nx format

on:
  push:
    branches:
      - codex/mobile-first-census-pr4-search-vertical-slice
    paths:
      - .github/workflows/mobile-first-pr4-nx-format.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/mobile-first-census-pr4-search-vertical-slice
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Angular template with Nx
        run: pnpm exec nx format:write --files=apps/census-mobile-frontend/src/app/pages/search-page/search-page.component.html
      - name: Commit formatting and remove one-shot workflow
        run: |
          rm .github/workflows/mobile-first-pr4-nx-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize mobile search template with Nx"
          git push origin HEAD:codex/mobile-first-census-pr4-search-vertical-slice
