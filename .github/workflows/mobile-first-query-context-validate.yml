name: Mobile-first query context validation

on:
  push:
    branches:
      - codex/mobile-first-census-pr4-pagination-ranking
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/mobile-first-census-pr4-pagination-ranking
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed mobile files
        run: >-
          pnpm exec prettier --write
          apps/census-mobile-frontend/src/app/app.ts
          apps/census-mobile-frontend/src/app/app.html
          apps/census-mobile-frontend/src/app/app.scss
          apps/census-mobile-frontend/src/app/app.spec.ts
      - name: Lint mobile frontend
        run: pnpm nx run census-mobile-frontend:lint
      - name: Test mobile frontend
        run: pnpm nx run census-mobile-frontend:test
      - name: Build mobile frontend
        run: pnpm nx run census-mobile-frontend:build
      - name: Remove one-shot validator
        run: rm .github/workflows/mobile-first-query-context-validate.yml
      - name: Commit canonical formatting and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/census-mobile-frontend/src/app/app.ts \
                  apps/census-mobile-frontend/src/app/app.html \
                  apps/census-mobile-frontend/src/app/app.scss \
                  apps/census-mobile-frontend/src/app/app.spec.ts \
                  .github/workflows/mobile-first-query-context-validate.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: validate mobile query context"
          git push origin HEAD:codex/mobile-first-census-pr4-pagination-ranking
