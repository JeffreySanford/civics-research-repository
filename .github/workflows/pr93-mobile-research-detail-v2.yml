name: PR93 mobile research detail v2

on:
  push:
    branches:
      - codex/mobile-research-detail-pr93
    paths:
      - .github/workflows/pr93-mobile-research-detail-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/mobile-research-detail-pr93
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.14.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply mobile detail slice
        run: |
          python3 tools/scripts/pr93_mobile_detail.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/census-mobile-frontend/src/app/app.html')
          text = p.read_text().replace(
              '  } @else {\n  <router-outlet></router-outlet>\n  }\n</main>',
              '  }\n  <router-outlet></router-outlet>\n</main>',
          )
          p.write_text(text)
          PY
      - run: pnpm exec prettier --write apps/census-mobile-frontend/src/app apps/census-mobile-frontend-e2e/src/research-detail.spec.ts apps/discovery-ui/src/app/research-id.ts libs/repository/models/src mobile-first/planning/mobile-research-detail-navigation.md
      - run: pnpm nx run-many -t lint -p census-mobile-frontend,repository-models
      - run: pnpm nx run-many -t test -p census-mobile-frontend,repository-models
      - run: pnpm nx build census-mobile-frontend --configuration=production
      - run: pnpm nx build-storybook census-mobile-frontend --configuration=ci
      - run: pnpm exec playwright install --with-deps chromium
      - name: Mobile 320px Playwright and axe
        run: pnpm nx e2e census-mobile-frontend-e2e -- --project=chromium-320
      - name: Commit validated slice
        run: |
          rm tools/scripts/pr93_mobile_detail.py
          rm .github/workflows/pr93-mobile-research-detail.yml
          rm .github/workflows/pr93-mobile-research-detail-v2.yml
          git config user.name "JeffreySanford"
          git config user.email "JeffreySanford@users.noreply.github.com"
          git add -A
          git commit -m "feat: add mobile research detail navigation"
          git push origin HEAD:codex/mobile-research-detail-pr93
