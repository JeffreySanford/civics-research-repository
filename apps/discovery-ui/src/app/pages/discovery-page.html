<section aria-labelledby="search-heading" class="search-panel">
  <div>
    <p class="eyebrow">Discovery</p>
    <h2 id="search-heading">Find research objects</h2>
    <p>
      Initial search will focus on TIGER/Line, LODES, ACS PUMS, SIPP, CPS, and
      USGS overlay metadata.
    </p>
  </div>

  <form class="search-form" role="search" aria-label="Repository search">
    <label for="repository-search">Search terms</label>
    <div class="search-row">
      <input
        id="repository-search"
        name="repository-search"
        type="search"
        autocomplete="off"
        placeholder="North Dakota Census tracts"
      />
      <button type="submit">Search</button>
    </div>
  </form>
</section>
