server:
  port: 8080
  servlet:
    context-path: /api

civics:
  sync:
    startup-enabled: true
    cli-enabled: false
    mode: DRY_RUN
    source: TIGER_LINE
  dspace:
    base-url: ${CIVICS_DSPACE_BASE_URL:http://dspace-rest:8080/server}
    # No default credentials. Blank credentials disable DSpace writes instead of failing the sync
    # job, so a misconfigured environment degrades to diff-only rather than authenticating as some
    # value baked into the image. Supply these through .env / Docker Compose.
    admin-email: ${CIVICS_DSPACE_ADMIN_EMAIL:}
    admin-password: ${CIVICS_DSPACE_ADMIN_PASSWORD:}
  solr:
    base-url: http://solr:8983/solr
    core: discovery
  storage:
    artifacts-path: /var/lib/civics/artifacts
