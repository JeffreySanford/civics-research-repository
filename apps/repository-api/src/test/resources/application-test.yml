# Context-test profile: an in-memory datasource, and every outbound integration switched off so a
# context load never reaches DSpace, Solr, OpenSearch, or PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:civics;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver

civics:
  sync:
    startup-enabled: false
    cli-enabled: false
    mode: DRY_RUN
    source: TIGER_LINE
  dspace:
    base-url: ''
    admin-email: ''
    admin-password: ''
  solr:
    base-url: ''
    core: discovery
  opensearch:
    base-url: ''
    index: discovery-comparison
  storage:
    artifacts-path: /tmp/civics-artifacts
