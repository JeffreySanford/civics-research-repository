openapi: 3.1.0
info:
  title: Civics Research Repository API
  version: 0.1.0
  description: Typed backend API contract for public research discovery, datasets, map overlays, and accessibility evidence.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.civics-research-repository.local/api
    description: Local development API host alias
security: []
tags:
  - name: Search
    description: Research object search and faceted discovery.
  - name: Datasets
    description: Dataset detail, files, versions, citations, and relationships.
  - name: Maps
    description: Dataset map layers and USGS overlays.
  - name: Evidence
    description: WCAG and Section 508 evidence summaries.
  - name: Admin
    description: Administrative sync and repository maintenance workflows.
paths:
  /search:
    get:
      tags: [Search]
      operationId: searchResearchObjects
      summary: Search public research objects.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Program'
        - $ref: '#/components/parameters/Geography'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/VintageYear'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Search results and facets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /search/comparison/scenarios:
    get:
      tags: [Search]
      operationId: listSearchComparisonScenarios
      summary: List supported Solr/OpenSearch comparison scenarios.
      responses:
        '200':
          description: Supported comparison scenarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchComparisonScenario'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /search/comparison/run:
    post:
      tags: [Search]
      operationId: runSearchComparison
      summary: Run one normalized discovery query against Solr and OpenSearch.
      description: >-
        Both engines query projections built from the same normalized DSpace research-object set.
        Elapsed timings are local demo measurements and must not be presented as production
        benchmarks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchComparisonRequest'
      responses:
        '200':
          description: Side-by-side engine results and projection parity evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchComparisonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /datasets/{datasetId}:
    get:
      tags: [Datasets]
      operationId: getDataset
      summary: Get a dataset research object.
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: Dataset detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchObjectDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /datasets/{datasetId}/versions:
    get:
      tags: [Datasets]
      operationId: getDatasetVersions
      summary: Get dataset version history.
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: Dataset versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /datasets/{datasetId}/map-layers:
    get:
      tags: [Maps]
      operationId: getDatasetMapLayers
      summary: Get map layers available for a dataset.
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: Map layer configuration.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MapLayer'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /maps/census-areas:
    get:
      tags: [Maps]
      operationId: listCensusAreaBoundaries
      summary: List selectable Census area map boundaries.
      responses:
        '200':
          description: Census area boundary summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CensusAreaBoundary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /overlays/census/lodes-flow:
    get:
      tags: [Maps]
      operationId: getLodesFlowOverlay
      summary: Get a small LEHD LODES origin-destination flow sample for a Census area.
      parameters:
        - $ref: '#/components/parameters/Geography'
      responses:
        '200':
          description: LODES workplace flow GeoJSON overlay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LodesFlowOverlay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /overlays/census/lodes-workplace:
    get:
      tags: [Maps]
      operationId: getLodesWorkplaceOverlay
      summary: Get LEHD LODES workplace employment by county for a Census area.
      description: >-
        Jobs counted at the workplace, aggregated from the published Workplace Area Characteristics
        file. Answers "where are the jobs", which the origin-destination flows do not: a commuting
        line says who travels, not how much work is at either end.
      parameters:
        - $ref: '#/components/parameters/Geography'
      responses:
        '200':
          description: LODES workplace employment overlay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LodesWorkplaceOverlay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /overlays/census/saipe-counties:
    get:
      tags: [Maps]
      operationId: getSaipeCountyChoropleth
      summary: Get SAIPE county poverty choropleth GeoJSON and accessible county values.
      parameters:
        - $ref: '#/components/parameters/Geography'
      responses:
        '200':
          description: SAIPE county choropleth overlay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaipeCountyChoropleth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /overlays/usgs/earthquakes:
    get:
      tags: [Maps]
      operationId: getUsgsEarthquakeOverlay
      summary: Get USGS earthquake overlay features.
      parameters:
        - name: minMagnitude
          in: query
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 10
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 7
      responses:
        '200':
          description: Earthquake overlay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsgsEarthquakeOverlay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /overlays/usgs/hydrography/export:
    get:
      tags: [Maps]
      operationId: getUsgsHydrographyTileExport
      summary: Proxy USGS 3DHP hydrography raster tile export.
      description: >-
        Fetches ArcGIS MapServer `/export` tiles from The National Map on the server so the
        discovery UI can load hydrography without cross-origin browser requests.
      parameters:
        - name: bbox
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated west,south,east,north in EPSG:3857 (Web Mercator).
        - name: bboxSR
          in: query
          schema:
            type: integer
            default: 3857
        - name: imageSR
          in: query
          schema:
            type: integer
            default: 3857
        - name: size
          in: query
          schema:
            type: string
            default: '256,256'
        - name: f
          in: query
          schema:
            type: string
            default: image
        - name: transparent
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Hydrography raster tile PNG.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /accessibility/evidence:
    get:
      tags: [Evidence]
      operationId: getAccessibilityEvidence
      summary: Get accessibility evidence summaries.
      responses:
        '200':
          description: Accessibility evidence entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessibilityEvidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/sync:
    get:
      tags: [Admin]
      operationId: listRepositorySyncJobs
      summary: List recent repository metadata sync jobs.
      responses:
        '200':
          description: Recent sync jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyncJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Admin]
      operationId: startRepositorySync
      summary: Start a repository metadata sync.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '202':
          description: Sync job accepted and completed or queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/sync/{syncJobId}:
    get:
      tags: [Admin]
      operationId: getRepositorySyncJob
      summary: Get repository sync job status.
      parameters:
        - $ref: '#/components/parameters/SyncJobId'
      responses:
        '200':
          description: Sync job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/reindex:
    get:
      tags: [Admin]
      operationId: getDiscoveryProjectionState
      summary: Get the current discovery projection state without rebuilding it.
      responses:
        '200':
          description: Discovery projection metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryProjectionState'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Admin]
      operationId: reindexDiscoveryProjection
      summary: Rebuild the discovery Solr projection from DSpace.
      responses:
        '202':
          description: Reindex accepted and completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryProjectionState'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/dspace/overview:
    get:
      tags: [Admin]
      operationId: getDspaceOverview
      summary: DSpace repository container overview and live stats.
      responses:
        '200':
          description: DSpace overview with live counts when the REST API is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DspaceOverview'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/repository/identity:
    get:
      tags: [Admin]
      operationId: getRepositoryIdentitySummary
      summary: Report how many research objects have a recorded repository identity.
      description: >-
        A source identifier is only an identity once something records what it became. This reports
        how far that chain reaches: identifiers known, DSpace UUIDs recorded, and objects the
        discovery projection has stamped.
      responses:
        '200':
          description: Repository identity summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryIdentitySummary'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/sources/inventory:
    get:
      tags: [Admin]
      operationId: getSourceInventory
      summary: How much source data the repository is subscribed to, as last measured.
      description: >-
        Aggregate size of the publisher files every research object points at, measured by asking
        each host for the file length. Sizes change when an agency reissues a file, so the response
        carries the date it was taken rather than implying it is live.
      responses:
        '200':
          description: Source inventory totals and per-program breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceInventory'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/solr/overview:
    get:
      tags: [Admin]
      operationId: getSolrOverview
      summary: Discovery Solr projection overview and live stats.
      responses:
        '200':
          description: Solr overview with indexed document counts when the discovery core is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolrOverview'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    SearchQuery:
      name: q
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: Keyword search terms.
    Program:
      name: program
      in: query
      description: >-
        Repeatable. Repeat the parameter to select several programs; results match any of them.
        Omitting it searches every program.
      explode: true
      style: form
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ResearchProgram'
    Geography:
      name: geography
      in: query
      schema:
        type: string
        maxLength: 80
    ContentType:
      name: contentType
      in: query
      description: Restrict results to one research object type.
      schema:
        $ref: '#/components/schemas/ResearchObjectType'
    VintageYear:
      name: vintageYear
      in: query
      schema:
        type: integer
        minimum: 1900
        maximum: 2100
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]+$'
    SyncJobId:
      name: syncJobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RepositorySource:
      type: string
      description: >-
        Where the response data came from. REPOSITORY means DSpace is the source of record for
        these records. FIXTURE means DSpace was unavailable or empty and the response is generated
        placeholder content, which must never be presented to a user as repository data.
      enum: [REPOSITORY, FIXTURE]
    SearchResponse:
      type: object
      required:
        [query, page, pageSize, totalResults, results, facets, resultSource]
      properties:
        resultSource:
          $ref: '#/components/schemas/RepositorySource'
        query:
          type: string
        page:
          type: integer
        pageSize:
          type: integer
        totalResults:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        facets:
          type: array
          items:
            $ref: '#/components/schemas/FacetGroup'
    SearchResult:
      type: object
      required: [id, title, contentType, program, publisher, summary, sourceUrl]
      properties:
        id:
          type: string
        title:
          type: string
        contentType:
          $ref: '#/components/schemas/ResearchObjectType'
        program:
          $ref: '#/components/schemas/ResearchProgram'
        publisher:
          type: string
        summary:
          type: string
        geography:
          type: string
        vintageYear:
          type: integer
        sourceUrl:
          type: string
          format: uri
        accessLevel:
          $ref: '#/components/schemas/AccessLevel'
    FacetGroup:
      type: object
      required: [field, label, values]
      properties:
        field:
          type: string
        label:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
    FacetValue:
      type: object
      required: [value, label, count, selected]
      properties:
        value:
          type: string
        label:
          type: string
        count:
          type: integer
        selected:
          type: boolean
    SearchComparisonScenarioId:
      type: string
      enum: [FACETED_SEARCH, FULL_TEXT_RELEVANCE, FILTERING]
    SearchComparisonScenario:
      type: object
      required: [id, label, description]
      properties:
        id:
          $ref: '#/components/schemas/SearchComparisonScenarioId'
        label:
          type: string
        description:
          type: string
    SearchComparisonRequest:
      type: object
      required: [scenario]
      properties:
        scenario:
          $ref: '#/components/schemas/SearchComparisonScenarioId'
        query:
          type: string
          default: ''
        programs:
          type: array
          items:
            $ref: '#/components/schemas/ResearchProgram'
        geography:
          type: string
        contentType:
          $ref: '#/components/schemas/ResearchObjectType'
        vintageYear:
          type: integer
          format: int32
        page:
          type: integer
          minimum: 0
          default: 0
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    SearchComparisonProjection:
      type: object
      required: [source, objectCount]
      properties:
        projectionId:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 identity of the normalized DiscoveryDocument set supplied to the targets.
        source:
          $ref: '#/components/schemas/RepositorySource'
        objectCount:
          type: integer
          minimum: 0
        rebuiltAt:
          type: string
          format: date-time
    SearchComparisonEngine:
      type: string
      enum: [SOLR, OPENSEARCH]
    SearchEngineComparison:
      type: object
      required: [engine, enabled, reachable, indexName, elapsedMs, returnedHits, results, facets]
      properties:
        engine:
          $ref: '#/components/schemas/SearchComparisonEngine'
        enabled:
          type: boolean
        reachable:
          type: boolean
        indexName:
          type: string
        indexedDocumentCount:
          type: integer
          minimum: 0
        elapsedMs:
          type: integer
          format: int64
          minimum: 0
          description: Local API elapsed time around the engine request, not a production benchmark.
        totalHits:
          type: integer
          minimum: 0
        returnedHits:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        facets:
          type: array
          items:
            $ref: '#/components/schemas/FacetGroup'
        warning:
          type: string
    SearchComparisonResponse:
      type: object
      required: [scenario, projection, sameProjection, solr, openSearch]
      properties:
        scenario:
          $ref: '#/components/schemas/SearchComparisonScenarioId'
        projection:
          $ref: '#/components/schemas/SearchComparisonProjection'
        sameProjection:
          type: boolean
          description: True only when both enabled targets successfully received the current normalized projection and their document counts match it.
        solr:
          $ref: '#/components/schemas/SearchEngineComparison'
        openSearch:
          $ref: '#/components/schemas/SearchEngineComparison'
    ResearchObjectDetail:
      type: object
      required:
        [
          id,
          title,
          program,
          publisher,
          abstractText,
          files,
          citation,
          sourceUrl,
          relatedResearch,
          source,
        ]
      properties:
        source:
          $ref: '#/components/schemas/RepositorySource'
        id:
          type: string
        title:
          type: string
        program:
          $ref: '#/components/schemas/ResearchProgram'
        publisher:
          type: string
        abstractText:
          type: string
        geography:
          type: string
        vintageYear:
          type: integer
        releasedOn:
          type: string
          format: date
        files:
          type: array
          items:
            $ref: '#/components/schemas/DatasetFile'
        citation:
          type: string
        sourceUrl:
          type: string
          format: uri
        accessibilityEvidenceStatus:
          $ref: '#/components/schemas/EvidenceStatus'
        relatedResearch:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        contentType:
          $ref: '#/components/schemas/ResearchObjectType'
        accessLevel:
          $ref: '#/components/schemas/AccessLevel'
        accessNote:
          type: string
          description: How a researcher legitimately obtains a restricted object.
        license:
          type: string
        doi:
          type: string
        authors:
          type: array
          items:
            $ref: '#/components/schemas/ResearchAuthor'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/ResearchRelation'
    DatasetFile:
      type: object
      required: [id, label, format, url]
      properties:
        id:
          type: string
        label:
          type: string
        format:
          $ref: '#/components/schemas/FileFormat'
        url:
          type: string
          format: uri
        sizeBytes:
          # int64: a repository file can exceed 2 GB, and int32 would silently cap it.
          type: integer
          format: int64
    DatasetVersion:
      type: object
      required: [id, label, current]
      properties:
        id:
          type: string
        label:
          type: string
        releasedOn:
          type: string
          format: date
        current:
          type: boolean
    MapLayer:
      type: object
      required: [id, label, layerType, sourceUrl, attribution]
      properties:
        id:
          type: string
        label:
          type: string
        layerType:
          $ref: '#/components/schemas/MapLayerType'
        sourceUrl:
          type: string
          format: uri
        attribution:
          type: string
        visibleByDefault:
          type: boolean
          default: false
        rasterTileUrlTemplate:
          type: string
          description: >-
            Optional MapLibre raster tile URL template for reference overlays.
            Use `{bbox-epsg-3857}` for dynamic ArcGIS MapServer `/export` endpoints
            when no cached `/tile/{z}/{y}/{x}` service exists. Hydrography templates
            are served through `/overlays/usgs/hydrography/export` on this API.
    CensusAreaBoundary:
      type: object
      required:
        [
          id,
          label,
          geography,
          west,
          south,
          east,
          north,
          centerLatitude,
          centerLongitude,
          defaultZoom,
        ]
      properties:
        id:
          type: string
        label:
          type: string
        geography:
          type: string
        west:
          type: number
          format: double
        south:
          type: number
          format: double
        east:
          type: number
          format: double
        north:
          type: number
          format: double
        centerLatitude:
          type: number
          format: double
        centerLongitude:
          type: number
          format: double
        defaultZoom:
          type: number
          format: double
    UsgsEarthquakeOverlay:
      type: object
      required:
        - source
        - sourceUrl
        - attribution
        - updatedAt
        - staleAfter
        - fallback
        - query
        - features
      properties:
        source:
          type: string
        sourceUrl:
          type: string
          format: uri
        attribution:
          type: string
        updatedAt:
          type: string
          format: date-time
        staleAfter:
          type: string
          format: date-time
        fallback:
          type: boolean
        query:
          $ref: '#/components/schemas/UsgsEarthquakeQuery'
        features:
          type: array
          items:
            $ref: '#/components/schemas/UsgsEarthquakeFeature'
    UsgsEarthquakeQuery:
      type: object
      required:
        - minMagnitude
        - days
        - minLatitude
        - maxLatitude
        - minLongitude
        - maxLongitude
      properties:
        minMagnitude:
          type: number
          format: double
        days:
          type: integer
          format: int32
        minLatitude:
          type: number
          format: double
        maxLatitude:
          type: number
          format: double
        minLongitude:
          type: number
          format: double
        maxLongitude:
          type: number
          format: double
    UsgsEarthquakeFeature:
      type: object
      required: [id, place, magnitude, occurredAt, latitude, longitude]
      properties:
        id:
          type: string
        place:
          type: string
        magnitude:
          type: number
          format: double
        occurredAt:
          type: string
          format: date-time
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    AccessibilityEvidence:
      type: object
      required: [id, workflow, status, standard, capturedAt]
      properties:
        id:
          type: string
        workflow:
          type: string
        status:
          $ref: '#/components/schemas/EvidenceStatus'
        standard:
          type: string
          enum: [WCAG_2_1_AA, WCAG_2_2_AA, SECTION_508]
        capturedAt:
          type: string
          format: date-time
        notes:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable summary safe to show in UI.
        details:
          type: array
          items:
            type: string
          description: Optional validation or diagnostic detail lines.
        traceId:
          type: string
          description: Correlation id for logs and support, echoed from X-Trace-Id when supplied.
    DiscoveryProjectionState:
      type: object
      required: [source, objectCount]
      properties:
        source:
          $ref: '#/components/schemas/RepositorySource'
        objectCount:
          type: integer
          minimum: 0
        projectionId:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 identity of the normalized document set used for the latest rebuild.
        rebuiltAt:
          type: string
          format: date-time
          description: When the projection was last rebuilt; absent before the first reindex.
    DspaceContainerSummary:
      type: object
      required: [name]
      properties:
        name:
          type: string
        uuid:
          type: string
          format: uuid
    SourceInventoryProgram:
      type: object
      required:
        [
          program,
          objectCount,
          fileCount,
          measuredFileCount,
          unreachableFileCount,
          totalBytes,
        ]
      properties:
        program:
          $ref: '#/components/schemas/ResearchProgram'
        objectCount:
          type: integer
          format: int32
          description: Research objects in this program.
        fileCount:
          type: integer
          format: int32
          description: Distinct source files referenced by those objects.
        measuredFileCount:
          type: integer
          format: int32
          description: Files whose length the publisher reported. The rest are counted but not sized.
        unreachableFileCount:
          type: integer
          format: int32
          description: Files whose host did not answer when last measured.
        totalBytes:
          type: integer
          format: int64
          description: Sum of the measured file lengths.
    SourceInventory:
      type: object
      required:
        - checkedAt
        - objectCount
        - programCount
        - distinctFileCount
        - measuredFileCount
        - unreachableFileCount
        - totalBytes
        - byProgram
      properties:
        checkedAt:
          type: string
          format: date-time
          description: When the sizes were measured. A byte total without this is not a fact about now.
        objectCount:
          type: integer
          format: int32
        programCount:
          type: integer
          format: int32
        distinctFileCount:
          type: integer
          format: int32
          description: >-
            Counted once per URL. Several objects legitimately reference the same national file, and
            counting it once per reference would inflate the total.
        measuredFileCount:
          type: integer
          format: int32
        unreachableFileCount:
          type: integer
          format: int32
        totalBytes:
          type: integer
          format: int64
        byProgram:
          type: array
          items:
            $ref: '#/components/schemas/SourceInventoryProgram'
    DspaceOverview:
      type: object
      required: [reachable, readEnabled, writeEnabled]
      properties:
        reachable:
          type: boolean
          description: Whether the DSpace REST API answered a liveness probe.
        readEnabled:
          type: boolean
          description: Whether a base URL is configured for discovery reads.
        writeEnabled:
          type: boolean
          description: Whether sync apply can authenticate and write metadata.
        baseUrl:
          type: string
          description: Configured DSpace REST endpoint, when set.
        itemCount:
          type: integer
          minimum: 0
          description: Non-withdrawn items visible to discovery, when reachable.
        communityCount:
          type: integer
          minimum: 0
        collectionCount:
          type: integer
          minimum: 0
        storedBitstreamCount:
          type: integer
          minimum: 0
          description: >-
            Bitstreams held in the ORIGINAL bundles of discoverable items. The repository mirrors a
            bounded subset of the subscribed files rather than all of them, so this is smaller than
            the subscribed file count by design.
        storedBytes:
          type: integer
          format: int64
          minimum: 0
          description: Total size of those bitstreams, as DSpace reports it.
        communities:
          type: array
          items:
            $ref: '#/components/schemas/DspaceContainerSummary'
        collections:
          type: array
          items:
            $ref: '#/components/schemas/DspaceContainerSummary'
        lastSyncStatus:
          $ref: '#/components/schemas/SyncStatus'
        lastSyncSource:
          $ref: '#/components/schemas/SyncSource'
        lastSyncStartedAt:
          type: string
          format: date-time
        statusMessage:
          type: string
          description: Human-readable note when stats are partial or DSpace is unavailable.
        programCounts:
          type: array
          description: Item counts grouped by research program when Solr or sync history is available.
          items:
            $ref: '#/components/schemas/ProgramCount'
        recentSyncActionSummary:
          type: array
          description: Aggregated sync action counts from recent jobs.
          items:
            $ref: '#/components/schemas/SyncActionSummary'
        storedMetadataFields:
          type: array
          description: Key Dublin Core and crr.* metadata fields stored on synced items.
          items:
            type: string
    SolrOverview:
      type: object
      required: [enabled, reachable]
      properties:
        enabled:
          type: boolean
          description: Whether a Solr base URL and core are configured.
        reachable:
          type: boolean
          description: Whether the discovery core answered a select probe.
        baseUrl:
          type: string
        core:
          type: string
        indexedDocumentCount:
          type: integer
          minimum: 0
          description: Documents in the discovery core, when reachable.
        projectionSource:
          $ref: '#/components/schemas/RepositorySource'
        projectionObjectCount:
          type: integer
          minimum: 0
          description: Objects the API last projected into Solr.
        lastRebuiltAt:
          type: string
          format: date-time
          description: When the discovery projection was last rebuilt.
        statusMessage:
          type: string
          description: Human-readable note when stats are partial or Solr is unavailable.
        projectionBreakdown:
          $ref: '#/components/schemas/ProjectionBreakdown'
    ProgramCount:
      type: object
      required: [program, count]
      properties:
        program:
          $ref: '#/components/schemas/ResearchProgram'
        count:
          type: integer
          minimum: 0
    SyncActionSummary:
      type: object
      required: [actionType, count]
      properties:
        actionType:
          type: string
        count:
          type: integer
          minimum: 0
    ProjectionBreakdown:
      type: object
      required: [indexedCount, projectedCount, source]
      properties:
        indexedCount:
          type: integer
          minimum: 0
          description: Documents currently in the discovery Solr core.
        projectedCount:
          type: integer
          minimum: 0
          description: Objects the API last projected into Solr.
        repositoryItemCount:
          type: integer
          minimum: 0
          description: DSpace discoverable item count when available as the projection denominator.
        source:
          $ref: '#/components/schemas/RepositorySource'
    SyncRequest:
      type: object
      required: [mode, source]
      properties:
        mode:
          $ref: '#/components/schemas/SyncMode'
        source:
          $ref: '#/components/schemas/SyncSource'
    SyncJob:
      type: object
      required: [id, mode, source, status, startedAt, actions]
      properties:
        id:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/SyncMode'
        source:
          $ref: '#/components/schemas/SyncSource'
        status:
          $ref: '#/components/schemas/SyncStatus'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        actions:
          type: array
          items:
            $ref: '#/components/schemas/SyncAction'
    SyncAction:
      type: object
      required: [actionType, target, detail]
      properties:
        actionType:
          type: string
          enum:
            [
              UPSERT_COMMUNITY,
              UPSERT_COLLECTION,
              UPSERT_ITEM,
              UPSERT_FILE_MANIFEST,
              UPSERT_CITATION,
              UPSERT_MAP_LAYER,
              VERIFY_COMMUNITY,
              VERIFY_COLLECTION,
              CREATE_ITEM,
              UPDATE_ITEM,
              SKIP_ITEM,
              VERIFY_INDEX,
              SYNC_FAILED,
            ]
        target:
          type: string
        detail:
          type: string
    ResearchObjectType:
      type: string
      # PROJECT is the research package itself: an object whose value is the edges it declares
      # rather than the files it holds. It is a repository item with its own handle, so that a
      # body of work can be cited and resolved the same way its parts are.
      enum:
        [DATASET, PUBLICATION, CODE, METHODOLOGY, SUPPORTING_MATERIAL, PROJECT]
    AccessLevel:
      type: string
      # Open Science at a statistical agency is not "everything is public". Title 13 protects the
      # microdata behind most Census research, so a repository that can only say PUBLIC cannot
      # describe its own holdings. A RESTRICTED object still carries citation, provenance and
      # instructions for legitimate access; it carries no files.
      enum: [PUBLIC, RESTRICTED, METADATA_ONLY, EMBARGOED]
    ResearchRelation:
      type: object
      required: [verb, targetId, targetTitle, targetType]
      description: >-
        A typed, directional edge between two research objects. Asserted only where it is true of
        the objects themselves; relatedResearch keeps its geography heuristic for everything else.
      properties:
        verb:
          $ref: '#/components/schemas/ResearchRelationVerb'
        targetId:
          type: string
        targetTitle:
          type: string
        targetType:
          $ref: '#/components/schemas/ResearchObjectType'
        targetAccessLevel:
          $ref: '#/components/schemas/AccessLevel'
        note:
          type: string
          description: Why this relationship holds, in the curator's words.
    ResearchRelationVerb:
      type: string
      # hasPart: a project to its members. uses: research to the data it ran on. documents:
      # methodology to what it describes. isDerivedFrom: a public product to its restricted source.
      enum: [hasPart, uses, documents, isDerivedFrom]
    ResearchAuthor:
      type: object
      required: [name]
      properties:
        name:
          type: string
        orcid:
          type: string
          description: >-
            Absent rather than blank when the researcher has no public ORCID. An empty string
            would assert that none exists, which is a claim the repository cannot make.
    ResearchProgram:
      type: string
      # OTHER covers repository items that carry no crr.program value. Guessing a Census
      # program for an unlabeled item would misreport it, so an unmapped program is reported
      # as OTHER rather than assigned.
      enum:
        [
          ACS,
          SIPP,
          CPS,
          LEHD,
          LODES,
          TIGER_LINE,
          USGS,
          ECONOMIC_CENSUS,
          COUNTY_BUSINESS_PATTERNS,
          BUILDING_PERMITS,
          POPULATION_ESTIMATES,
          SAIPE,
          BUSINESS_DYNAMICS,
          USGS_3DEP,
          USGS_3HP,
          OTHER,
        ]
    FileFormat:
      type: string
      enum: [CSV, ZIP, PDF, JSON, GEOJSON, SHAPEFILE, GEOPACKAGE, OTHER]
    MapLayerType:
      type: string
      enum:
        [
          CENSUS_BOUNDARY,
          CENSUS_DATA,
          CENSUS_CHOROPLETH,
          USGS_EARTHQUAKE,
          USGS_REFERENCE,
        ]
    LodesFlowOverlay:
      type: object
      required:
        - source
        - sourceUrl
        - attribution
        - geography
        - vintage
        - fallback
        - geoJson
        - flows
      properties:
        source:
          type: string
        sourceUrl:
          type: string
          format: uri
        attribution:
          type: string
        geography:
          type: string
        vintage:
          type: integer
          format: int32
        fallback:
          type: boolean
        geoJson:
          type: object
          additionalProperties: true
        flows:
          type: array
          items:
            $ref: '#/components/schemas/LodesFlowSummary'
    RepositoryIdentitySummary:
      type: object
      required: [knownIdentifiers, withDspaceUuid, indexed]
      properties:
        knownIdentifiers:
          type: integer
          minimum: 0
          description: Source identifiers the repository has recorded anything about.
        withDspaceUuid:
          type: integer
          minimum: 0
          description: >-
            How many resolved to a DSpace item. Lower than the total while live sync adapters cover
            only some sources, which is a fact about sync coverage rather than about the objects.
        indexed:
          type: integer
          minimum: 0
          description: How many the discovery projection has stamped.
        examples:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryIdentityRecord'
    RepositoryIdentityRecord:
      type: object
      required: [sourceIdentifier]
      properties:
        sourceIdentifier:
          type: string
        dspaceUuid:
          type: string
        sourceUrl:
          type: string
        indexedAt:
          type: string
          format: date-time
    LodesWorkplaceOverlay:
      type: object
      required:
        - source
        - sourceUrl
        - attribution
        - geography
        - vintage
        - fallback
        - geoJson
        - places
        - maxJobCount
      properties:
        source:
          type: string
        sourceUrl:
          type: string
          format: uri
        attribution:
          type: string
        geography:
          type: string
        vintage:
          type: integer
          format: int32
        fallback:
          type: boolean
        geoJson:
          type: object
          additionalProperties: true
        maxJobCount:
          type: integer
          format: int32
          description: >-
            Largest county job count in this overlay. The client scales symbol area against it, so
            the scale is stated by the response rather than guessed from the rendered features.
        places:
          type: array
          items:
            $ref: '#/components/schemas/LodesWorkplaceSummary'
    LodesWorkplaceSummary:
      type: object
      required: [id, countyName, jobCount, jobShare]
      properties:
        id:
          type: string
        countyName:
          type: string
        jobCount:
          type: integer
          format: int32
        jobShare:
          type: number
          format: double
          description: Percentage of the area's counted jobs, so a reader can rank without arithmetic.
    LodesFlowSummary:
      type: object
      required:
        [
          id,
          originLabel,
          destinationLabel,
          workerCount,
          originCounty,
          destinationCounty,
        ]
      properties:
        id:
          type: string
        originLabel:
          type: string
        destinationLabel:
          type: string
        workerCount:
          type: integer
          format: int32
        originCounty:
          type: string
        destinationCounty:
          type: string
    SaipeCountyChoropleth:
      type: object
      required:
        - source
        - sourceUrl
        - attribution
        - geography
        - vintage
        - measureLabel
        - geoJson
        - counties
      properties:
        source:
          type: string
        sourceUrl:
          type: string
          format: uri
        attribution:
          type: string
        geography:
          type: string
        vintage:
          type: integer
          format: int32
        measureLabel:
          type: string
        geoJson:
          type: object
          additionalProperties: true
        counties:
          type: array
          items:
            $ref: '#/components/schemas/SaipeCountyValue'
    SaipeCountyValue:
      type: object
      required: [fips, name, povertyRate]
      properties:
        fips:
          type: string
        name:
          type: string
        povertyRate:
          type: number
          format: double
        medianHouseholdIncome:
          type: integer
          format: int32
    EvidenceStatus:
      type: string
      enum:
        [
          NOT_STARTED,
          AUTOMATED_PASS,
          AUTOMATED_FAIL,
          MANUAL_REVIEW_REQUIRED,
          VERIFIED,
        ]
    SyncMode:
      type: string
      enum: [DRY_RUN, DIFF, APPLY]
    SyncSource:
      type: string
      # One value per program a harvest adapter can reconcile. Kept in step with ResearchProgram,
      # but deliberately a separate enum: a program is what an object belongs to, a sync source is
      # something that can be harvested, and the eight national programs below only became the
      # latter when adapters existed for them.
      enum:
        [
          TIGER_LINE,
          LODES,
          ACS_PUMS,
          SIPP,
          CPS,
          USGS_EARTHQUAKES,
          ECONOMIC_CENSUS,
          COUNTY_BUSINESS_PATTERNS,
          BUILDING_PERMITS,
          POPULATION_ESTIMATES,
          SAIPE,
          BUSINESS_DYNAMICS,
          USGS_3DEP,
          USGS_3HP,
        ]
    SyncStatus:
      type: string
      enum: [QUEUED, RUNNING, DIFF_COMPLETE, DRY_RUN_COMPLETE, APPLIED, FAILED]
