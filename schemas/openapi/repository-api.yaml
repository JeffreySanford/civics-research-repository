        - distinctFileCount
        - measuredFileCount
        - unreachableFileCount
        - totalBytes
        - byProgram
      properties:
        checkedAt:
          type: string
          format: date-time
          description: When the sizes were measured. A byte total without this is not a fact about now.
        objectCount:
          type: integer
          format: int32
        programCount:
          type: integer
          format: int32
        distinctFileCount:
          type: integer
          format: int32
          description: >-
            Counted once per URL. Several objects legitimately reference the same national file, and
            counting it once per reference would inflate the total.
        measuredFileCount:
          type: integer
          format: int32
        unreachableFileCount:
          type: integer
          format: int32
        totalBytes:
          type: integer
          format: int64
        byProgram:
          type: array
          items:
            $ref: '#/components/schemas/SourceInventoryProgram'
    DspaceOverview:
      type: object
      required: [reachable, readEnabled, writeEnabled]
      properties:
        reachable:
          type: boolean
          description: Whether the DSpace REST API answered a liveness probe.
        readEnabled:
          type: boolean
          description: Whether a base URL is configured for discovery reads.
        writeEnabled:
          type: boolean
          description: Whether sync apply can authenticate and write metadata.
        baseUrl:
          type: string
          description: Configured DSpace REST endpoint, when set.
        itemCount:
          type: integer
          minimum: 0
          description: Non-withdrawn items visible to discovery, when reachable.
        communityCount:
          type: integer
          minimum: 0
        collectionCount:
          type: integer
          minimum: 0
        storedBitstreamCount:
          type: integer
          minimum: 0
          description: >-
            Bitstreams held in the ORIGINAL bundles of discoverable items. The repository mirrors a
            bounded subset of the subscribed files rather than all of them, so this is smaller than
            the subscribed file count by design.
        storedBytes:
          type: integer
          format: int64
          minimum: 0
          description: Total size of those bitstreams, as DSpace reports it.
        communities:
          type: array
          items:
            $ref: '#/components/schemas/DspaceContainerSummary'
        collections:
          type: array
          items:
            $ref: '#/components/schemas/DspaceContainerSummary'
        lastSyncStatus:
          $ref: '#/components/schemas/SyncStatus'
        lastSyncSource:
          $ref: '#/components/schemas/SyncSource'
        lastSyncStartedAt:
          type: string
          format: date-time
        statusMessage:
          type: string
          description: Human-readable note when stats are partial or DSpace is unavailable.
        programCounts:
          type: array
          description: Item counts grouped by research program when Solr or sync history is available.
          items:
            $ref: '#/components/schemas/ProgramCount'
        recentSyncActionSummary:
          type: array
          description: Aggregated sync action counts from recent jobs.
          items:
            $ref: '#/components/schemas/SyncActionSummary'
        storedMetadataFields:
          type: array
          description: Key Dublin Core and crr.* metadata fields stored on synced items.
          items:
            type: string
    SolrOverview:
      type: object
      required: [enabled, reachable]
      properties:
        enabled:
          type: boolean
          description: Whether a Solr base URL and core are configured.
        reachable:
          type: boolean
          description: Whether the discovery core answered a select probe.
        baseUrl:
          type: string
        core:
          type: string
        indexedDocumentCount:
          type: integer
          minimum: 0
          description: Documents in the discovery core, when reachable.
        projectionSource:
          $ref: '#/components/schemas/RepositorySource'
        projectionObjectCount:
          type: integer
          minimum: 0
          description: Objects the API last projected into Solr.
        lastRebuiltAt:
          type: string
          format: date-time
          description: When the discovery projection was last rebuilt.
        statusMessage:
          type: string
          description: Human-readable note when stats are partial or Solr is unavailable.
        projectionBreakdown:
          $ref: '#/components/schemas/ProjectionBreakdown'
    ProgramCount:
      type: object
      required: [program, count]
      properties:
        program:
          $ref: '#/components/schemas/ResearchProgram'
        count:
          type: integer
          minimum: 0
    SyncActionSummary:
      type: object
      required: [actionType, count]
      properties:
        actionType:
          type: string
        count:
          type: integer
          minimum: 0
    ProjectionBreakdown:
      type: object
      required: [indexedCount, projectedCount, source]
      properties:
        indexedCount:
          type: integer
          minimum: 0
          description: Documents currently in the discovery Solr core.
        projectedCount:
          type: integer
          minimum: 0
          description: Objects the API last projected into Solr.
        repositoryItemCount:
          type: integer
          minimum: 0
          description: DSpace discoverable item count when available as the projection denominator.
        source:
          $ref: '#/components/schemas/RepositorySource'
    SyncRequest:
      type: object
      required: [mode, source]
      properties:
        mode:
          $ref: '#/components/schemas/SyncMode'
        source:
          $ref: '#/components/schemas/SyncSource'
    SyncJob:
      type: object
      required: [id, mode, source, status, startedAt, actions]
      properties:
        id:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/SyncMode'
        source:
          $ref: '#/components/schemas/SyncSource'
        status:
          $ref: '#/components/schemas/SyncStatus'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        actions:
          type: array
          items:
            $ref: '#/components/schemas/SyncAction'
    SyncAction:
      type: object
      required: [actionType, target, detail]
      properties:
        actionType:
          type: string
          enum:
            [
              UPSERT_COMMUNITY,
              UPSERT_COLLECTION,
              UPSERT_ITEM,
              UPSERT_FILE_MANIFEST,
              UPSERT_CITATION,
              UPSERT_MAP_LAYER,
              VERIFY_COMMUNITY,
              VERIFY_COLLECTION,
              CREATE_ITEM,
              UPDATE_ITEM,
              SKIP_ITEM,
              VERIFY_INDEX,
              SYNC_FAILED,
            ]
        target:
          type: string
        detail:
          type: string
    ResearchObjectType:
      type: string
      # PROJECT is the research package itself: an object whose value is the edges it declares
      # rather than the files it holds. It is a repository item with its own handle, so that a
      # body of work can be cited and resolved the same way its parts are.
      enum:
        [DATASET, PUBLICATION, CODE, METHODOLOGY, SUPPORTING_MATERIAL, PROJECT]
    AccessLevel:
      type: string
      # Open Science at a statistical agency is not "everything is public". Title 13 protects the
      # microdata behind most Census research, so a repository that can only say PUBLIC cannot
      # describe its own holdings. A RESTRICTED object still carries citation, provenance and
      # instructions for legitimate access; it carries no files.
      enum: [PUBLIC, RESTRICTED, METADATA_ONLY, EMBARGOED]
    ResearchRelation:
      type: object
      required: [verb, targetId, targetTitle, targetType]
      description: >-
        A typed, directional edge between two research objects. Asserted only where it is true of
        the objects themselves; relatedResearch keeps its geography heuristic for everything else.
      properties:
        verb:
          $ref: '#/components/schemas/ResearchRelationVerb'
        targetId:
          type: string
        targetTitle:
          type: string
        targetType:
          $ref: '#/components/schemas/ResearchObjectType'
        targetAccessLevel:
          $ref: '#/components/schemas/AccessLevel'
        note:
          type: string
          description: Why this relationship holds, in the curator's words.
    ResearchRelationVerb:
      type: string
      # hasPart: a project to its members. uses: research to the data it ran on. documents:
      # methodology to what it describes. isDerivedFrom: a public product to its restricted source.
      enum: [hasPart, uses, documents, isDerivedFrom]
    ResearchAuthor:
      type: object
      required: [name]
      properties:
        name:
          type: string
        orcid:
          type: string
          description: >-
            Absent rather than blank when the researcher has no public ORCID. An empty string
            would assert that none exists, which is a claim the repository cannot make.
    ResearchProgram:
      type: string
      # OTHER covers repository items that carry no crr.program value. Guessing a Census
      # program for an unlabeled item would misreport it, so an unmapped program is reported
      # as OTHER rather than assigned.
      enum:
        [
          ACS,
          SIPP,
          CPS,
          LEHD,
          LODES,
          TIGER_LINE,
          USGS,
          ECONOMIC_CENSUS,
          COUNTY_BUSINESS_PATTERNS,
          BUILDING_PERMITS,
          POPULATION_ESTIMATES,
          SAIPE,
          BUSINESS_DYNAMICS,
          USGS_3DEP,
          USGS_3HP,
          OTHER,
        ]
    FileFormat:
      type: string
      enum: [CSV, ZIP, PDF, JSON, GEOJSON, SHAPEFILE, GEOPACKAGE, OTHER]
    MapLayerType:
      type: string
      enum:
        [
          CENSUS_BOUNDARY,
          CENSUS_DATA,
          CENSUS_CHOROPLETH,
          USGS_EARTHQUAKE,
          USGS_REFERENCE,
        ]
    LodesFlowOverlay:
      type: object
      required:
        - source
        - sourceUrl
        - attribution
        - geography
        - vintage
        - fallback
        - geoJson
        - flows
      properties:
        source:
          type: string
        sourceUrl:
          type: string
          format: uri
        attribution:
          type: string
        geography:
          type: string
        vintage:
          type: integer
          format: int32
        fallback:
          type: boolean
        geoJson:
          type: object
          additionalProperties: true
        flows:
          type: array
          items:
            $ref: '#/components/schemas/LodesFlowSummary'
    RepositoryIdentitySummary:
      type: object
      required: [knownIdentifiers, withDspaceUuid, indexed]
      properties:
        knownIdentifiers:
          type: integer
          minimum: 0
          description: Source identifiers the repository has recorded anything about.
        withDspaceUuid:
          type: integer
          minimum: 0
          description: >-
            How many resolved to a DSpace item. Lower than the total while live sync adapters cover
            only some sources, which is a fact about sync coverage rather than about the objects.
        indexed:
          type: integer
          minimum: 0
          description: How many the discovery projection has stamped.
        examples:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryIdentityRecord'
    RepositoryIdentityRecord:
      type: object
      required: [sourceIdentifier]
      properties:
        sourceIdentifier:
          type: string
        dspaceUuid:
          type: string
        sourceUrl:
          type: string
        indexedAt:
          type: string
          format: date-time
    LodesWorkplaceOverlay:
      type: object
      required:
        - source
        - sourceUrl
        - attribution
        - geography
        - vintage
        - fallback
        - geoJson
        - places
        - maxJobCount
      properties:
        source:
          type: string
        sourceUrl:
          type: string
          format: uri
        attribution:
          type: string
        geography:
          type: string
        vintage:
          type: integer
          format: int32
        fallback:
          type: boolean
        geoJson:
          type: object
          additionalProperties: true
        maxJobCount:
          type: integer
          format: int32
          description: >-
            Largest county job count in this overlay. The client scales symbol area against it, so
            the scale is stated by the response rather than guessed from the rendered features.
        places:
          type: array
          items:
            $ref: '#/components/schemas/LodesWorkplaceSummary'
    LodesWorkplaceSummary:
      type: object
      required: [id, countyName, jobCount, jobShare]
      properties:
        id:
          type: string
        countyName:
          type: string
        jobCount:
          type: integer
          format: int32
        jobShare:
          type: number
          format: double
          description: Percentage of the area's counted jobs, so a reader can rank without arithmetic.
    LodesFlowSummary:
      type: object
      required:
        [
          id,
          originLabel,
          destinationLabel,
          workerCount,
          originCounty,
          destinationCounty,
        ]
      properties:
        id:
          type: string
        originLabel:
          type: string
        destinationLabel:
          type: string
        workerCount:
          type: integer
          format: int32
        originCounty:
          type: string
        destinationCounty:
          type: string
    SaipeCountyChoropleth:
      type: object
      required:
        - source
        - sourceUrl
        - attribution
        - geography
        - vintage
        - measureLabel
        - geoJson
        - counties
      properties:
        source:
          type: string
        sourceUrl:
          type: string
          format: uri
        attribution:
          type: string
        geography:
          type: string
        vintage:
          type: integer
          format: int32
        measureLabel:
          type: string
        geoJson:
          type: object
          additionalProperties: true
        counties:
          type: array
          items:
            $ref: '#/components/schemas/SaipeCountyValue'
    SaipeCountyValue:
      type: object
      required: [fips, name, povertyRate]
      properties:
        fips:
          type: string
        name:
          type: string
        povertyRate:
          type: number
          format: double
        medianHouseholdIncome:
          type: integer
          format: int32
    EvidenceStatus:
      type: string
      enum:
        [
          NOT_STARTED,
          AUTOMATED_PASS,
          AUTOMATED_FAIL,
          MANUAL_REVIEW_REQUIRED,
          VERIFIED,
        ]
    SyncMode:
      type: string
      enum: [DRY_RUN, DIFF, APPLY]
    SyncSource:
      type: string
      # One value per program a harvest adapter can reconcile. Kept in step with ResearchProgram,
      # but deliberately a separate enum: a program is what an object belongs to, a sync source is
      # something that can be harvested, and the eight national programs below only became the
      # latter when adapters existed for them.
      enum:
        [
          TIGER_LINE,
          LODES,
          ACS_PUMS,
          SIPP,
          CPS,
          USGS_EARTHQUAKES,
          ECONOMIC_CENSUS,
          COUNTY_BUSINESS_PATTERNS,
          BUILDING_PERMITS,
          POPULATION_ESTIMATES,
          SAIPE,
          BUSINESS_DYNAMICS,
          USGS_3DEP,
          USGS_3HP,
        ]
    SyncStatus:
      type: string
      enum: [QUEUED, RUNNING, DIFF_COMPLETE, DRY_RUN_COMPLETE, APPLIED, FAILED]
