openapi: 3.1.0
info:
  title: Civics Research Repository API
  version: 0.1.0
  description: Typed backend API contract for public research discovery, datasets, map overlays, and accessibility evidence.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.civics-research-repository.local/api
    description: Local development API host alias
security: []
tags:
  - name: Search
    description: Research object search and faceted discovery.
  - name: Datasets
    description: Dataset detail, files, versions, citations, and relationships.
  - name: Maps
    description: Dataset map layers and USGS overlays.
  - name: Evidence
    description: WCAG and Section 508 evidence summaries.
  - name: Admin
    description: Administrative sync and repository maintenance workflows.
paths:
  /search:
    get:
      tags: [Search]
      operationId: searchResearchObjects
      summary: Search public research objects.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Program'
        - $ref: '#/components/parameters/Publisher'
        - $ref: '#/components/parameters/SourceSystemFilter'
        - $ref: '#/components/parameters/Geography'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/VintageYear'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Search results and facets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /search/cursor:
    get:
      tags: [Search]
      operationId: searchResearchObjectsWithCursor
      summary: Continue public research discovery with an opaque cursor.
      description: >-
        Starts a deterministic traversal at logical page zero when cursor is omitted. Returned
        cursors are opaque, signed navigation state bound to the active discovery projection,
        effective query/filter set, page size, sort contract, and public search backend. A stale,
        edited, or incompatible cursor is rejected instead of silently restarting with offsets.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Program'
        - $ref: '#/components/parameters/Publisher'
        - $ref: '#/components/parameters/SourceSystemFilter'
        - $ref: '#/components/parameters/Geography'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/VintageYear'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One deterministic result page plus the opaque continuation for the next page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchCursorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /research/{researchId}:
    get:
      tags: [Datasets]
      operationId: getResearchObject
      summary: Get an authority-neutral research object detail.
      description: >-
        Resolves either a curated DSpace-backed object or reproducible federated metadata.
        Federated responses link to the authoritative publisher resource and do not imply that
        publisher binaries are preserved locally.
      parameters:
        - $ref: '#/components/parameters/ResearchId'
      responses:
        '200':
          description: Research object detail with explicit origin and source system.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchObjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /search/comparison/scenarios:
    get:
      tags: [Search]
      operationId: listSearchComparisonScenarios
      summary: List supported Solr/OpenSearch comparison scenarios.
      responses:
        '200':
          description: Supported comparison scenarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchComparisonScenario'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /search/comparison/run:
    post:
      tags: [Search]
      operationId: runSearchComparison
      summary: Run one normalized discovery query against Solr and OpenSearch.
      description: >-
        Both engines query the same deterministic active discovery projection. Elapsed timings are
        local diagnostic measurements and must not be presented as universal production benchmarks.
        The optional execution order exists so controlled experiments can detect ordering effects.
      parameters:
        - name: order
          in: query
          required: false
          description: Engine invocation order for controlled local diagnostics; defaults to SOLR_FIRST.
          schema:
            $ref: '#/components/schemas/SearchComparisonExecutionOrder'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchComparisonRequest'
      responses:
        '200':
          description: Side-by-side engine results and projection parity evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchComparisonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /datasets/{datasetId}:
    get:
      tags: [Datasets]
      operationId: getDataset
      summary: Get a dataset research object.
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: Dataset detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchObjectDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /datasets/{datasetId}/versions:
    get:
      tags: [Datasets]
      operationId: getDatasetVersions
      summary: Get dataset version history.
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: Dataset versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /datasets/{datasetId}/map-layers:
    get:
      tags: [Maps]
      operationId: getDatasetMapLayers
      summary: Get map layers available for a dataset.
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: Map layer configuration.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MapLayer'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /maps/census-areas:
    get:
      tags: [Maps]
      operationId: listCensusAreaBoundaries
      summary: List selectable Census area map boundaries.
      responses:
        '200':
          description: Census area boundary summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CensusAreaBoundary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /maps/research-coverage:
    get:
      tags: [Maps]
      operationId: getResearchSpatialCoverage
      summary: Get criteria- and viewport-bounded research coverage.
      description: >-
        Reads one activated, versioned research spatial sidecar build and returns explicit
        matching, mapped, unmapped, quarantined, viewport, truncation, and omitted counts plus a
        deterministic bounded feature set. The browser never receives the complete spatial
        sidecar. A viewport whose west value is greater than east crosses the antimeridian.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Program'
        - $ref: '#/components/parameters/Publisher'
        - name: sourceSystem
          in: query
          required: false
          description: Spatial sidecar source system; currently DATA_GOV is the supported active source.
          schema:
            $ref: '#/components/schemas/FederatedSourceSystem'
            default: DATA_GOV
        - $ref: '#/components/parameters/Geography'
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/VintageYear'
        - name: west
          in: query
          required: true
          description: Western WGS84 longitude. Values greater than east denote a dateline-crossing viewport.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: south
          in: query
          required: true
          description: Southern WGS84 latitude.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: east
          in: query
          required: true
          description: Eastern WGS84 longitude.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: north
          in: query
          required: true
          description: Northern WGS84 latitude; must be greater than or equal to south.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: limit
          in: query
          required: false
          description: Hard maximum number of map features returned for this viewport.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Bounded spatial coverage summary and feature set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchSpatialCoverageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /overlays/census/lodes-flow:
    get:
      tags: [Maps]
      operationId: getLodesFlowOverlay
      summary: Get a small LEHD LODES origin-destination flow sample for a Census area.
      parameters:
        - $ref: '#/components/parameters/Geography'
      responses:
        '200':
          description: LODES workplace flow GeoJSON overlay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LodesFlowOverlay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /overlays/census/lodes-workplace:
    get:
      tags: [Maps]
      operationId: getLodesWorkplaceOverlay
      summary: Get LEHD LODES workplace employment by county for a Census area.
      description: >-
        Jobs counted at the workplace, aggregated from the published Workplace Area Characteristics
        file. Answers "where are the jobs", which the origin-destination flows do not: a commuting
        line says who travels, not how much work is at either end.
      parameters:
        - $ref: '#/components/parameters/Geography'
      responses:
        '200':
          description: LODES workplace employment overlay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LodesWorkplaceOverlay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /overlays/census/saipe-counties:
    get:
      tags: [Maps]
      operationId: getSaipeCountyChoropleth
      summary: Get SAIPE county poverty choropleth GeoJSON and accessible county values.
      parameters:
        - $ref: '#/components/parameters/Geography'
      responses:
        '200':
          description: SAIPE county choropleth overlay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaipeCountyChoropleth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /overlays/usgs/earthquakes:
    get:
      tags: [Maps]
      operationId: getUsgsEarthquakeOverlay
      summary: Get USGS earthquake overlay features.
      parameters:
        - name: minMagnitude
          in: query
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 10
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 7
      responses:
        '200':
          description: Earthquake overlay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsgsEarthquakeOverlay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /overlays/usgs/hydrography/export:
    get:
      tags: [Maps]
      operationId: getUsgsHydrographyTileExport
      summary: Proxy USGS 3DHP hydrography raster tile export.
      description: >-
        Fetches ArcGIS MapServer `/export` tiles from The National Map on the server so the
        discovery UI can load hydrography without cross-origin browser requests.
      parameters:
        - name: bbox
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated west,south,east,north in EPSG:3857 (Web Mercator).
        - name: bboxSR
          in: query
          schema:
            type: integer
            default: 3857
        - name: imageSR
          in: query
          schema:
            type: integer
            default: 3857
        - name: size
          in: query
          schema:
            type: string
            default: '256,256'
        - name: f
          in: query
          schema:
            type: string
            default: image
        - name: transparent
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Hydrography raster tile PNG.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /accessibility/evidence:
    get:
      tags: [Evidence]
      operationId: getAccessibilityEvidence
      summary: Get accessibility evidence summaries.
      responses:
        '200':
          description: Accessibility evidence entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessibilityEvidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /evidence/search-performance:
    get:
      tags: [Evidence]
      operationId: getSearchPerformanceEvidence
      summary: Get the latest locally certified C2 Solr/OpenSearch research summary.
      description: >-
        Returns a stable UI-facing summary of generated C2 research artifacts. Positive paired
        latency differences mean OpenSearch took longer than Solr. The response is scoped to the
        documented corpus, mappings, workload/client cells, engine versions and local container
        topology and must not be interpreted as a universal search-engine ranking.
      responses:
        '200':
          description: Certified C2 search performance evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPerformanceEvidence'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/sync:
    get:
      tags: [Admin]
      operationId: listRepositorySyncJobs
      summary: List recent repository metadata sync jobs.
      responses:
        '200':
          description: Recent sync jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyncJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Admin]
      operationId: startRepositorySync
      summary: Start a repository metadata sync.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '202':
          description: Sync job accepted and completed or queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/sync/{syncJobId}:
    get:
      tags: [Admin]
      operationId: getRepositorySyncJob
      summary: Get repository sync job status.
      parameters:
        - $ref: '#/components/parameters/SyncJobId'
      responses:
        '200':
          description: Sync job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/reindex:
    get:
      tags: [Admin]
      operationId: getDiscoveryProjectionState
      summary: Get the current discovery projection state without rebuilding it.
      responses:
        '200':
          description: Discovery projection metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryProjectionState'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Admin]
      operationId: reindexDiscoveryProjection
      summary: Activate or rebuild a deterministic discovery corpus profile.
      description: >-
        Rebuilds Solr and OpenSearch from the normalized records belonging to the requested corpus
        profile and persists a named activation only after projection parity succeeds. When profile is
        omitted, the currently active profile is rebuilt; before any activation exists that resolves
        to CURATED_DEMO. This endpoint currently returns after activation completes even though its
        historical HTTP status remains 202.
      parameters:
        - name: profile
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CorpusProfile'
      responses:
        '202':
          description: Profile activation/rebuild completed and the resulting projection state is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryProjectionState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/reindex/progress:
    get:
      tags: [Admin]
      operationId: getCorpusProfileActivationProgress
      summary: Get live progress for the current or most recent corpus-profile activation.
      responses:
        '200':
          description: Operator-facing activation progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusProfileActivationProgress'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/corpus/scale:
    post:
      tags: [Admin]
      operationId: startCorpusProfileScale
      summary: Start guarded asynchronous growth and activation of a supported corpus profile.
      description: >-
        Starts the durable harvest/snapshot/projection/evidence workflow. FEDERATED_100K is the
        currently supported growth target; retained publisher metadata is reused when already present.
      parameters:
        - name: profile
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CorpusProfile'
      responses:
        '202':
          description: Scale operation accepted; poll the reindex progress endpoint for completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusProfileActivationProgress'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/corpus/scale/evidence:
    get:
      tags: [Admin]
      operationId: getCorpusScaleEvidence
      summary: Verify the current evidence chain for a named corpus profile without mutating state.
      parameters:
        - name: profile
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CorpusProfile'
      responses:
        '200':
          description: Read-only corpus evidence report and any detected violations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusScaleEvidenceReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/federation/compositions:
    get:
      tags: [Admin]
      operationId: listFederatedCompositeCorpusEvidence
      summary: List recent immutable mixed-source corpus composition evidence.
      parameters:
        - name: corpusProfile
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CorpusProfile'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
      responses:
        '200':
          description: Recent immutable composition manifests for the requested profile.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FederatedCompositeCorpusManifest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Admin]
      operationId: captureFederatedCompositeCorpusEvidence
      summary: Compose existing bounded source snapshots into one durable corpus identity.
      description: >-
        Captures composition evidence only from already-persisted bounded snapshots. Each requested
        source quota must exactly match its selected snapshot and all quotas must sum to the named
        corpus profile target. This does not activate a search projection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederatedCompositeCorpusCaptureRequest'
      responses:
        '200':
          description: Durable immutable composite corpus evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederatedCompositeCorpusManifest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/federation/compositions/{compositionSha256}:
    get:
      tags: [Admin]
      operationId: getFederatedCompositeCorpusEvidence
      summary: Resolve one exact immutable composition identity.
      parameters:
        - name: compositionSha256
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: Exact immutable composite corpus evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederatedCompositeCorpusManifest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/federation/compositions/projections:
    get:
      tags: [Admin]
      operationId: listFederatedCompositeCorpusProjectionEvidence
      summary: List recent composite-corpus to discovery-projection evidence.
      parameters:
        - name: corpusProfile
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CorpusProfile'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
      responses:
        '200':
          description: Recent composition-to-projection evidence for the requested profile.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FederatedCompositeCorpusProjectionEvidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/federation/compositions/{compositionSha256}/projection:
    get:
      tags: [Admin]
      operationId: getFederatedCompositeCorpusProjectionEvidence
      summary: Resolve the newest discovery projection linked to one exact composition.
      parameters:
        - name: compositionSha256
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: Newest valid composition-to-projection evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederatedCompositeCorpusProjectionEvidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/federation/compositions/{compositionSha256}/project:
    post:
      tags: [Admin]
      operationId: projectFederatedCompositeCorpus
      summary: Rebuild discovery from the exact source quotas named by one composition.
      description: >-
        Regenerates each bounded source snapshot before and after projection, streams each source's
        exact stable-ID quota, requires enabled search targets to share one projection identity and
        document count, then persists the composition-to-projection relationship.
      parameters:
        - name: compositionSha256
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: Durable composition-to-projection evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederatedCompositeCorpusProjectionEvidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/spatial/datagov/status:
    get:
      tags: [Admin]
      operationId: getDataGovSpatialSidecarStatus
      summary: Inspect the active Data.gov spatial sidecar build
      responses:
        '200':
          description: Active sidecar build and row count, if one has been activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataGovSpatialSidecarStatusResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/spatial/datagov/rebuild:
    post:
      tags: [Admin]
      operationId: rebuildDataGovSpatialSidecar
      summary: Rebuild and atomically activate the retained-C2 Data.gov spatial sidecar
      description: >-
        Traverses the current Data.gov geospatial subset, preserves publisher spatial_shape geometry,
        filters persistence to retained C2 Data.gov identities, stamps the active composition/projection
        identity, and activates the new build only after the full traversal succeeds. A personal
        Data.gov API key and the exact active FEDERATED_1M corpus are required.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataGovSpatialSidecarRebuildRequest'
      responses:
        '200':
          description: Completed and activated Data.gov spatial sidecar build.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataGovSpatialSidecarRefreshResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/federation/harvest/status:
    get:
      tags: [Admin]
      operationId: getFederationHarvestStatus
      summary: Inspect retained metadata and the durable harvest checkpoint for one federated source.
      parameters:
        - name: sourceSystem
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/FederatedSourceSystem'
      responses:
        '200':
          description: Source-scoped retained count plus resumable/latest durable run metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationHarvestStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/dspace/overview:
    get:
      tags: [Admin]
      operationId: getDspaceOverview
      summary: DSpace repository container overview and live stats.
      responses:
        '200':
          description: DSpace overview with live counts when the REST API is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DspaceOverview'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/repository/identity:
    get:
      tags: [Admin]
      operationId: getRepositoryIdentitySummary
      summary: Report how many research objects have a recorded repository identity.
      description: >-
        A source identifier is only an identity once something records what it became. This reports
        how far that chain reaches: identifiers known, DSpace UUIDs recorded, and objects the
        discovery projection has stamped.
      responses:
        '200':
          description: Repository identity summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryIdentitySummary'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/sources/inventory:
    get:
      tags: [Admin]
      operationId: getSourceInventory
      summary: How much source data the repository is subscribed to, as last measured.
      description: >-
        Aggregate size of the publisher files every research object points at, measured by asking
        each host for the file length. Sizes change when an agency reissues a file, so the response
        carries the date it was taken rather than implying it is live.
      responses:
        '200':
          description: Source inventory totals and per-program breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceInventory'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/corpus/storage:
    get:
      tags: [Admin]
      operationId: getCorpusStorageOverview
      summary: Corpus profile definitions and historical measured local storage footprints.
      responses:
        '200':
          description: Corpus profiles with recent storage history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusStorageOverview'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/corpus/storage/capture:
    post:
      tags: [Admin]
      operationId: captureCorpusStorage
      summary: Capture the current active corpus storage footprint as historical evidence.
      responses:
        '200':
          description: Newly captured measured storage footprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusStorageMeasurement'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/solr/overview:
    get:
      tags: [Admin]
      operationId: getSolrOverview
      summary: Discovery Solr projection overview and live stats.
      responses:
        '200':
          description: Solr overview with indexed document counts when the discovery core is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolrOverview'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    SearchQuery:
      name: q
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: Keyword search terms.
    Program:
      name: program
      in: query
      description: >-
        Repeatable data-driven program name. Repeat the parameter to select several programs;
        results match any of them. Omitting it searches every program. Values come from indexed
        metadata and are not restricted to the curated ResearchProgram enum.
      explode: true
      style: form
      schema:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 200
    Publisher:
      name: publisher
      in: query
      description: Exact publisher facet value from the active discovery projection.
      schema:
        type: string
        minLength: 1
        maxLength: 300
    SourceSystemFilter:
      name: sourceSystem
      in: query
      description: Restrict results to one authoritative source system.
      schema:
        $ref: '#/components/schemas/SourceSystem'
    Geography:
      name: geography
      in: query
      schema:
        type: string
        maxLength: 80
    ContentType:
      name: contentType
      in: query
      description: Restrict results to one research object type.
      schema:
        $ref: '#/components/schemas/ResearchObjectType'
    VintageYear:
      name: vintageYear
      in: query
      schema:
        type: integer
        minimum: 1900
        maximum: 2100
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque signed continuation returned by the previous cursor search page. The token must be
        resent unchanged with the same effective discovery criteria and page size.
      schema:
        type: string
        minLength: 1
        maxLength: 8192
        pattern: '^v1\.[A-Za-z0-9_-]+\.[0-9a-f]{64}$'
    ResearchId:
      name: researchId
      in: path
      required: true
      description: >-
        URL-safe Base64 identity token for the canonical local research-object identifier. The
        token keeps namespaced external identifiers containing slashes and URLs inside one path
        segment without changing the underlying identity used by persistence and discovery.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
        pattern: '^[A-Za-z0-9_-]+$'
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]+$'
    SyncJobId:
      name: syncJobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The requested operator action conflicts with current runtime state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CorpusProfile:
      type: string
      description: >-
        Stable local corpus profile. FEDERATED_10K/100K/1M describe target federated metadata counts
        in addition to the curated repository records; FULL has no fixed count.
      enum: [CURATED_DEMO, FEDERATED_10K, FEDERATED_100K, FEDERATED_1M, FULL]
    SearchComparisonExecutionOrder:
      type: string
      description: Invocation order used by a controlled Solr/OpenSearch comparison request.
      enum: [SOLR_FIRST, OPENSEARCH_FIRST]
    CorpusProfileActivationPhase:
      type: string
      enum:
        - IDLE
        - PREPARING
        - HARVESTING
        - SNAPSHOTTING
        - PROJECTING
        - VERIFYING
        - CAPTURING_EVIDENCE
        - COMPLETED
        - FAILED
    CorpusProfileActivationProgress:
      type: object
      required:
        - phase
        - processedDocuments
        - percentComplete
        - updatedAt
        - elapsedMs
        - message
      properties:
        operationId:
          type: [string, 'null']
        profile:
          oneOf:
            - $ref: '#/components/schemas/CorpusProfile'
            - type: 'null'
        phase:
          $ref: '#/components/schemas/CorpusProfileActivationPhase'
        processedDocuments:
          type: integer
          format: int64
          minimum: 0
        totalDocuments:
          type: [integer, 'null']
          format: int64
          minimum: 0
        percentComplete:
          type: integer
          minimum: 0
          maximum: 100
        startedAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        elapsedMs:
          type: integer
          format: int64
          minimum: 0
        documentsPerSecond:
          type: [number, 'null']
          format: double
          minimum: 0
        message:
          type: string
    CorpusScaleEvidenceReport:
      type: object
      required:
        - profile
        - valid
        - retainedFederatedRecordCount
        - currentProjectionObjectCount
        - targetParity
        - storageEvidencePresent
        - violations
      properties:
        profile:
          $ref: '#/components/schemas/CorpusProfile'
        valid:
          type: boolean
        targetFederatedRecordCount:
          type: [integer, 'null']
          format: int64
          minimum: 0
        retainedFederatedRecordCount:
          type: integer
          format: int64
          minimum: 0
        activeProfile:
          oneOf:
            - $ref: '#/components/schemas/CorpusProfile'
            - type: 'null'
        activationProjectionObjectCount:
          type: [integer, 'null']
          format: int64
          minimum: 0
        activationProjectionId:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        currentProjectionObjectCount:
          type: integer
          minimum: 0
        currentProjectionId:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        targetParity:
          type: boolean
        storageEvidencePresent:
          type: boolean
        storageProjectionObjectCount:
          type: [integer, 'null']
          format: int64
          minimum: 0
        storageRetainedFederatedCount:
          type: [integer, 'null']
          format: int64
          minimum: 0
        storageProjectionId:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        storageCapturedAt:
          type: [string, 'null']
          format: date-time
        violations:
          type: array
          items:
            type: string
    FederatedCompositeCorpusSourceRequest:
      type: object
      required: [sourceSystem, requestedRecordCount, snapshotId]
      properties:
        sourceSystem:
          $ref: '#/components/schemas/FederatedSourceSystem'
        requestedRecordCount:
          type: integer
          format: int64
          minimum: 1
        snapshotId:
          type: string
          minLength: 1
    FederatedCompositeCorpusCaptureRequest:
      type: object
      required: [corpusProfile, sources]
      properties:
        corpusProfile:
          $ref: '#/components/schemas/CorpusProfile'
        sources:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/FederatedCompositeCorpusSourceRequest'
    FederatedCompositeCorpusSource:
      type: object
      required:
        - sourceSystem
        - requestedRecordCount
        - snapshotId
        - runId
        - runAdapterVersion
        - recordAdapterVersions
        - retainedRecordCount
        - sha256
        - snapshotCapturedAt
      properties:
        sourceSystem:
          $ref: '#/components/schemas/FederatedSourceSystem'
        requestedRecordCount:
          type: integer
          format: int64
          minimum: 1
        snapshotId:
          type: string
        runId:
          type: string
        runAdapterVersion:
          type: string
        recordAdapterVersions:
          type: array
          items:
            type: string
        retainedRecordCount:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        snapshotCapturedAt:
          type: string
          format: date-time
    FederatedCompositeCorpusManifest:
      type: object
      required:
        - compositionVersion
        - mode
        - corpusProfile
        - sources
        - federatedRecordCount
        - compositionSha256
        - capturedAt
      properties:
        compositionVersion:
          type: string
        mode:
          type: string
          enum: [COMPOSITE_SNAPSHOT]
        corpusProfile:
          $ref: '#/components/schemas/CorpusProfile'
        sources:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/FederatedCompositeCorpusSource'
        federatedRecordCount:
          type: integer
          format: int64
          minimum: 2
        compositionSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        capturedAt:
          type: string
          format: date-time
    FederatedCompositeCorpusProjectionEvidence:
      type: object
      required:
        - compositionSha256
        - corpusProfile
        - federatedRecordCount
        - projectionId
        - projectionSource
        - projectionObjectCount
        - projectionRebuiltAt
        - linkedAt
      properties:
        compositionSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        corpusProfile:
          $ref: '#/components/schemas/CorpusProfile'
        federatedRecordCount:
          type: integer
          format: int64
          minimum: 1
        projectionId:
          type: string
          pattern: '^[0-9a-f]{64}$'
        projectionSource:
          $ref: '#/components/schemas/RepositorySource'
        projectionObjectCount:
          type: integer
          minimum: 1
        projectionRebuiltAt:
          type: string
          format: date-time
        linkedAt:
          type: string
          format: date-time
    ResearchSpatialSidecarBuildStatus:
      type: string
      enum: [RUNNING, COMPLETE, FAILED]
    ResearchSpatialSidecarBuild:
      type: object
      required:
        - buildId
        - sourceSystem
        - schemaVersion
        - sourceSnapshotAt
        - capturedAt
        - compositionSha256
        - projectionId
        - status
        - rowCount
      properties:
        buildId:
          type: string
        sourceSystem:
          $ref: '#/components/schemas/FederatedSourceSystem'
        schemaVersion:
          type: integer
          minimum: 1
        sourceSnapshotAt:
          type: string
          format: date-time
        capturedAt:
          type: string
          format: date-time
        compositionSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        projectionId:
          type: string
          pattern: '^[0-9a-f]{64}$'
        status:
          $ref: '#/components/schemas/ResearchSpatialSidecarBuildStatus'
        rowCount:
          type: integer
          format: int64
          minimum: 0
        failureMessage:
          type: [string, 'null']
        completedAt:
          type: [string, 'null']
          format: date-time
    DataGovSpatialSidecarRebuildRequest:
      type: object
      properties:
        pageSize:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1000
        maxPages:
          type: integer
          minimum: 1
          maximum: 2000
          default: 2000
    DataGovSpatialSidecarRefreshResult:
      type: object
      required:
        - build
        - pagesFetched
        - sourceRowsFetched
        - publisherShapeRows
        - retainedRows
        - sourceQuarantinedShapeRows
      properties:
        build:
          $ref: '#/components/schemas/ResearchSpatialSidecarBuild'
        pagesFetched:
          type: integer
          minimum: 0
        sourceRowsFetched:
          type: integer
          format: int64
          minimum: 0
        publisherShapeRows:
          type: integer
          format: int64
          minimum: 0
        retainedRows:
          type: integer
          format: int64
          minimum: 0
        sourceQuarantinedShapeRows:
          type: integer
          format: int64
          minimum: 0
    ResearchSpatialGeometryStatus:
      type: string
      enum: [VALID, ANTIMERIDIAN_CANDIDATE, NO_PUBLISHER_GEOMETRY, QUARANTINED]
    ResearchSpatialViewport:
      type: object
      required: [west, south, east, north]
      description: >-
        WGS84 viewport. west greater than east represents a viewport that crosses the
        antimeridian; south must be less than or equal to north.
      properties:
        west:
          type: number
          format: double
          minimum: -180
          maximum: 180
        south:
          type: number
          format: double
          minimum: -90
          maximum: 90
        east:
          type: number
          format: double
          minimum: -180
          maximum: 180
        north:
          type: number
          format: double
          minimum: -90
          maximum: 90
    ResearchSpatialCoverageSummary:
      type: object
      required:
        - matchingRecords
        - mappedRecords
        - unmappedRecords
        - quarantinedRecords
        - unanchoredAntimeridianRecords
        - viewportMappedRecords
        - returnedFeatures
        - omittedFeatures
        - featureLimit
        - truncated
      properties:
        matchingRecords:
          type: integer
          format: int64
          minimum: 0
        mappedRecords:
          type: integer
          format: int64
          minimum: 0
        unmappedRecords:
          type: integer
          format: int64
          minimum: 0
        quarantinedRecords:
          type: integer
          format: int64
          minimum: 0
        unanchoredAntimeridianRecords:
          type: integer
          format: int64
          minimum: 0
        viewportMappedRecords:
          type: integer
          format: int64
          minimum: 0
        returnedFeatures:
          type: integer
          minimum: 0
          maximum: 500
        omittedFeatures:
          type: integer
          format: int64
          minimum: 0
        featureLimit:
          type: integer
          minimum: 1
          maximum: 500
        truncated:
          type: boolean
    ResearchSpatialCoverageFeature:
      type: object
      required:
        - sourceSystem
        - sourceIdentifier
        - title
        - publisher
        - program
        - contentType
        - sourceUrl
        - geometryStatus
        - geometry
        - renderLon
        - renderLat
        - renderPointMethod
      properties:
        sourceSystem:
          $ref: '#/components/schemas/FederatedSourceSystem'
        sourceIdentifier:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        publisher:
          type: string
        program:
          type: string
        contentType:
          $ref: '#/components/schemas/ResearchObjectType'
        sourceUrl:
          type: string
          format: uri
        geometryStatus:
          $ref: '#/components/schemas/ResearchSpatialGeometryStatus'
        geometry:
          type: object
          description: Full publisher GeoJSON geometry retained by the active sidecar build.
          additionalProperties: true
        renderLon:
          type: [number, 'null']
          format: double
          minimum: -180
          maximum: 180
        renderLat:
          type: [number, 'null']
          format: double
          minimum: -90
          maximum: 90
        renderPointMethod:
          type: [string, 'null']
    ResearchSpatialCoverageResponse:
      type: object
      required:
        - buildId
        - sourceSystem
        - schemaVersion
        - sourceSnapshotAt
        - capturedAt
        - compositionSha256
        - projectionId
        - criteriaFingerprint
        - viewport
        - summary
        - features
      properties:
        buildId:
          type: string
          minLength: 1
        sourceSystem:
          $ref: '#/components/schemas/FederatedSourceSystem'
        schemaVersion:
          type: integer
          minimum: 1
        sourceSnapshotAt:
          type: string
          format: date-time
        capturedAt:
          type: string
          format: date-time
        compositionSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        projectionId:
          type: string
          pattern: '^[0-9a-f]{64}$'
        criteriaFingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
        viewport:
          $ref: '#/components/schemas/ResearchSpatialViewport'
        summary:
          $ref: '#/components/schemas/ResearchSpatialCoverageSummary'
        features:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ResearchSpatialCoverageFeature'
    DataGovSpatialSidecarStatusResponse:
      type: object
      required: [activeRowCount]
      properties:
        activeBuild:
          oneOf:
            - $ref: '#/components/schemas/ResearchSpatialSidecarBuild'
            - type: 'null'
        activeRowCount:
          type: integer
          format: int64
          minimum: 0
    FederatedSourceSystem:
      type: string
      enum: [DATA_GOV, DOE_OSTI, NASA_CMR, PUBMED, OPENALEX]
    HarvestRunStatus:
      type: string
      enum: [RUNNING, PAUSED, COMPLETED, FAILED, CANCELLED]
    FederationHarvestResponse:
      type: object
      required:
        - runId
        - sourceSystem
        - adapterVersion
        - status
        - pageSize
        - pageCount
        - acceptedCount
        - rejectedCount
        - skippedCount
        - startedAt
        - updatedAt
        - projectionRefreshRequired
      properties:
        runId:
          type: string
        sourceSystem:
          $ref: '#/components/schemas/FederatedSourceSystem'
        adapterVersion:
          type: string
        status:
          $ref: '#/components/schemas/HarvestRunStatus'
        pageSize:
          type: integer
          minimum: 1
        pageCount:
          type: integer
          minimum: 0
        acceptedCount:
          type: integer
          format: int64
          minimum: 0
        rejectedCount:
          type: integer
          format: int64
          minimum: 0
        skippedCount:
          type: integer
          format: int64
          minimum: 0
        cursor:
          type: string
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        failureMessage:
          type: string
        projectionRefreshRequired:
          type: boolean
    FederationHarvestStatusResponse:
      type: object
      required: [sourceSystem, retainedRecordCount]
      properties:
        sourceSystem:
          $ref: '#/components/schemas/FederatedSourceSystem'
        retainedRecordCount:
          type: integer
          format: int64
          minimum: 0
        resumableRun:
          $ref: '#/components/schemas/FederationHarvestResponse'
        latestRun:
          $ref: '#/components/schemas/FederationHarvestResponse'
    DeploymentTopology:
      type: string
      description: Runtime topology associated with a storage measurement.
      enum: [DOCKER_COMPOSE, KIND_CLUSTER, OTHER]
    CorpusStorageMeasurement:
      type: object
      required:
        - id
        - profile
        - topology
        - activeProjectionCount
        - retainedFederatedCount
        - totalMeasuredLocalBytes
        - capturedAt
      properties:
        id:
          type: string
        profile:
          $ref: '#/components/schemas/CorpusProfile'
        topology:
          $ref: '#/components/schemas/DeploymentTopology'
        activeProjectionCount:
          type: integer
          format: int64
          minimum: 0
          description: Documents in the active Solr/OpenSearch discovery projection at capture time.
        retainedFederatedCount:
          type: integer
          format: int64
          minimum: 0
          description: Federated metadata records retained locally whether or not they are active in search.
        projectionId:
          type: string
          pattern: '^[0-9a-f]{64}$'
        applicationPostgresBytes:
          type: integer
          format: int64
          minimum: 0
          description: PostgreSQL database size when the runtime supports an authoritative measurement.
        dspaceStoredBytes:
          type: integer
          format: int64
          minimum: 0
          description: DSpace ORIGINAL bitstream bytes reported by DSpace.
        solrIndexBytes:
          type: integer
          format: int64
          minimum: 0
          description: Public discovery Solr core index bytes reported by Solr CoreAdmin.
        openSearchIndexBytes:
          type: integer
          format: int64
          minimum: 0
          description: OpenSearch comparison index store bytes reported by index stats.
        totalMeasuredLocalBytes:
          type: integer
          format: int64
          minimum: 0
          description: Sum of known measured components; absent components remain unknown, not zero evidence.
        capturedAt:
          type: string
          format: date-time
    CorpusProfileSummary:
      type: object
      required: [profile, label, active]
      properties:
        profile:
          $ref: '#/components/schemas/CorpusProfile'
        label:
          type: string
        active:
          type: boolean
          description: Whether this profile describes the currently active discovery projection.
        targetFederatedRecordCount:
          type: integer
          format: int64
          minimum: 0
          description: Fixed federated-record target when the profile has one.
        latestMeasurement:
          $ref: '#/components/schemas/CorpusStorageMeasurement'
    CorpusStorageOverview:
      type: object
      required: [activeProfile, profiles, history]
      properties:
        activeProfile:
          $ref: '#/components/schemas/CorpusProfile'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/CorpusProfileSummary'
        history:
          type: array
          items:
            $ref: '#/components/schemas/CorpusStorageMeasurement'

    ResearchObjectOrigin:
      type: string
      description: >-
        Where this individual discovery record is represented locally. REPOSITORY means DSpace is
        authoritative for the curated repository object. FEDERATED means the authoritative object
        remains at an external publisher and the application retains reproducible metadata only.
        FIXTURE means generated fallback/demo content and must never be presented as repository data.
      enum: [REPOSITORY, FEDERATED, FIXTURE]
    SourceSystem:
      type: string
      description: >-
        Controlled authoritative source family for a research object. This is independent of origin:
        a CENSUS object may be represented as REPOSITORY or FIXTURE today, while a DATA_GOV or
        DOE_OSTI object is normally FEDERATED. OTHER is explicit unknown/unclassified provenance and
        must be preferred over guessing from title text.
      enum:
        [CENSUS, USGS, DATA_GOV, DOE_OSTI, NASA_CMR, PUBMED, OPENALEX, OTHER]
    RepositorySource:
      type: string
      description: >-
        Detail/projection compatibility label. REPOSITORY means DSpace-backed curated content,
        FEDERATED means locally retained metadata whose authoritative object remains at an external
        publisher, and FIXTURE means generated placeholder content. For individual authority and
        provenance, use origin and sourceSystem.
      enum: [REPOSITORY, FEDERATED, FIXTURE]
    SearchResponse:
      type: object
      required:
        [query, page, pageSize, totalResults, results, facets, resultSource]
      properties:
        resultSource:
          $ref: '#/components/schemas/RepositorySource'
        query:
          type: string
        page:
          type: integer
        pageSize:
          type: integer
        totalResults:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        facets:
          type: array
          items:
            $ref: '#/components/schemas/FacetGroup'
    SearchCursorPage:
      type: object
      required: [search, nextCursor]
      properties:
        search:
          $ref: '#/components/schemas/SearchResponse'
        nextCursor:
          type: [string, 'null']
          description: >-
            Opaque signed continuation for the next logical page, or null when traversal is
            exhausted. Clients must not decode, edit, or synthesize this value.
    SearchResult:
      type: object
      required:
        [
          id,
          title,
          contentType,
