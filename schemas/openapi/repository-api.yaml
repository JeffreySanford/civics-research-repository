          type: string
        title:
          type: string
        contentType:
          $ref: '#/components/schemas/ResearchObjectType'
        program:
          $ref: '#/components/schemas/ResearchProgram'
          description: Legacy curated classification; federated records may use OTHER.
        programName:
          type: string
          description: Data-driven source program name used for display, filtering, and facets.
        publisher:
          type: string
        summary:
          type: string
        geography:
          type: string
        vintageYear:
          type: integer
        sourceUrl:
          type: string
          format: uri
        accessLevel:
          $ref: '#/components/schemas/AccessLevel'
        origin:
          $ref: '#/components/schemas/ResearchObjectOrigin'
        sourceSystem:
          $ref: '#/components/schemas/SourceSystem'
    FacetGroup:
      type: object
      required: [field, label, values]
      properties:
        field:
