        sourceSystem:
          $ref: '#/components/schemas/SourceSystem'
        localId:
          type: string
          minLength: 1
          maxLength: 2048
          description: Exact canonical research-object identifier stored in both projections.
        doi:
          type: string
          minLength: 1
          maxLength: 300
          description: Exact DOI value stored in both projections, without a doi.org URL prefix.
        geography:
          type: string
        contentType:
          $ref: '#/components/schemas/ResearchObjectType'
        vintageYear:
          type: integer
          format: int32
        page:
          type: integer
          minimum: 0
          default: 0
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    SearchComparisonProjection:
      type: object
      required: [source, objectCount]
      properties:
        projectionId:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 identity of the normalized DiscoveryDocument set supplied to the targets.
        source:
          $ref: '#/components/schemas/RepositorySource'
        objectCount:
          type: integer
          minimum: 0
        rebuiltAt:
          type: string
          format: date-time
    SearchComparisonEngine:
      type: string
      enum: [SOLR, OPENSEARCH]
    SearchEngineComparison:
      type: object
      required:
        [
          engine,
          enabled,
          reachable,
          indexName,
          elapsedMs,
          returnedHits,
          results,
          facets,
        ]
      properties:
        engine:
          $ref: '#/components/schemas/SearchComparisonEngine'
        enabled:
          type: boolean
        reachable:
          type: boolean
        indexName:
          type: string
