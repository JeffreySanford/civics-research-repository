          type: integer
          minimum: 0
        elapsedMs:
          type: integer
          format: int64
          minimum: 0
          description: Local API elapsed time around the engine request, not a production benchmark.
        engineReportedMs:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Timing reported by the engine in the same response that produced these results: Solr
            responseHeader.QTime or OpenSearch took. Vendor definitions differ, so these values are
            diagnostic and are not directly equivalent performance measures.
        totalHits:
          type: integer
          minimum: 0
        returnedHits:
          type: integer
          minimum: 0
        results:
          type: array
