name: civics-research-repository

services:
  repository-api:
    build:
      context: .
      dockerfile: apps/repository-api/Dockerfile
      target: runtime
    image: civics-repository-api:local
    depends_on:
      postgres:
        condition: service_healthy
      solr:
        condition: service_started
    environment:
      CIVICS_SYNC_STARTUP_ENABLED: 'true'
      CIVICS_SYNC_MODE: DRY_RUN
      CIVICS_SYNC_SOURCE: TIGER_LINE
      CIVICS_DSPACE_BASE_URL: http://dspace-rest:8080/server
      CIVICS_SOLR_BASE_URL: http://solr:8983/solr
      CIVICS_STORAGE_ARTIFACTS_PATH: /var/lib/civics/artifacts
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dspace
      SPRING_DATASOURCE_USERNAME: dspace
      SPRING_DATASOURCE_PASSWORD: dspace
    ports:
      - '8080:8080'
    volumes:
      - civics-artifacts:/var/lib/civics/artifacts

  discovery-ui:
    image: node:24-bookworm-slim
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm exec nx reset && pnpm exec nx run discovery-ui:serve --host=0.0.0.0 --skip-nx-cache"
    environment:
      NG_CLI_ANALYTICS: 'false'
      NX_DAEMON: 'false'
      NX_WORKSPACE_DATA_DIRECTORY: /tmp/nx-workspace-data
    ports:
      - '4200:4200'
    volumes:
      - .:/workspace
      - pnpm-store:/root/.local/share/pnpm/store
      - node-modules:/workspace/node_modules
    depends_on:
      - repository-api

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dspace
      POSTGRES_USER: dspace
      POSTGRES_PASSWORD: dspace
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dspace -d dspace']
      interval: 10s
      timeout: 5s
      retries: 5

  solr:
    image: solr:9
    command: ['solr-precreate', 'discovery']
    ports:
      - '8983:8983'
    volumes:
      - solr-data:/var/solr

  dspace-rest:
    profiles: ['dspace']
    image: dspace/dspace:dspace-9.0
    entrypoint:
      - sh
      - -c
      - exec java -jar webapps/server-boot.jar --dspace.dir="$$DSPACE_INSTALL"
    depends_on:
      dspace-db-init:
        condition: service_completed_successfully
      dspace-solr:
        condition: service_healthy
    environment:
      dspace__P__name: Civics Research Repository DSpace
      dspace__P__server__P__url: http://localhost:8081/server
      dspace__P__ui__P__url: http://localhost:4000
      db__P__url: jdbc:postgresql://dspace-postgres:5432/dspace
      db__P__username: dspace
      db__P__password: dspace
      solr__P__server: http://dspace-solr:8983/solr
    ports:
      - '8081:8080'
    volumes:
      - dspace-assetstore:/dspace/assetstore

  dspace-postgres:
    profiles: ['dspace']
    image: dspace/dspace-postgres-pgcrypto:dspace-9.0
    environment:
      POSTGRES_DB: dspace
      POSTGRES_USER: dspace
      POSTGRES_PASSWORD: dspace
    ports:
      - '5433:5432'
    volumes:
      - dspace-postgres-data:/pgdata
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dspace -d dspace']
      interval: 10s
      timeout: 5s
      retries: 10

  dspace-solr:
    profiles: ['dspace']
    image: dspace/dspace-solr:dspace-9.0
    depends_on:
      dspace-solr-init:
        condition: service_completed_successfully
    ports:
      - '8984:8983'
    volumes:
      - dspace-solr-data:/var/solr
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:8983/solr/search/admin/ping >/dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  dspace-solr-init:
    profiles: ['dspace']
    image: dspace/dspace:dspace-9.0
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /var/solr/data
        if [ ! -d /var/solr/data/search ]; then
          cp -R /dspace/solr/. /var/solr/data/
        fi
        chown -R 8983:8983 /var/solr
    volumes:
      - dspace-solr-data:/var/solr

  dspace-db-init:
    profiles: ['dspace']
    image: dspace/dspace:dspace-9.0
    depends_on:
      dspace-postgres:
        condition: service_healthy
      dspace-solr:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - /dspace/bin/dspace database migrate
    environment:
      dspace__P__name: Civics Research Repository DSpace
      dspace__P__server__P__url: http://localhost:8081/server
      dspace__P__ui__P__url: http://localhost:4000
      db__P__url: jdbc:postgresql://dspace-postgres:5432/dspace
      db__P__username: dspace
      db__P__password: dspace
      solr__P__server: http://dspace-solr:8983/solr
    volumes:
      - dspace-assetstore:/dspace/assetstore

  dspace-seed:
    profiles: ['dspace']
    image: dspace/dspace:dspace-9.0
    depends_on:
      dspace-db-init:
        condition: service_completed_successfully
      dspace-solr:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - sh /seed/seed-structure.sh
    environment:
      dspace__P__name: Civics Research Repository DSpace
      dspace__P__server__P__url: http://localhost:8081/server
      dspace__P__ui__P__url: http://localhost:4000
      db__P__url: jdbc:postgresql://dspace-postgres:5432/dspace
      db__P__username: dspace
      db__P__password: dspace
      solr__P__server: http://dspace-solr:8983/solr
    volumes:
      - dspace-assetstore:/dspace/assetstore
      - ./tools/dspace:/seed:ro

volumes:
  civics-artifacts:
  dspace-assetstore:
  dspace-postgres-data:
  dspace-solr-data:
  node-modules:
  pnpm-store:
  postgres-data:
  solr-data:
