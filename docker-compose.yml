name: civics-research-repository

services:
  repository-api:
    build:
      context: .
      dockerfile: apps/repository-api/Dockerfile
      target: runtime
    image: civics-repository-api:local
    depends_on:
      postgres:
        condition: service_healthy
      solr:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      CIVICS_SYNC_STARTUP_ENABLED: '${CIVICS_SYNC_STARTUP_ENABLED:-true}'
      CIVICS_SYNC_MODE: '${CIVICS_SYNC_MODE:-APPLY}'
      CIVICS_SYNC_SOURCE: '${CIVICS_SYNC_SOURCE:-TIGER_LINE}'
      CIVICS_DSPACE_BASE_URL: '${CIVICS_DSPACE_BASE_URL:-http://dspace-rest:8080/server}'
      # Blank by default: without .env the API runs diff-only and never authenticates to DSpace.
      CIVICS_DSPACE_ADMIN_EMAIL: '${CIVICS_DSPACE_ADMIN_EMAIL:-}'
      CIVICS_DSPACE_ADMIN_PASSWORD: '${CIVICS_DSPACE_ADMIN_PASSWORD:-}'
      # Data.gov Catalog API v4 requires X-Api-Key. DEMO_KEY is intentionally sufficient only for
      # bounded local exploration; use a personal api.data.gov key for 100K-scale harvest proofs.
      CIVICS_FEDERATION_DATA_GOV_API_KEY: '${CIVICS_FEDERATION_DATA_GOV_API_KEY:-DEMO_KEY}'
      CIVICS_SOLR_BASE_URL: http://solr:8983/solr
      CIVICS_OPENSEARCH_BASE_URL: http://opensearch:9200
      CIVICS_STORAGE_ARTIFACTS_PATH: /var/lib/civics/artifacts
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/${CIVICS_DB_NAME:-civics_ops}'
      SPRING_DATASOURCE_USERNAME: '${CIVICS_DB_USER:-civics}'
      SPRING_DATASOURCE_PASSWORD: '${CIVICS_DB_PASSWORD:-civics}'
    ports:
      - '8080:8080'
    volumes:
      - civics-artifacts:/var/lib/civics/artifacts

  discovery-ui:
    image: node:24-bookworm-slim
    working_dir: /workspace
    # `rm -rf` on the workspace-data directory replaces the old `nx reset`. A serve process that dies
    # without releasing its task lock leaves the next start waiting forever on "another nx process",
    # and that directory survives `docker restart`. Clearing only the coordination state fixes that
    # while keeping the build cache in NX_CACHE_DIRECTORY, which `nx reset` used to throw away.
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && rm -rf /tmp/nx-workspace-data && pnpm exec nx run discovery-ui:serve --host=0.0.0.0"
    environment:
      NG_CLI_ANALYTICS: 'false'
      NX_DAEMON: 'false'
      NX_WORKSPACE_DATA_DIRECTORY: /tmp/nx-workspace-data
      # The workspace is bind-mounted, so Nx's default `.nx/cache` is the *host* cache with Windows
      # paths in it. Sharing it with the Linux container is what made `nx reset` and
      # `--skip-nx-cache` necessary on every start. A container-owned cache volume keeps the two
      # separate and lets caching actually work.
      NX_CACHE_DIRECTORY: /nx-cache
      # Corepack re-downloaded the pnpm tarball on every start because its cache lived in the
      # container layer. The cache below persists it; this just silences the download prompt.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    ports:
      - '4200:4200'
    volumes:
      - .:/workspace
      - pnpm-store:/root/.local/share/pnpm/store
      - node-modules:/workspace/node_modules
      - corepack-cache:/root/.cache/node/corepack
      - nx-cache:/nx-cache
    depends_on:
      - repository-api

  # Application operational state only — currently just sync_jobs. This is NOT the repository
  # database; DSpace owns its own PostgreSQL (dspace-postgres, :5433). Both were previously named
  # `dspace`, which invited the reading that the application writes into DSpace's schema.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: '${CIVICS_DB_NAME:-civics_ops}'
      POSTGRES_USER: '${CIVICS_DB_USER:-civics}'
      POSTGRES_PASSWORD: '${CIVICS_DB_PASSWORD:-civics}'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "${CIVICS_DB_USER:-civics}" -d "${CIVICS_DB_NAME:-civics_ops}"',
        ]
      start_interval: 2s
      start_period: 60s
      interval: 60s
      timeout: 5s
      retries: 3

  # The public discovery projection: a rebuildable index of DSpace items, owned by repository-api
  # and never a source of truth. Distinct from dspace-solr (:8984), which holds DSpace's own
  # internal cores. Rebuild at any time with `pnpm run reindex`.
  solr:
    image: solr:9
    command: ['solr-precreate', 'discovery']
    ports:
      - '8983:8983'
    volumes:
      - solr-data:/var/solr
    # Without this, repository-api could only wait for the container to start, not for Solr to
    # answer queries. Losing that race is silent: startup indexing logs a warning and the API
    # serves the fixture fallback instead.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS "http://localhost:8983/solr/discovery/admin/ping?wt=json" | grep -q ''"status":"OK"''',
        ]
      # start_interval applies only while the container is still starting, so Solr is probed every
      # 2s until it is healthy and then once a minute. A flat 5s interval kept probing forever, and
      # Solr logs every /admin/ping at INFO, so an attached `start:all` filled with ping lines long
      # after startup finished and buried anything worth reading.
      start_interval: 2s
      start_period: 120s
      interval: 60s
      timeout: 5s
      retries: 3

  # Parallel search engine reserved for the side-by-side comparison demo. Once the comparison
  # projection is implemented, it will be rebuilt from DSpace items and never used as a source of
  # truth.
  opensearch:
    image: opensearchproject/opensearch:2.19.6
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
      - '9600:9600'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:9200/_cluster/health >/dev/null',
        ]
      start_interval: 5s
      start_period: 180s
      interval: 60s
      timeout: 10s
      retries: 5

  dspace-rest:
    profiles: ['dspace']
    image: dspace/dspace:dspace-9.0
    entrypoint:
      - sh
      - -c
      - exec java -jar webapps/server-boot.jar --dspace.dir="$$DSPACE_INSTALL"
    depends_on:
      dspace-db-init:
        condition: service_completed_successfully
      dspace-solr:
        condition: service_healthy
    environment:
      dspace__P__name: Civics Research Repository DSpace
      dspace__P__server__P__url: http://localhost:8081/server
      dspace__P__ui__P__url: http://localhost:4000
      db__P__url: jdbc:postgresql://dspace-postgres:5432/dspace
      db__P__username: dspace
      db__P__password: dspace
      solr__P__server: http://dspace-solr:8983/solr
    ports:
      - '8081:8080'
    volumes:
      - dspace-assetstore:/dspace/assetstore

  # The repository system of record. Owned and migrated by DSpace itself.
  dspace-postgres:
    profiles: ['dspace']
    image: dspace/dspace-postgres-pgcrypto:dspace-9.0
    environment:
      POSTGRES_DB: dspace
      POSTGRES_USER: dspace
      POSTGRES_PASSWORD: dspace
    ports:
      - '5433:5432'
    volumes:
      # Must match PGDATA in the dspace-postgres image (/var/lib/postgresql/data). This was
      # previously mounted at /pgdata, which left the volume empty and kept the entire DSpace
      # database in the container's writable layer — so removing the container destroyed the
      # repository, seed and all.
      - dspace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dspace -d dspace']
      interval: 10s
      timeout: 5s
      retries: 10

  dspace-solr:
    profiles: ['dspace']
    image: dspace/dspace-solr:dspace-9.0
    depends_on:
      dspace-solr-init:
        condition: service_completed_successfully
    ports:
      - '8984:8983'
    volumes:
      - dspace-solr-data:/var/solr
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:8983/solr/search/admin/ping >/dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  dspace-solr-init:
    profiles: ['dspace']
    image: dspace/dspace:dspace-9.0
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /var/solr/data
        if [ ! -d /var/solr/data/search ]; then
          cp -R /dspace/solr/. /var/solr/data/
        fi
        chown -R 8983:8983 /var/solr
    volumes:
      - dspace-solr-data:/var/solr

  dspace-db-init:
    profiles: ['dspace']
    image: dspace/dspace:dspace-9.0
    depends_on:
      dspace-postgres:
        condition: service_healthy
      dspace-solr:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - /dspace/bin/dspace database migrate
    environment:
      dspace__P__name: Civics Research Repository DSpace
      dspace__P__server__P__url: http://localhost:8081/server
      dspace__P__ui__P__url: http://localhost:4000
      db__P__url: jdbc:postgresql://dspace-postgres:5432/dspace
      db__P__username: dspace
      db__P__password: dspace
      solr__P__server: http://dspace-solr:8983/solr
    volumes:
      - dspace-assetstore:/dspace/assetstore

  dspace-seed:
    profiles: ['dspace']
    image: dspace/dspace:dspace-9.0
    depends_on:
      dspace-db-init:
        condition: service_completed_successfully
      dspace-solr:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - sh /seed/seed-structure.sh
    environment:
      DSPACE_SEED_ADMIN_EMAIL: '${DSPACE_SEED_ADMIN_EMAIL:-admin@civics.local}'
      DSPACE_SEED_ADMIN_PASSWORD: '${DSPACE_SEED_ADMIN_PASSWORD:-civics-admin}'
      dspace__P__name: Civics Research Repository DSpace
      dspace__P__server__P__url: http://localhost:8081/server
      dspace__P__ui__P__url: http://localhost:4000
      db__P__url: jdbc:postgresql://dspace-postgres:5432/dspace
      db__P__username: dspace
      db__P__password: dspace
      solr__P__server: http://dspace-solr:8983/solr
    volumes:
      - dspace-assetstore:/dspace/assetstore
      - ./tools/dspace:/seed:ro

volumes:
  civics-artifacts:
  corepack-cache:
  dspace-assetstore:
  dspace-postgres-data:
  dspace-solr-data:
  node-modules:
  nx-cache:
  opensearch-data:
  pnpm-store:
  postgres-data:
  solr-data:
